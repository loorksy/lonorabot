[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora"
version = "0.1.0"
description = "Persistent AI agents with durable memory and background work"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.8,<1"]

[project.scripts]
lonora-admin = "lonora.admin:main"

[tool.setuptools.packages.find]
include = ["lonora*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
