name: Publish server image
on:
  push: {branches: [main], tags: ['v*']}
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/loorksy/lonorabot
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Stamped into /app/release.json, which `lonora update` reads before installing.
          build-args: |
            LONORA_VERSION=${{ github.ref_name }}
            LONORA_GIT_SHA=${{ github.sha }}
            LONORA_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
