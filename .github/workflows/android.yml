name: Lonora Android
on:
  push:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Build signed release APK + AAB (requires the signing secrets)'
        type: boolean
        default: false

# Release signing comes only from repository secrets; nothing secret is stored in the tree:
#   LONORA_ANDROID_KEYSTORE_BASE64  base64 of the PKCS12/JKS upload keystore
#   LONORA_ANDROID_KEYSTORE_PASSWORD, LONORA_ANDROID_KEY_ALIAS, LONORA_ANDROID_KEY_PASSWORD

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xJf flutter.tar.xz
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: lonora-android-debug-${{ github.run_number }}
          path: apps/android/build/app/outputs/flutter-apk/app-debug.apk

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xJf flutter.tar.xz
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Restore the upload keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.LONORA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing LONORA_ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lonora-upload.keystore"
          echo "LONORA_ANDROID_KEYSTORE=$RUNNER_TEMP/lonora-upload.keystore" >> "$GITHUB_ENV"
      - name: Release APK and App Bundle
        env:
          LONORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LONORA_ANDROID_KEYSTORE_PASSWORD }}
          LONORA_ANDROID_KEY_ALIAS: ${{ secrets.LONORA_ANDROID_KEY_ALIAS }}
          LONORA_ANDROID_KEY_PASSWORD: ${{ secrets.LONORA_ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          flutter build apk --release --build-number=$BUILD_NUMBER
          flutter build appbundle --release --build-number=$BUILD_NUMBER
          python3 tool/release_manifest.py build/app/outputs/flutter-apk/app-release.apk > build/lonora-android.json
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lonora-upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: lonora-android-release-${{ github.run_number }}
          path: |
            apps/android/build/app/outputs/flutter-apk/app-release.apk
            apps/android/build/app/outputs/bundle/release/app-release.aab
            apps/android/build/lonora-android.json
