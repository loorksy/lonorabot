name: Validate Lonora
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lonora_ci
          POSTGRES_USER: lonora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lonora -d lonora_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LONORA_DATABASE_URL: postgresql+asyncpg://lonora:ci-only-password@127.0.0.1:5432/lonora_ci
      # Disposable CI fixtures; production installation generates fresh private keys.
      LONORA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      LONORA_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-32-characters
      LONORA_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: pnpm/action-setup@v4
        with: {version: 11.25.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - name: Prepare verified offline model tokenizers
        run: .venv/bin/python scripts/cache_model_tokenizers.py
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build.sh
      - run: bash scripts/migrate.sh
      - name: Verify live teammate directory and selected group replies
        run: |
          .venv/bin/python tests/check_team.py
          .venv/bin/python tests/check_group_replies.py
          .venv/bin/python tests/check_broker_discovery.py
          .venv/bin/python tests/check_market_runtime.py
          .venv/bin/python tests/check_chart_tools.py
          .venv/bin/python tests/check_chart_history.py
          .venv/bin/python tests/check_generated_artifacts.py
          .venv/bin/python tests/check_trading.py
          .venv/bin/python tests/check_trading_mode.py
          .venv/bin/python tests/check_attention_items.py
          .venv/bin/python tests/check_metaapi_adapter.py
          .venv/bin/python tests/check_broker_history.py
          .venv/bin/python tests/check_broker_recovery.py
          .venv/bin/python tests/check_trade_approvals.py
          .venv/bin/python tests/check_bound_market.py
          .venv/bin/python tests/check_agent_binding.py
          .venv/bin/python tests/check_flexible_agents.py
          .venv/bin/python tests/check_owner_trades.py
          .venv/bin/python tests/check_broker_orders.py
          .venv/bin/python tests/check_pending_orders.py
          .venv/bin/python tests/check_chart_streaming.py
          .venv/bin/python tests/check_agent_market.py
          .venv/bin/python tests/check_agent_create.py
          .venv/bin/python tests/check_supervision.py
          .venv/bin/python tests/check_trusted_sources.py

      - name: Verify coherent shared foundations in isolated PostgreSQL databases
        run: .venv/bin/python tests/run_foundation_checks.py --isolated-databases
      - name: Verify shared permission proposal construction, financial-boundary, safety and owner-profile texts
        run: pnpm exec tsx --test tests/web/agent-permission.test.ts tests/web/account-authority.test.ts tests/web/financial-boundary.test.ts tests/web/trading-readiness.test.ts tests/web/held-operation.test.ts tests/web/owner-actions.test.ts tests/web/owner-profile.test.ts tests/web/one-vocabulary.test.ts tests/web/agent-model.test.ts tests/web/agent-create.test.ts tests/web/agent-status.test.ts tests/web/supervision.test.ts tests/web/capabilities.test.ts tests/web/secret-card.test.ts tests/web/model-provider-card.test.ts tests/web/inbox-order.test.ts tests/web/chat-rows.test.ts tests/web/shell-routes.test.ts tests/web/message-parts.test.ts tests/web/order-state.test.ts tests/web/chart-geometry.test.ts tests/web/ticket-action.test.ts tests/web/genui-engine.test.ts tests/web/genui-parity.test.ts tests/web/thread-questions.test.ts tests/web/chat-prefs.test.ts tests/web/composer-commands.test.ts tests/web/composer-mentions.test.ts tests/web/first-frame.test.ts tests/web/owner-name.test.ts tests/web/popover-morph.test.ts tests/web/reveal.test.ts tests/web/app-open.test.ts
      - name: Verify native sessions and concurrent persistent conversations
        run: .venv/bin/python tests/check_clients.py
      - name: Verify durable reply streams and idempotent peer communication
        run: .venv/bin/python tests/check_streaming.py
      - name: Install browser for actual workspace regressions
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify real Web workspace under React StrictMode
        run: pnpm test:web
      - name: Verify real Expo companion against Python API
        run: pnpm test:mobile

      - name: Verify signed mobile OTA service and safe client update lifecycle
        run: |
          .venv/bin/python -m pytest tests/test_mobile_updates.py -q
          pnpm exec tsx --test tests/mobile/ota-checker.test.ts tests/mobile/voice-transport.test.ts tests/mobile/voice-readiness.test.ts tests/mobile/conversation-timeline.test.ts tests/mobile/mention-session.test.ts tests/mobile/reach-me.test.ts tests/mobile/text-direction.test.ts tests/mobile/search-feed.test.ts tests/mobile/routine-title.test.ts tests/mobile/commands.test.ts tests/mobile/order-lines.test.ts tests/mobile/offline-queue.test.ts tests/mobile/message-actions.test.ts tests/mobile/mandate-mode.test.ts tests/mobile/arabic-labels.test.ts tests/mobile/run-retry.test.ts tests/mobile/composer-uploads.test.ts tests/mobile/draft-store.test.ts tests/mobile/run-thread.test.ts

      - name: Guard model access, API keys only and one engine (mandate 12.2, P4)
        run: .venv/bin/python -m pytest tests/test_model_access_guard.py -q

      - name: Verify GPT-Live admission and delegation with explicit API fixtures
        run: .venv/bin/python -m pytest tests/voice -q
