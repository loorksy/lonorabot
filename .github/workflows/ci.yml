name: Validate Lonora
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lonora_ci
          POSTGRES_USER: lonora
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lonora -d lonora_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The service above. The gate creates and drops its own databases there, and sets its
      # own CI-only fixtures (scripts/gate.sh).
      LONORA_DATABASE_URL: postgresql+asyncpg://lonora:ci-only-password@127.0.0.1:5432/lonora_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: pnpm/action-setup@v4
        with: {version: 11.25.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - name: Prepare verified offline model tokenizers
        run: .venv/bin/python scripts/cache_model_tokenizers.py
      - run: pnpm install --frozen-lockfile
      - name: Install the browser for the Playwright suites
        run: pnpm exec playwright install --with-deps chromium
      - name: The one gate (VISION 14.1.2)
        run: bash scripts/gate.sh
