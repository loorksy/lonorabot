[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-memory"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.28,<0.29", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "lonora-providers==0.2.0", "lonora-session==0.2.0", "sqlalchemy[asyncio]>=2.0.36,<3"]

[tool.setuptools.packages.find]
where = ["src"]
