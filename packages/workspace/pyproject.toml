[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-workspace"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-core==0.2.0", "lonora-security==0.2.0", "httpx>=0.27,<1", "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn[standard]>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
