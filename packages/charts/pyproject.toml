[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-charts"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-adapters==0.2.0", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "lonora-market==0.2.0", "Pillow>=11,<13"]

[tool.setuptools.packages.find]
where = ["src"]
