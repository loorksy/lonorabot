[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-logging"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-core==0.2.0", "lonora-security==0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
