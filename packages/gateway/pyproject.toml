[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-gateway"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-adapter-kit==0.2.0", "lonora-adapters==0.2.0", "lonora-agent==0.2.0", "lonora-automation==0.2.0", "lonora-bus==0.2.0", "lonora-channels==0.2.0", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "lonora-market==0.2.0", "lonora-providers==0.2.0", "lonora-tools==0.2.0", "lonora-trading==0.2.0", "lonora-voice==0.2.0", "sqlalchemy[asyncio]>=2.0.36,<3"]

[tool.setuptools.packages.find]
where = ["src"]
