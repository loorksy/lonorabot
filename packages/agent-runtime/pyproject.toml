[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-agent"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-adapter-kit==0.2.0", "lonora-automation==0.2.0", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "lonora-llm-usage==0.2.0", "lonora-memory==0.2.0", "lonora-security==0.2.0", "lonora-session==0.2.0", "lonora-tools==0.2.0", "sqlalchemy[asyncio]>=2.0.36,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/lonora/prompts" = ["packages/agent-runtime/resources/prompts/group_behavior.md", "packages/agent-runtime/resources/prompts/identity.md", "packages/agent-runtime/resources/prompts/memory_policy.md", "packages/agent-runtime/resources/prompts/subagent_system.md", "packages/agent-runtime/resources/prompts/tool_contract.md", "packages/agent-runtime/resources/prompts/trading_context.md", "packages/agent-runtime/resources/prompts/untrusted_content.md"]
"share/lonora/skills/chart-analysis" = ["packages/agent-runtime/resources/skills/chart-analysis/SKILL.md"]
"share/lonora/skills/market-analysis" = ["packages/agent-runtime/resources/skills/market-analysis/SKILL.md"]
"share/lonora/skills/memory" = ["packages/agent-runtime/resources/skills/memory/SKILL.md"]
"share/lonora/skills/research" = ["packages/agent-runtime/resources/skills/research/SKILL.md"]
"share/lonora/skills/trade-management" = ["packages/agent-runtime/resources/skills/trade-management/SKILL.md"]
