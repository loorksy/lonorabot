[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-agent"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-adapter-kit==0.2.0", "lonora-automation==0.2.0", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "lonora-llm-usage==0.2.0", "lonora-memory==0.2.0", "lonora-security==0.2.0", "lonora-session==0.2.0", "lonora-tools==0.2.0", "sqlalchemy[asyncio]>=2.0.36,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
workspace-host = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/lonora/bootstrap" = ["packages/agent-runtime/resources/bootstrap/*.md", "packages/agent-runtime/resources/bootstrap/LICENSE.nanobot"]
"share/lonora/system" = ["packages/agent-runtime/resources/system/lonora.md", "packages/agent-runtime/resources/system/manifest.json"]
"share/lonora/constitution" = ["packages/agent-runtime/resources/constitution/collaboration-policy.md", "packages/agent-runtime/resources/constitution/identity.md", "packages/agent-runtime/resources/constitution/memory-policy.md", "packages/agent-runtime/resources/constitution/security-policy.md", "packages/agent-runtime/resources/constitution/tool-policy.md", "packages/agent-runtime/resources/constitution/trading-policy.md"]
"share/lonora/prompts" = ["packages/agent-runtime/resources/prompts/*.md"]
"share/lonora/skills/chart-analysis" = ["packages/agent-runtime/resources/skills/chart-analysis/SKILL.md", "packages/agent-runtime/resources/skills/chart-analysis/skill.json"]
"share/lonora/skills/lonora-design" = ["packages/agent-runtime/resources/skills/lonora-design/SKILL.md", "packages/agent-runtime/resources/skills/lonora-design/skill.json"]
"share/lonora/skills/market-analysis" = ["packages/agent-runtime/resources/skills/market-analysis/SKILL.md", "packages/agent-runtime/resources/skills/market-analysis/skill.json"]
"share/lonora/skills/market-watch" = ["packages/agent-runtime/resources/skills/market-watch/SKILL.md", "packages/agent-runtime/resources/skills/market-watch/skill.json"]
"share/lonora/skills/memory" = ["packages/agent-runtime/resources/skills/memory/SKILL.md", "packages/agent-runtime/resources/skills/memory/skill.json"]
"share/lonora/skills/position-management" = ["packages/agent-runtime/resources/skills/position-management/SKILL.md", "packages/agent-runtime/resources/skills/position-management/skill.json"]
"share/lonora/skills/research" = ["packages/agent-runtime/resources/skills/research/SKILL.md", "packages/agent-runtime/resources/skills/research/skill.json"]
"share/lonora/skills/trade-management" = ["packages/agent-runtime/resources/skills/trade-management/SKILL.md", "packages/agent-runtime/resources/skills/trade-management/skill.json"]
