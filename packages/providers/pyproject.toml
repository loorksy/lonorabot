[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-providers"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-adapter-kit==0.2.0", "lonora-adapters==0.2.0", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
