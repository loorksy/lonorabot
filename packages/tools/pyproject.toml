[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-tools"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.28,<0.29", "lonora-adapter-kit==0.2.0", "lonora-adapters==0.2.0", "lonora-agent==0.2.0", "lonora-charts==0.2.0", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "lonora-market==0.2.0", "lonora-memory==0.2.0", "lonora-providers==0.2.0", "lonora-security==0.2.0", "lonora-session==0.2.0", "lonora-trading==0.2.0", "pydantic>=2.10,<3", "sqlalchemy[asyncio]>=2.0.36,<3"]

[tool.setuptools.packages.find]
where = ["src"]
