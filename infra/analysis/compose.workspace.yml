# Optional overlay for the analysis workspace host (lonora-analysis.service). The socket
# directory is created if missing, so the API and Gateway start without the host service
# (after a reboot, Docker may start first; or the service is stopped): analysis tools then
# report the host unavailable until the service creates /run/lonora-analysis/host.sock in
# that same directory (systemd reuses an existing RuntimeDirectory). There is deliberately
# no Docker socket mount or application credential here.
services:
  api:
    group_add:
      - "10001"
    environment:
      LONORA_WORKSPACE_SOCKET: /run/lonora-analysis/host.sock
    volumes:
      - type: bind
        source: /run/lonora-analysis
        target: /run/lonora-analysis
        read_only: true
        bind:
          create_host_path: true
  gateway:
    group_add:
      - "10001"
    environment:
      LONORA_WORKSPACE_SOCKET: /run/lonora-analysis/host.sock
    volumes:
      - type: bind
        source: /run/lonora-analysis
        target: /run/lonora-analysis
        read_only: true
        bind:
          create_host_path: true
