# The one canonical production deployment. `lonora` (infra/compose/lonora) drives it:
# it pins LONORA_IMAGE to a digest in state/image.env, runs `migrate` as its own step,
# adds mode-direct.yml (Caddy on 80/443) or mode-proxy.yml (Caddy on one loopback port
# behind an existing reverse proxy), and the overlays listed in LONORA_COMPOSE_OVERLAYS.
# The project name (LONORA_PROJECT) prefixes every container, volume and network, so a
# second installation can run beside another. Every service has memory and CPU limits,
# overridable in .env; the defaults fit the stack in about 3.4 GB on a 2-vCPU host.
# Web search (SearXNG) and the research browser are part of the stack. Only the gateway
# joins their bridge; they have no database network, application secrets, application
# volumes or published host ports. Neither the gateway nor `lonora` waits for them: a search
# or a browse while they are down is a tool error, never a gateway, update or start that fails.
# See docs/operations.md.
name: ${LONORA_PROJECT:-lonora}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lonora
      POSTGRES_USER: lonora
      POSTGRES_PASSWORD: ${LONORA_POSTGRES_PASSWORD:?set a strong production database password}
    volumes: ["database:/var/lib/postgresql/data"]
    mem_limit: ${LONORA_DB_MEMORY:-512m}
    cpus: ${LONORA_DB_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lonora -d lonora"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    env_file: ../../.env
    environment: &runtime
      LONORA_DATABASE_URL: postgresql+asyncpg://lonora:${LONORA_POSTGRES_PASSWORD:?set password}@db:5432/lonora
      LONORA_ALLOWED_ORIGIN: https://${LONORA_DOMAIN:?set public domain}
      LONORA_COOKIE_SECURE: "true"
      LONORA_CHART_RENDERER_URL: http://api:8000/charts/render
      LONORA_CHART_BROWSER_EXECUTABLE: /usr/bin/chromium
      # Only the trusted internal renderer is loaded; keep container capabilities
      # dropped and no-new-privileges rather than granting browser host privileges.
      LONORA_CHART_BROWSER_SANDBOX: "false"
      LONORA_OTA_ROOT: /app/releases/ota
      LONORA_ANDROID_APK_PATH: /app/releases/android/lonora.apk
      LONORA_MIGRATE_ON_START: "false"
    command: ["api"]
    volumes: ["artifacts:/app/.runtime/artifacts", "../../.runtime/releases/android:/app/releases/android:ro", "../../.runtime/releases/ota:/app/releases/ota:ro"]
    mem_limit: ${LONORA_API_MEMORY:-896m}
    cpus: ${LONORA_API_CPUS:-0.75}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  migrate:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    profiles: ["tools"]
    env_file: ../../.env
    environment: *runtime
    command: ["migrate"]
    mem_limit: ${LONORA_MIGRATE_MEMORY:-512m}
    cpus: ${LONORA_MIGRATE_CPUS:-0.5}
    depends_on:
      db: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  gateway:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      <<: *runtime
      # Overridable in .env, e.g. to use an existing SearXNG elsewhere.
      LONORA_SEARXNG_URL: ${LONORA_SEARXNG_URL:-http://searxng:8080}
      LONORA_BROWSER_URL: ${LONORA_BROWSER_URL:-http://browser:8090}
    networks: [default, research]
    command: ["gateway"]
    volumes: ["artifacts:/app/.runtime/artifacts"]
    mem_limit: ${LONORA_GATEWAY_MEMORY:-768m}
    cpus: ${LONORA_GATEWAY_CPUS:-0.75}
    depends_on:
      api: {condition: service_healthy}
    stop_grace_period: 40s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  searxng:
    image: ghcr.io/searxng/searxng@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
    restart: unless-stopped
    user: searxng
    entrypoint: [/bin/sh, -c]
    command:
      - export SEARXNG_SECRET="$$(python -c 'import secrets; print(secrets.token_hex(32))')"; exec /usr/local/searxng/.venv/bin/granian searx.webapp:app
    volumes:
      - ../research/searxng.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0:8080
    networks: [research]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/searxng:size=64m,mode=1777
    mem_limit: ${LONORA_SEARXNG_MEMORY:-384m}
    cpus: ${LONORA_SEARXNG_CPUS:-0.25}
    pids_limit: 128
  browser:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    command: [python, -m, lonora_tools.browser_service]
    environment:
      BROWSER_EXECUTABLE: /usr/bin/chromium
      # Container isolation, no host privileges, no app secrets or shared files.
      BROWSER_SANDBOX: "false"
      HOME: /tmp
    networks: [research]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${LONORA_BROWSER_MEMORY:-768m}
    cpus: ${LONORA_BROWSER_CPUS:-0.5}
    pids_limit: 256
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Published ports come from mode-direct.yml or mode-proxy.yml.
    environment:
      LONORA_DOMAIN: ${LONORA_DOMAIN:?set public domain}
    volumes: ["./Caddyfile.prod:/etc/caddy/Caddyfile:ro", "../../maintenance:/maintenance:ro", "caddy-data:/data", "caddy-config:/config"]
    mem_limit: ${LONORA_CADDY_MEMORY:-96m}
    cpus: ${LONORA_CADDY_CPUS:-0.25}
    depends_on: [api]
networks:
  default:
  research:
volumes:
  database:
  artifacts:
  caddy-data:
  caddy-config:
