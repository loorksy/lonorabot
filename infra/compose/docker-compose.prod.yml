# The one canonical production deployment. `lonora` (infra/compose/lonora) drives it:
# it pins LONORA_IMAGE to a digest in state/image.env, runs `migrate` as its own step,
# adds mode-direct.yml (Caddy on 80/443) or mode-proxy.yml (Caddy on one loopback port
# behind an existing reverse proxy), and the overlays listed in LONORA_COMPOSE_OVERLAYS.
# The project name (LONORA_PROJECT) prefixes every container, volume and network, so a
# second installation can run beside another. Every service has memory and CPU limits,
# overridable in .env; Lonora's own defaults fit in about 3.4 GB on a 2-vCPU host.
# Web search (SearXNG) and the research browser are part of the stack. Only the gateway
# joins their bridge; they have no database network, application secrets, application
# volumes or published host ports. Neither the gateway nor `lonora` waits for them: a search
# or a browse while they are down is a tool error, never a gateway, update or start that fails.
# The owner's workspace (7.1) adds 4 GiB, 2 CPUs and a 20 GiB disk by default, with a low
# CPU weight and the highest OOM score, and the database, API and Gateway reserve their
# memory, so the workspace yields first under contention. See docs/operations.md.
name: ${LONORA_PROJECT:-lonora}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lonora
      POSTGRES_USER: lonora
      POSTGRES_PASSWORD: ${LONORA_POSTGRES_PASSWORD:?set a strong production database password}
    volumes: ["database:/var/lib/postgresql/data"]
    mem_limit: ${LONORA_DB_MEMORY:-512m}
    mem_reservation: ${LONORA_DB_MEMORY:-512m}
    cpus: ${LONORA_DB_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lonora -d lonora"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    env_file: ../../.env
    environment: &runtime
      LONORA_DATABASE_URL: postgresql+asyncpg://lonora:${LONORA_POSTGRES_PASSWORD:?set password}@db:5432/lonora
      LONORA_ALLOWED_ORIGIN: https://${LONORA_DOMAIN:?set public domain}
      LONORA_COOKIE_SECURE: "true"
      LONORA_CHART_RENDERER_URL: http://api:8000/charts/render
      LONORA_CHART_BROWSER_EXECUTABLE: /usr/bin/chromium
      # Only the trusted internal renderer is loaded; keep container capabilities
      # dropped and no-new-privileges rather than granting browser host privileges.
      LONORA_CHART_BROWSER_SANDBOX: "false"
      LONORA_OTA_ROOT: /app/releases/ota
      LONORA_ANDROID_APK_PATH: /app/releases/android/lonora.apk
      LONORA_MIGRATE_ON_START: "false"
    command: ["api"]
    # cli-socket holds the `lonora` CLI endpoint's Unix socket (7.3); Caddy never serves it.
    volumes: ["artifacts:/app/.runtime/artifacts", "cli-socket:/app/.runtime/cli", "../../.runtime/releases/android:/app/releases/android:ro", "../../.runtime/releases/ota:/app/releases/ota:ro"]
    mem_limit: ${LONORA_API_MEMORY:-896m}
    mem_reservation: ${LONORA_API_MEMORY:-896m}
    cpus: ${LONORA_API_CPUS:-0.75}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  migrate:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    profiles: ["tools"]
    env_file: ../../.env
    environment: *runtime
    command: ["migrate"]
    mem_limit: ${LONORA_MIGRATE_MEMORY:-512m}
    cpus: ${LONORA_MIGRATE_CPUS:-0.5}
    depends_on:
      db: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  gateway:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      <<: *runtime
      # Overridable in .env, e.g. to use an existing SearXNG elsewhere.
      LONORA_SEARXNG_URL: ${LONORA_SEARXNG_URL:-http://searxng:8080}
      LONORA_BROWSER_URL: ${LONORA_BROWSER_URL:-http://browser:8090}
    networks: [default, research]
    command: ["gateway"]
    # The workspace supervisor's socket (root:10001 0750 directory): the Gateway's road in.
    volumes: ["artifacts:/app/.runtime/artifacts", "workspace-control:/run/lonora-workspace"]
    mem_limit: ${LONORA_GATEWAY_MEMORY:-768m}
    mem_reservation: ${LONORA_GATEWAY_MEMORY:-768m}
    cpus: ${LONORA_GATEWAY_CPUS:-0.75}
    # The highest CPU weight: reconciliation of uncertain operations never waits.
    cpu_shares: 2048
    depends_on:
      api: {condition: service_healthy}
    stop_grace_period: 40s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  searxng:
    image: ghcr.io/searxng/searxng@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
    restart: unless-stopped
    user: searxng
    entrypoint: [/bin/sh, -c]
    command:
      - export SEARXNG_SECRET="$$(python -c 'import secrets; print(secrets.token_hex(32))')"; exec /usr/local/searxng/.venv/bin/granian searx.webapp:app
    volumes:
      - ../research/searxng.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BIND_ADDRESS: 0.0.0.0:8080
    networks: [research]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/searxng:size=64m,mode=1777
    mem_limit: ${LONORA_SEARXNG_MEMORY:-384m}
    cpus: ${LONORA_SEARXNG_CPUS:-0.25}
    pids_limit: 128
  browser:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    command: [python, -m, lonora_tools.browser_service]
    environment:
      BROWSER_EXECUTABLE: /usr/bin/chromium
      # Container isolation, no host privileges, no app secrets or shared files.
      BROWSER_SANDBOX: "false"
      HOME: /tmp
    networks: [research]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${LONORA_BROWSER_MEMORY:-768m}
    cpus: ${LONORA_BROWSER_CPUS:-0.5}
    pids_limit: 256
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Published ports come from mode-direct.yml or mode-proxy.yml.
    environment:
      LONORA_DOMAIN: ${LONORA_DOMAIN:?set public domain}
    volumes: ["./Caddyfile.prod:/etc/caddy/Caddyfile:ro", "../../maintenance:/maintenance:ro", "caddy-data:/data", "caddy-config:/config"]
    mem_limit: ${LONORA_CADDY_MEMORY:-96m}
    cpus: ${LONORA_CADDY_CPUS:-0.25}
    depends_on: [api]
  # The owner's workspace (7.1): one persistent Linux workspace shared by every agent.
  # workspace-net owns the network namespace and filters it (no route to Lonora, private
  # ranges, Lonora's own address or MetaApi); the workspace joins that namespace and has no
  # network capability. Neither has the Docker socket, the .env file or any Lonora secret.
  workspace-net:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    user: "0:0"
    command: ["python", "-m", "lonora_workspace.netguard"]
    environment:
      LONORA_DOMAIN: ${LONORA_DOMAIN:?set public domain}
      LONORA_WORKSPACE_BLOCKED_ADDRESSES: ${LONORA_WORKSPACE_BLOCKED_ADDRESSES:-}
      LONORA_WORKSPACE_BLOCKED_DOMAINS: ${LONORA_WORKSPACE_BLOCKED_DOMAINS:-}
      # The host's own addresses, found by `lonora` each time it starts the stack.
      LONORA_WORKSPACE_HOST_ADDRESSES: ${LONORA_WORKSPACE_HOST_ADDRESSES:-}
    networks: [workspace]
    # It also relays every agent TCP connection (relay.py).
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-m", "lonora_workspace.netguard", "--check"]
      interval: 10s
      timeout: 6s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN", "NET_BIND_SERVICE"]
  workspace:
    image: ${LONORA_IMAGE:-ghcr.io/loorksy/lonorabot:main}
    restart: unless-stopped
    user: "0:0"
    init: true
    command: ["python", "-m", "lonora_workspace.supervisor"]
    network_mode: "service:workspace-net"
    environment:
      LONORA_WORKSPACE_FOREGROUND_SECONDS: ${LONORA_WORKSPACE_FOREGROUND_SECONDS:-600}
    volumes:
      # A fixed-size ext4 file (LONORA_WORKSPACE_DISK) that `lonora` mounts on the host.
      - {type: bind, source: ../../workspace-disk, target: /workspace, bind: {create_host_path: false}}
      - workspace-control:/run/lonora-workspace
      # The `lonora` CLI endpoint's socket (7.3): the workspace's one road into Lonora. The
      # same path as in the api service: whichever starts first, the new volume takes the
      # image directory's owner (lonora), so the API can always create its socket.
      - cli-socket:/app/.runtime/cli:ro
    # /run/secrets holds the values commands name (7.2.5): memory only, never the disk.
    tmpfs: ["/tmp:size=1g,mode=1777", "/var/tmp:size=256m,mode=1777", "/run/lock:size=1m,mode=1777", "/run/secrets:size=4m,mode=0750"]
    shm_size: 256m
    cpus: ${LONORA_WORKSPACE_CPUS:-2}
    cpu_shares: 128
    mem_limit: ${LONORA_WORKSPACE_MEMORY:-4g}
    memswap_limit: ${LONORA_WORKSPACE_MEMORY:-4g}
    pids_limit: ${LONORA_WORKSPACE_PROCESSES:-256}
    oom_score_adj: 1000
    depends_on:
      workspace-net: {condition: service_healthy, restart: true}
    stop_grace_period: 10s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The supervisor creates agent users and drops into them; agent processes have none.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "SETGID", "SETUID"]
networks:
  default:
  research:
  workspace:
volumes:
  database:
  artifacts:
  cli-socket:
  caddy-data:
  caddy-config:
  workspace-control:
