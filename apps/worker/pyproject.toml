[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-worker"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["lonora-api==0.2.0", "lonora-db==0.2.0", "lonora-gateway==0.2.0", "lonora-logging==0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
