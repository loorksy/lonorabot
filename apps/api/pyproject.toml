[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lonora-api"
version = "0.2.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "lonora-adapters==0.2.0", "lonora-agent==0.2.0", "lonora-auth==0.2.0", "lonora-automation==0.2.0", "lonora-bus==0.2.0", "lonora-channels==0.2.0", "lonora-charts==0.2.0", "lonora-contracts==0.2.0", "lonora-core==0.2.0", "lonora-db==0.2.0", "lonora-gateway==0.2.0", "lonora-logging==0.2.0", "lonora-market==0.2.0", "lonora-memory==0.2.0", "lonora-providers==0.2.0", "lonora-security==0.2.0", "lonora-session==0.2.0", "lonora-tools==0.2.0", "lonora-trading==0.2.0", "lonora-voice==0.2.0", "pydantic-settings>=2.6,<3", "pydantic>=2.10,<3", "sqlalchemy[asyncio]>=2.0.36,<3", "uvicorn[standard]>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
