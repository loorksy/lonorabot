services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lonora
      POSTGRES_USER: lonora
      POSTGRES_PASSWORD: lonora
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["lonora-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lonora -d lonora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lonora-postgres:
