# Cloudflare Pages project for the Lonora Cloud website and portal account (docs/cloud PHASES.md Phase W).
# Fill the placeholders in README.md step 3. Secrets are never written here: set them with
#   wrangler pages secret put TURNSTILE_SECRET --project-name lonora-site
name = "lonora-site"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[vars]
SITE_ORIGIN = "https://lonora.app"          # the exact origin the site is served from (D5)
TURNSTILE_SITE_KEY = "REPLACE_WITH_SITE_KEY" # public; the secret is TURNSTILE_SECRET
ACCESS_TEAM_DOMAIN = "REPLACE.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
ADMIN_EMAILS = "owner@example.com"           # comma-separated staff allowed in the admin panel
TERMS_VERSION = "draft-2026-11-25"
RISK_VERSION = "draft-2026-11-25"
PRIVACY_VERSION = "draft-2026-11-25"

[[d1_databases]]
binding = "DB"
database_name = "lonora_site"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
