# One customer's Lonora on the shared host (docs/cloud/DECISIONS.md D48). customer.sh runs it as the
# Compose project lonora-<handle>, with --project-directory /srv/lonora/customers/<handle>: its .env
# holds that customer's own keys and database address, release.env the image built once per release.
# Shared with the other customers: PostgreSQL (lonora-db, one database and role each), web search
# (lonora-search) and the reverse proxy (lonora-edge). Names on a shared network are the container
# names (lonora-<handle>-api, lonora-postgres, lonora-searxng), never a bare service name, so no
# customer's service can resolve another's. The workspace and the research browser are on demand
# (customer.sh workspace <handle> start|stop), each limited to 1 GB, and like in
# infra/compose/docker-compose.prod.yml they get no env file and no Lonora secret.
name: ${LONORA_PROJECT:?}
x-lonora: &lonora
  image: ${LONORA_IMAGE:?run customer.sh release first}
  restart: unless-stopped
  env_file: .env
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
x-runtime: &runtime
  LONORA_COOKIE_SECURE: "true"
  LONORA_CHART_BROWSER_EXECUTABLE: /usr/bin/chromium
  LONORA_CHART_BROWSER_SANDBOX: "false"
services:
  api:
    <<: *lonora
    container_name: ${LONORA_PROJECT}-api
    command: ["api"]
    environment: *runtime
    volumes: ["artifacts:/app/.runtime/artifacts", "cli-socket:/app/.runtime/cli"]
    networks: [default, lonora-db, lonora-edge]
    mem_limit: ${LONORA_API_MEMORY:-896m}
    cpus: ${LONORA_API_CPUS:-0.75}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 40
  gateway:
    <<: *lonora
    command: ["gateway"]
    environment:
      <<: *runtime
      LONORA_SEARXNG_URL: http://lonora-searxng:8080
      LONORA_BROWSER_URL: http://browser:8090
    volumes: ["artifacts:/app/.runtime/artifacts", "workspace-control:/run/lonora-workspace"]
    networks: [default, research, lonora-db, lonora-search]
    mem_limit: ${LONORA_GATEWAY_MEMORY:-768m}
    cpus: ${LONORA_GATEWAY_CPUS:-0.75}
    cpu_shares: 2048
    depends_on:
      api: {condition: service_healthy}
    stop_grace_period: 40s
  browser:
    <<: *lonora
    profiles: [on-demand]
    env_file: []
    command: [python, -m, lonora_tools.browser_service]
    environment:
      BROWSER_EXECUTABLE: /usr/bin/chromium
      BROWSER_SANDBOX: "false"
      HOME: /tmp
    networks: [research]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    shm_size: 256m
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 256
  # The workspace (7.1): workspace-net owns and filters its network namespace (no private ranges,
  # none of this host's addresses, not Lonora's domain); the workspace has no network capability.
  workspace-net:
    <<: *lonora
    profiles: [on-demand]
    env_file: []
    user: "0:0"
    command: ["python", "-m", "lonora_workspace.netguard"]
    environment:
      LONORA_DOMAIN: ${LONORA_DOMAIN:?}
      LONORA_WORKSPACE_HOST_ADDRESSES: ${LONORA_WORKSPACE_HOST_ADDRESSES:-}
    networks: [workspace]
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-m", "lonora_workspace.netguard", "--check"]
      interval: 10s
      timeout: 6s
      retries: 6
    cap_add: ["NET_ADMIN", "NET_BIND_SERVICE"]
  workspace:
    <<: *lonora
    profiles: [on-demand]
    env_file: []
    user: "0:0"
    init: true
    command: ["python", "-m", "lonora_workspace.supervisor"]
    network_mode: "service:workspace-net"
    volumes:
      # The customer's fixed-size ext4 disk, mounted here by customer.sh.
      - {type: bind, source: ./workspace, target: /workspace, bind: {create_host_path: false}}
      - workspace-control:/run/lonora-workspace
      - cli-socket:/app/.runtime/cli:ro
    tmpfs: ["/tmp:size=512m,mode=1777", "/var/tmp:size=256m,mode=1777", "/run/lock:size=1m,mode=1777", "/run/secrets:size=4m,mode=0750"]
    shm_size: 128m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    cpu_shares: 128
    pids_limit: 256
    oom_score_adj: 1000
    depends_on:
      workspace-net: {condition: service_healthy, restart: true}
    stop_grace_period: 10s
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "SETGID", "SETUID"]
networks:
  default:
  research:
  workspace:
  lonora-db: {external: true}
  lonora-edge: {external: true}
  lonora-search: {external: true}
volumes:
  artifacts:
  cli-socket:
  workspace-control:
