.u-meter.danger{background:color-mix(in srgb,var(--red) 18%,transparent)}.u-meter.danger i{background:var(--red)}
.u-meter b{position:absolute;top:-4px;bottom:-4px;inset-inline-start:var(--q);width:2px;margin-inline-start:-1px;border-radius:1px;background:var(--text);opacity:.6}
.u-meter-legend{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted)}
.u-status{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.u-status svg{width:18px;height:18px;flex-shrink:0}
.u-status.good svg{color:var(--accent-ink)}.u-status.warn svg{color:var(--amber)}
.u-chart{padding:16px 16px 12px}
.u-readout{display:grid;gap:2px;min-width:0}
.u-r-value{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.u-r-label{font-size:var(--fs-xs);color:var(--muted)}
.u-view{width:36px;height:36px;background:var(--fill);color:var(--muted)}
.u-view svg{width:18px;height:18px}
.u-plot{display:flex;gap:10px;height:150px;margin-top:6px}
.u-yaxis{position:relative;width:34px;flex-shrink:0;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.u-yaxis span{position:absolute;inset-inline-start:0;transform:translateY(-50%);line-height:1;direction:ltr}
.u-area{position:relative;flex:1;min-width:0}
.u-grid i{position:absolute;inset-inline:0;height:1px;background:var(--line);transform:translateY(-.5px)}
.u-grid i.base{background:var(--line-strong)}
.u-bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;gap:3px;touch-action:pan-y;cursor:crosshair;outline:none;user-select:none;-webkit-user-select:none}
.u-bars:focus-visible{box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--text) 40%,transparent);border-radius:6px}
.u-slot{flex:1 1 0;max-width:24px;height:100%;display:flex;align-items:flex-end}
.u-slot i{width:100%;height:var(--h);border-radius:4px 4px 0 0;background:var(--viz-dim);transition:background .15s}
.u-slot.on i{background:var(--accent-ink)}
@media(hover:hover){.u-slot:not(.on):hover i{background:color-mix(in srgb,var(--viz-dim) 70%,var(--text))}}
.u-xaxis{display:flex;justify-content:space-between;margin-top:8px;padding-inline-start:44px;font-size:10.5px;color:var(--faint)}
.u-table-wrap{max-height:300px;overflow:auto;margin:0 -4px}
.u-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.u-table th,.u-table td{padding:10px 6px;text-align:start;border-bottom:1px solid var(--line)}
.u-table thead th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:500;font-size:var(--fs-xs)}
.u-table tbody th{font-weight:500}
.u-table td{text-align:end;white-space:nowrap}
.u-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.u-kpi{background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--hi);display:grid;gap:4px;align-content:start;min-width:0}
.u-k-label{font-size:var(--fs-xs);color:var(--muted)}
.u-kpi strong{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.u-kpi small{font-size:11.5px;color:var(--muted);line-height:1.45}
.u-split{display:flex;gap:2px;height:6px;margin:4px 0 2px}
.u-split i{height:100%;border-radius:3px;background:var(--viz-dim)}
.u-split i:first-child{background:var(--viz-ink)}
.u-split i:last-child{flex:1}
.u-rank{padding:16px 16px 6px}
.u-rank .u-card-head{margin-bottom:4px}
.u-rank-row{width:100%;display:flex;align-items:center;gap:12px;padding:11px 0;text-align:start;border-top:1px solid var(--line);color:var(--text)}
.u-rank .u-card-head+.u-rank-row{border-top:0}
.u-rank-row>.avatar,.u-ico{width:36px;height:36px;flex-shrink:0}
.u-ico{border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--muted)}
.u-ico svg{width:18px;height:18px}
.u-rank-body{flex:1;min-width:0;display:grid;gap:8px}
.u-rank-top{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-sm)}
.u-rank-top strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-rank-top span{color:var(--muted);font-variant-numeric:tabular-nums}
.u-rank-bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.u-rank-bar i{display:block;height:100%;border-radius:3px;background:var(--viz-ink)}
.u-rank-pct{width:38px;flex-shrink:0;text-align:end;font-size:var(--fs-sm);font-weight:700;font-variant-numeric:tabular-nums}
.u-rank-row .chevron{color:var(--faint);display:grid}
.u-rank-row .chevron svg{width:16px;height:16px}
.u-actions{display:flex;gap:10px;margin:16px 0 8px}
.u-actions .btn{flex:1}
/* ---- Phones and touch screens: no scrollbar strip while scrolling up or down (desktop keeps the thin one) */
@media (max-width:899px),(pointer:coarse){
 *{scrollbar-width:none!important}
 *::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
}
/* ---- Sheets: only the handle row and the close button stay; the title scrolls with the content */
.sheet-top{position:sticky;top:-10px;z-index:3;height:44px;margin:-10px calc(-1*clamp(16px,4vw,24px)) 2px;padding:0 clamp(16px,4vw,24px);display:flex;align-items:center;justify-content:center;touch-action:none;transition:background .2s,box-shadow .2s}
.sheet-top .handle{margin:0}
.sheet-top>.icon{position:absolute;top:10px;inset-inline-end:16px;width:32px;height:32px;border:0;box-shadow:none;background:var(--fill);color:var(--muted)}
.sheet-top>.icon svg{width:18px;height:18px}
dialog.scrolled .sheet-top{background:color-mix(in srgb,var(--raised) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--glass-line)}
.sheet-head{position:static;transform-origin:100% 0}
dialog::backdrop{opacity:var(--bd,1)}
@media(max-width:899px){dialog[open]{animation:none}dialog{transition:none;will-change:transform}}
/* ---- Inner pages on phones: floating back button, the page name scrolls away with the page */
.float-back{position:absolute;top:calc(100% + 8px);inset-inline-start:12px}
.float-back .icon,.float-actions .icon{width:42px;height:42px;background:var(--glass-card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--hi),0 8px 22px rgba(0,0,0,.28)}
body.light .float-back .icon,body.light .float-actions .icon{box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.08)}
.topbar.bare-detail .float-actions{top:calc(100% + 8px)}
main.detail.bare{padding-top:calc(var(--top-h,0px) + 62px)}
.large-title.is-detail{font-size:26px;line-height:34px;padding-inline-end:0;margin-bottom:12px}
.sheet-top:focus{outline:none}
@media(min-width:900px){
 .sheet-top{position:absolute;top:20px;inset-inline-end:20px;height:auto;margin:0;padding:0;background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
 .sheet-top>.icon{position:static}
 dialog .sheet-head{padding:2px 0 12px;padding-inline-end:44px}
}
/* ---- Voice messages: recording (hold the mic) */
.composer.recording .composer-card>:not(.vrec-bar){opacity:0;transition:opacity .14s}
.vrec-bar{position:absolute;inset:0;z-index:5;display:flex;align-items:center;gap:10px;padding:0 16px;padding-inline-end:132px;border-radius:inherit;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .24s var(--ease)}
.composer.rec-in .vrec-bar{opacity:1;transform:none}
.vrec-bar.locked{padding-inline:10px}
.vrec-bar.is-sent{opacity:0!important;transform:translateY(-6px)!important}
.vrec-bar.is-cancel{opacity:0!important;transform:translateX(18px)!important;transition:opacity .25s,transform .3s var(--ease)}
.vrec-dot{width:10px;height:10px;flex-shrink:0;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 18%,transparent);animation:rec-blink 1.2s ease-in-out infinite}
@keyframes rec-blink{50%{opacity:.3;box-shadow:none}}
.vrec-bar.paused .vrec-dot{animation:none;opacity:.35}
.vrec-time{min-width:38px;font-size:var(--fs-md);font-weight:600;font-variant-numeric:tabular-nums}
.vrec-wave{flex:1;min-width:0;height:30px;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden}
.vrec-wave i{width:3px;flex-shrink:0;height:0;border-radius:2px;background:var(--text);opacity:.78;transition:height .07s linear}
.vrec-hint{display:flex;align-items:center;gap:2px;flex-shrink:0;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap;transition:opacity .12s}
.vrec-hint svg{width:16px;height:16px;animation:hint-nudge 1.3s ease-in-out infinite}
@keyframes hint-nudge{50%{transform:translateX(4px)}}
.vrec-del,.vrec-pause,.vrec-send{display:none;flex-shrink:0}
.vrec-bar.locked .vrec-hint{display:none}
.vrec-bar.locked .vrec-del,.vrec-bar.locked .vrec-pause,.vrec-bar.locked .vrec-send{display:grid}
.vrec-del{color:var(--red)}
.vrec-pause{background:var(--fill)}
.vrec-send{background:var(--primary);color:var(--on-primary)}
.vrec-knob{position:fixed;z-index:70;width:0;height:0;pointer-events:none;--lvl:0;transition:transform .06s linear}
.vrec-knob .vk,.vrec-knob .vring{position:absolute;border-radius:50%}
.vrec-knob .vk{left:-34px;top:-34px;width:68px;height:68px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 30px rgba(0,0,0,.35);transform:scale(.45);opacity:0;transition:transform .32s var(--spring),opacity .15s,background .2s}
.vrec-knob .vk svg{width:28px;height:28px}
.vrec-knob .vring{left:-50px;top:-50px;width:100px;height:100px;background:color-mix(in srgb,var(--accent) 22%,transparent);transform:scale(calc(.62 + var(--lvl)*.5));opacity:0;transition:transform .09s linear,opacity .2s}
.vrec-knob.in .vk{transform:scale(1);opacity:1}
.vrec-knob.in .vring{opacity:1}
.vrec-knob.out .vk{transform:scale(.3);opacity:0;transition:transform .22s var(--ease),opacity .2s}
.vrec-knob.out .vring{opacity:0}
.vrec-knob.cancel .vk{background:var(--red);color:#fff}
.vrec-lock{position:fixed;z-index:69;width:42px;height:88px;margin-left:-21px;border-radius:21px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 10px;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow);color:var(--muted);pointer-events:none;opacity:0;transform:translateY(20px) scale(.9);transition:opacity .2s,transform .32s var(--spring),height .2s var(--ease),color .2s;--pl:0}
.vrec-lock.in{opacity:1;transform:translateY(calc(var(--pl)*-12px))}
.vrec-lock svg{width:18px;height:18px}
.vrec-lock .vl-up{display:grid;animation:lock-bob 1.2s ease-in-out infinite}
@keyframes lock-bob{50%{transform:translateY(-4px)}}
.vrec-lock.locked{color:var(--accent-ink);height:42px;justify-content:center}
.vrec-lock.locked .vl-up{display:none}
/* ---- Voice messages: the bubble */
.bubble.voice-bubble{width:min(280px,74vw);padding:8px 12px 8px 10px}
.vnote{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"play wave" "play side";column-gap:10px;row-gap:2px;align-items:center;--p:0}
.vplay{grid-area:play;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fill-2);color:var(--text);transition:transform .15s}
.vplay:active{transform:scale(.94)}
.msg.mine .vplay{background:color-mix(in srgb,var(--text) 14%,transparent)}
.vplay svg{width:18px;height:18px}
.vplay svg path{fill:currentColor;stroke-linejoin:round}
.vnote.playing .vplay svg path{fill:none;stroke-width:3}
.vwave{grid-area:wave;position:relative;height:32px;cursor:pointer;touch-action:none;outline:none;border-radius:6px}
.vwave:focus-visible{box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 35%,transparent)}
.vbars{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:2px;pointer-events:none}
.vbars i{flex:1 1 0;max-width:3px;min-height:3px;border-radius:2px;background:color-mix(in srgb,var(--text) 30%,transparent)}
.vbars.on{clip-path:inset(0 0 0 calc((1 - var(--p))*100%))}
.vbars.on i{background:var(--text)}
.vwave::after{content:"";position:absolute;top:50%;right:calc(var(--p)*100%);width:12px;height:12px;margin:-6px -6px 0 0;border-radius:50%;background:var(--accent-ink);box-shadow:0 0 0 2px var(--bubble-in);opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s;pointer-events:none}
.msg.mine .vwave::after{box-shadow:0 0 0 2px var(--bubble-out)}
.vnote.active .vwave::after{opacity:1;transform:none}
html[dir=ltr] .vbars.on{clip-path:inset(0 calc((1 - var(--p))*100%) 0 0)}
html[dir=ltr] .vwave::after{right:auto;left:calc(var(--p)*100%);margin:-6px 0 0 -6px}
.vside{grid-area:side;display:flex;align-items:center;gap:8px;min-height:18px;font-size:var(--fs-xs);color:var(--muted);padding-inline-end:64px}
.vtime{font-variant-numeric:tabular-nums}
.vspeed{display:none;height:20px;padding:0 7px;border-radius:10px;background:var(--fill);color:var(--text);font-size:11px;font-weight:700;line-height:20px}
.vnote.active .vspeed{display:inline-block}
/* .meta is direction:ltr, so place it physically: the inline end of an RTL bubble is its left */
.bubble.voice-bubble .meta{position:absolute;bottom:9px;left:12px;right:auto;float:none;margin:0}
html[dir=ltr] .bubble.voice-bubble .meta{left:auto;right:12px}
.quote-text svg,.reply-bar .quote-text svg{width:14px;height:14px;vertical-align:-2px;margin-inline-end:3px}
.composer .mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* one-time hint above the mic */
.mic-tip{position:fixed;z-index:65;max-width:min(280px,calc(100vw - 24px));display:grid;gap:2px;padding:10px 14px;border-radius:16px;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow);color:var(--text);font-size:var(--fs-sm);pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transform-origin:var(--ax,50%) 100%;transition:opacity .2s,transform .3s var(--spring)}
.mic-tip.show{opacity:1;transform:none}
.mic-tip strong{display:flex;align-items:center;gap:6px;font-weight:700}
.mic-tip strong svg{width:16px;height:16px;color:var(--accent-ink)}
.mic-tip span{color:var(--muted);font-size:var(--fs-xs)}
.mic-tip::after{content:"";position:absolute;bottom:-7px;left:var(--ax,50%);width:12px;height:12px;margin-left:-6px;background:var(--glass-pop);border-right:1px solid var(--glass-line);border-bottom:1px solid var(--glass-line);border-radius:0 0 3px 0;transform:rotate(45deg)}
.composer.listening textarea::placeholder{color:var(--accent-ink);opacity:.9}
/* ---- Chat wallpaper: a still doodle layer behind the messages (the scroll container's own background) */
/* the sprite holds the icons and patterns; its colour is the doodle ink */
#lw-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;color:var(--wall-ink)}
.chat-wall{position:absolute;inset:0;width:100%!important;height:100%!important;pointer-events:none;opacity:var(--wa,.1);contain:strict}
.chat-wall.page-enter{animation:wall-in .3s var(--ease) both}
@keyframes wall-in{from{opacity:0}}
main.chat-main{position:relative}
.wall-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;margin:4px 0 18px}
.wall-opt{display:grid;gap:7px;justify-items:center;padding:0;color:var(--text)}
.wall-prev{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:10px 8px;background-color:var(--bg);border:1px solid var(--line);box-shadow:var(--hi);transition:box-shadow .2s,transform .2s var(--spring)}
.wall-prev .wall-art{position:absolute;inset:0;width:100%!important;height:100%!important;pointer-events:none}
.wb{position:relative}
.wall-opt:active .wall-prev{transform:scale(.97)}
.wall-opt.on .wall-prev{border-color:transparent;box-shadow:0 0 0 2px var(--accent-ink),var(--hi)}
.wb{display:block;width:64%;height:12px;border-radius:6px;background:var(--bubble-in)}
.wb.out{align-self:flex-end;width:50%;background:var(--bubble-out)}
.wb.short{width:40%}
.wall-name{display:flex;align-items:center;gap:4px;font-size:var(--fs-sm);font-weight:600}
.wall-name svg{width:14px;height:14px;color:var(--accent-ink)}
@media(min-width:900px){.wall-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* ---- Sheets with a Claude-style header: handle, then ✕ / back at the start and the title centred */
.sheet-top.bar{height:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;padding-top:10px;padding-bottom:4px}
.sheet-top.bar .handle{margin:0 auto 4px}
.sheet-bar{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;min-height:44px}
.sheet-bar h2{margin:0;text-align:center;font-size:var(--fs-lg);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-bar>.icon{width:40px;height:40px;border:0;box-shadow:none;background:transparent;color:var(--text)}
.sheet-bar>.icon svg{width:22px;height:22px}
.sheet-page{padding-top:6px}
.sheet-page.go-fwd{animation:sheet-page-fwd .3s var(--ease) both}
.sheet-page.go-back{animation:sheet-page-back .3s var(--ease) both}
@keyframes sheet-page-fwd{from{opacity:0;transform:translateX(-24px)}}
@keyframes sheet-page-back{from{opacity:0;transform:translateX(24px)}}
html[dir=ltr] .sheet-page.go-fwd{animation-name:sheet-page-back}
html[dir=ltr] .sheet-page.go-back{animation-name:sheet-page-fwd}
/* "Add to conversation": attachment tiles + grouped rows */
.add-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:2px 0 12px}
.add-tile{display:grid;justify-items:center;align-content:center;gap:10px;min-height:104px;padding:12px 6px 11px;border-radius:22px;background:var(--add-card);color:var(--text);font-size:var(--fs-md);font-weight:500;transition:transform .2s var(--spring),background .15s}
.add-tile:active{transform:scale(.97);background:var(--add-press)}
.add-ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--add-ic);color:var(--text)}
body.light .add-ic{box-shadow:0 1px 2px rgba(11,12,16,.08)}
.add-ic svg{width:22px;height:22px}
.add-group{display:grid;gap:2px;margin:0 0 12px;border-radius:22px;overflow:hidden}
.add-group:last-child{margin-bottom:4px}
.add-row{width:100%;display:flex;align-items:center;gap:14px;min-height:64px;padding:9px 14px;background:var(--add-card);color:var(--text);text-align:start;transition:background .15s}
.add-row:active{background:var(--add-press)}
.add-row .add-ic{width:44px;height:44px}
.add-body{flex:1;min-width:0;display:grid;gap:2px}
.add-body strong{font-size:var(--fs-md);font-weight:600;line-height:1.35}
.add-body small{font-size:var(--fs-sm);line-height:1.4;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-end{flex:none;display:grid;place-items:center;min-width:20px;color:var(--muted)}
.add-end svg{width:18px;height:18px}
.add-row[role=menuitemradio] .add-body small{white-space:normal}
.add-row[role=menuitemradio][aria-checked=true] .add-end{color:var(--accent-ink)}
.add-row[role=menuitemradio][aria-checked=true] .add-ic{color:var(--accent-ink)}
.add-row .switch{pointer-events:none}
.add-row[aria-checked=true] .switch{background:var(--accent)!important}
.add-row[aria-checked=true] .switch::before{transform:translateX(20px)}
@media (hover:hover){.add-tile:hover,.add-row:hover{background:var(--add-press)}}
.composer .cbtn.tool-on{background:color-mix(in srgb,var(--accent) 18%,var(--fill));color:var(--accent-ink)}
@media(max-width:380px){.composer-row:has(.tool-on){gap:6px}.composer .cbtn.tool-on{width:34px;height:34px}.composer .cbtn.tool-on svg{width:19px;height:19px}}
/* photo messages */
.bubble.img-bubble{padding:3px;line-height:0}
.img-msg{display:block;padding:0;border-radius:calc(var(--r-md) - 3px);overflow:hidden;background:var(--fill)}
.img-msg img{display:block;width:min(248px,64vw);height:auto;max-height:340px;object-fit:cover}
.bubble.img-bubble .meta{position:absolute;bottom:9px;left:10px;float:none;margin:0;padding:4px 8px;border-radius:999px;background:rgba(5,6,8,.46);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-photo{display:block;width:100%;height:auto;max-height:68dvh;object-fit:contain;border-radius:18px;background:var(--fill)}
@media(min-width:900px){
 dialog.bar-sheet{padding-top:10px}
 dialog.bar-sheet .sheet-top.bar{position:sticky;top:-10px;inset:auto;margin:-10px -24px 4px;padding:6px 24px 4px;display:block;border-radius:var(--r-lg) var(--r-lg) 0 0}
 dialog.bar-sheet .sheet-top.bar .handle{display:none}
 dialog.bar-sheet.scrolled .sheet-top.bar{background:color-mix(in srgb,var(--raised) 82%,transparent)!important;-webkit-backdrop-filter:blur(14px)!important;backdrop-filter:blur(14px)!important;box-shadow:0 1px 0 var(--glass-line)!important}
}
/* ---- Mentions (@) and commands (/): one floating list above the composer */
.assist{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:30;max-width:820px;margin:0 auto;display:flex;flex-direction:column;border-radius:22px;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow),var(--hi);overflow:hidden;transform-origin:50% 100%;animation:as-in .18s var(--ease) both}
@keyframes as-in{from{opacity:0;transform:translateY(8px) scale(.985)}}
.as-list{position:relative;max-height:var(--as-max,320px);overflow-y:auto;overscroll-behavior:contain;padding:6px;scrollbar-width:none}
.as-list::-webkit-scrollbar{display:none}
.as-sec{padding:8px 12px 5px;font-size:var(--fs-xs);font-weight:600;color:var(--faint)}
.as-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:7px 10px;border-radius:15px;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s}
.as-row.on{background:var(--add-press)}
.as-row:active{background:var(--add-press)}
.as-av{display:grid;flex:none}
.as-av .avatar{width:36px;height:36px}
.as-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--add-ic);color:var(--text)}
body.light .as-ic{box-shadow:0 1px 2px rgba(11,12,16,.08)}
.as-ic svg{width:18px;height:18px}
.as-ic.danger{color:var(--red)}
.as-body{flex:1;min-width:0;display:grid;gap:1px}
.as-body strong{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:var(--fs-md);font-weight:600;line-height:1.35;white-space:nowrap}
.as-body strong>span{overflow:hidden;text-overflow:ellipsis}
.as-body strong b{color:var(--accent-ink);font-weight:700}
.as-body strong em{min-width:0;overflow:hidden;text-overflow:ellipsis;font-style:normal;font-weight:400;font-size:var(--fs-sm);color:var(--faint)}
.as-body small{font-size:var(--fs-sm);line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-end{flex:none;font-size:var(--fs-xs);color:var(--faint)}
.as-end.tag{padding:3px 9px;border-radius:999px;background:var(--add-ic);color:var(--muted);font-weight:600}
.as-end.ltr{direction:ltr;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.01em}
.as-empty{padding:20px 16px;text-align:center;color:var(--muted);font-size:var(--fs-sm)}
.as-foot{display:flex;gap:16px;justify-content:center;padding:7px 12px 8px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--faint)}
.as-foot span{display:inline-flex;align-items:center;gap:3px}
.as-foot kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--add-ic);font:inherit;font-size:11px;color:var(--muted)}
/* the textarea draws picked tokens through a mirror layer behind it */
.ta-wrap{position:relative}
.ta-wrap>textarea{position:relative;z-index:1}
.ta-mirror{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;padding:2px 8px;font-size:var(--fs-md);line-height:24px;white-space:pre-wrap;overflow-wrap:break-word;word-wrap:break-word;color:transparent;text-align:start}
.ta-mirror mark{color:transparent;background:color-mix(in srgb,var(--accent) 24%,transparent);border-radius:6px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 24%,transparent)}
.ta-mirror mark.cmd{background:color-mix(in srgb,var(--text) 13%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 13%,transparent)}
.ta-mirror .ghost{color:var(--faint)}
.composer textarea[name=message]{scrollbar-width:none}
/* tokens in sent messages */
.mention{padding:0 3px;border-radius:5px;background:color-mix(in srgb,var(--accent) 17%,transparent);color:var(--accent-ink);font-weight:600}
.cmd-chip{display:inline-flex;align-items:center;gap:4px;vertical-align:-2px;padding:1px 9px 1px 8px;margin-inline-end:2px;border-radius:999px;background:color-mix(in srgb,var(--text) 10%,transparent);font-size:var(--fs-sm);font-weight:600;line-height:1.6}
.cmd-chip svg{width:14px;height:14px;color:var(--accent-ink)}
/* ---- Chat list: selection mode, pins, mutes, archive */
.av-wrap{position:relative;display:grid;flex:none}
.thread{transition:background .2s ease}
.thread.pressing{background:var(--hover)}
.thread .pick{position:absolute;bottom:-2px;inset-inline-end:-3px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 2.5px var(--bg);transform:scale(.2);opacity:0;transition:transform .32s var(--spring),opacity .14s}
.thread .pick svg{width:14px;height:14px;stroke-width:2.6}
.thread.picked{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.thread.picked .pick{transform:none;opacity:1}
.thread.picked .avatar{transform:scale(.92);transition:transform .32s var(--spring)}
.thread .avatar{transition:transform .25s var(--spring)}
.thread .t-ic{display:grid;flex:none;color:var(--faint)}
.thread .t-ic svg{width:16px;height:16px}
.count.dot{min-width:12px;width:12px;height:12px;padding:0}
.count.quiet{background:var(--faint);color:var(--bg);box-shadow:none}
.thread.unread.muted .line1 time{color:var(--muted);font-weight:400}
.archive-row{min-height:54px;padding-block:6px}
.archive-row .arch-ic{display:grid;place-items:center;width:50px;flex:none;color:var(--muted)}
.archive-row .arch-ic svg{width:22px;height:22px}
.archive-row .body strong{font-weight:600}
.archive-row .arch-n{flex:none;font-size:var(--fs-xs);color:var(--muted);font-weight:600;padding-inline:8px}
.archive-row .arch-n.on{color:var(--accent-ink)}
.arch-note{display:flex;align-items:flex-start;gap:8px;margin:18px 6px;color:var(--faint);font-size:var(--fs-sm)}
.arch-note svg{width:18px;height:18px;flex:none;margin-top:2px}
/* the header while selecting */
.sel-bar{gap:2px;padding-inline:6px;animation:sel-in .22s var(--ease) both}
@keyframes sel-in{from{opacity:0;transform:translateY(-6px)}}
.sel-bar .grow{flex:1}
.sel-bar .icon{width:42px;height:42px;border:0;background:transparent;box-shadow:none;color:var(--text)}
.sel-bar .icon svg{width:22px;height:22px}
.sel-bar .sel-count{min-width:30px;padding-inline:6px 0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.topbar.selecting::before{opacity:1!important}
.desktop-list-head .sel-bar{flex:1;height:auto;padding:0;animation-duration:.18s}
.desktop-list-head .sel-bar .icon{width:36px;height:36px}
.desktop-list-head .sel-bar .icon svg{width:20px;height:20px}
.desktop-list-head .sel-bar .sel-count{font-size:19px}
/* a toast with an undo button */
#toast.has-action{display:none;align-items:center;gap:14px;pointer-events:auto;padding-inline:18px 10px;top:auto;bottom:calc(env(safe-area-inset-bottom) + 100px)}
@media(min-width:900px){#toast.has-action{top:auto;bottom:28px}}
#toast.has-action.show{display:flex}
#toast .toast-undo{padding:6px 12px;border-radius:999px;color:var(--accent-ink);font-weight:700;font-size:var(--fs-sm)}
#toast .toast-undo:active{background:var(--hover)}
/* ---- Notices: typed toasts (icon by type), actionable ones at the bottom */
#toast{display:none;align-items:center;gap:10px}
#toast.show{display:flex}
#toast .t-ic{display:grid;flex:none}
#toast .t-ic svg{width:18px;height:18px}
#toast.t-success .t-ic{color:var(--accent-ink)}
#toast.t-error .t-ic{color:var(--red)}
#toast.t-warn .t-ic{color:var(--amber)}
#toast.t-info .t-ic{color:var(--muted)}
#toast.t-error{border-color:color-mix(in srgb,var(--red) 40%,var(--glass-line))}
#toast .t-msg{min-width:0}
#toast .t-act{flex:none;padding:6px 12px;margin-inline-start:4px;border-radius:999px;color:var(--accent-ink);font-weight:700;font-size:var(--fs-sm)}
#toast.t-error .t-act{color:var(--text);background:var(--fill)}
#toast .t-act:active{background:var(--hover)}
/* ---- Network strip under the header */
.net-strip{display:flex;align-items:center;justify-content:center;gap:8px;min-height:30px;padding:5px 12px;font-size:var(--fs-sm);font-weight:600;animation:enter .2s var(--ease) both}
.net-strip svg{width:16px;height:16px;flex:none}
.net-strip.off{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.net-strip.wait{background:var(--fill);color:var(--muted)}
.net-strip.back{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
.spin{width:14px;height:14px;flex:none;border-radius:50%;border:2px solid currentColor;border-inline-end-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- Failed / queued messages */
.ticks.wait svg{color:var(--muted)}
.msg-fail{flex:none;align-self:center;width:24px;height:24px;margin-inline:6px;border-radius:50%;display:grid;place-items:center;background:var(--danger-fill);color:#fff;font-weight:800;font-size:14px;line-height:1;box-shadow:0 2px 6px rgba(229,72,77,.35)}
.fail-note{display:block;margin:3px 6px 0;padding:0;font-size:var(--fs-xs);color:var(--red);font-weight:600}
.msg.mine .fail-note{margin-inline-start:auto;text-align:end}
/* ---- Agent error cards */
.err-card{max-width:min(420px,86%);padding:12px 14px;border-radius:var(--r-md);background:var(--bubble-in);border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));box-shadow:var(--hi)}
.err-top{display:flex;align-items:center;gap:10px}
.err-ic{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.err-ic svg{width:18px;height:18px}
.err-top strong{font-size:var(--fs-md)}
.err-card p{margin:8px 0 12px;color:var(--muted);font-size:var(--fs-sm);line-height:1.6}
.err-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn.small{min-height:36px;padding:0 14px;font-size:var(--fs-sm);gap:6px}
.btn.small svg{width:16px;height:16px}
.btn[disabled]{opacity:.55;pointer-events:none}
/* ---- Upload progress */
.up{position:relative;flex:none;width:40px;height:40px;display:grid;place-items:center;--p:0}
.up-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*360deg),color-mix(in srgb,var(--text) 14%,transparent) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
.up-n{display:none}
.up-x{position:relative;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.up-x svg{width:15px;height:15px}
.img-msg.busy{position:relative;display:block;border-radius:calc(var(--r-md) - 3px);overflow:hidden;line-height:0}
.img-msg.busy img{display:block;width:min(248px,64vw);height:auto;max-height:340px;object-fit:cover;filter:brightness(.62) saturate(.8)}
.img-msg.busy .up,.img-msg.busy .up-retry{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(5,6,8,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.img-msg.busy .up-x,.img-msg.busy .up-retry{color:#fff}
.img-msg.busy .up-retry{display:grid;place-items:center}
.img-msg.busy .up-retry svg{width:24px;height:24px}
.img-msg.busy .up-ring{inset:4px}
.file-chip.uploading .up{width:36px;height:36px}
/* ---- Inline form errors */
.field-err{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--red);font-size:var(--fs-sm);font-weight:500;animation:enter .18s var(--ease) both}
.field-err svg{width:15px;height:15px;flex:none}

.state-page{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px 24px;gap:6px}
.state-art{position:relative;width:96px;height:96px;margin-bottom:10px;border-radius:30px;display:grid;place-items:center;background:var(--fill);color:var(--muted);box-shadow:var(--raise)}
.state-art svg{width:40px;height:40px}
.state-art b{position:absolute;bottom:-12px;padding:2px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:var(--fs-xs);color:var(--muted);letter-spacing:.08em}
.state-page h2{margin:6px 0 0;font-size:var(--fs-lg)}
.state-page p{margin:0 0 14px;max-width:320px;color:var(--muted);line-height:1.7}
.state-actions{display:flex;flex-direction:column;gap:8px;width:min(320px,100%)}
.state-actions .btn{width:100%}
.state-hero{position:relative;width:72px;height:72px;margin:6px auto 12px;border-radius:24px;display:grid;place-items:center;background:var(--fill);color:var(--text)}
.state-hero svg{width:32px;height:32px}
.state-x{position:absolute;bottom:-4px;inset-inline-end:-4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--danger-fill);color:#fff;box-shadow:0 0 0 3px var(--raised)}
.state-x svg{width:14px;height:14px}
.state-lead{text-align:center;color:var(--muted);line-height:1.7;margin:0 8px 14px}
.perm-steps{margin:0 0 18px;padding:12px 16px;padding-inline-start:34px;border-radius:var(--r-md);background:var(--add-card);line-height:2;font-size:var(--fs-sm)}
#app-state{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);animation:enter .25s var(--ease) both}
#update-bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:90;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 8px;border-radius:20px;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow);animation:enter .25s var(--ease) both}
.ub-ic{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}

.ub-t{flex:1;min-width:0;display:grid}

@media(min-width:900px){#update-bar{bottom:24px}}
.ver-tap{padding:2px 6px;color:inherit;font:inherit;border-radius:8px}
/* ---- Skeletons and paging */
.sk{display:block;background:linear-gradient(90deg,var(--fill) 25%,var(--fill-2) 50%,var(--fill) 75%);background-size:300% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:8px}

.sk-list{padding:4px 2px}
.sk-row{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 8px}
.sk-av{width:50px;height:50px;flex:none;border-radius:50%}
.sk-lines{flex:1;display:grid}
.sk-chat{display:flex;flex-direction:column;gap:12px;padding:24px 4px}
.sk-bub{padding:12px 14px;border-radius:var(--r-md);background:var(--bubble-in);align-self:flex-start}

.older{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;color:var(--muted);font-size:var(--fs-sm)}
.field>.field-err,.check>.field-err{display:flex;margin-bottom:0;font-weight:500}

/* ---- Streaming, steps, rich answers, message tools (v16) */
.caret{display:inline-block;width:7px;height:1.05em;margin-inline-start:3px;vertical-align:-2px;border-radius:2px;background:var(--accent);animation:caret 1s steps(1) infinite}

.composer .stop{display:none;background:var(--text);color:var(--bg)}

.meta .stopped,.meta .edited{margin-inline-end:6px;font-style:italic;color:var(--faint)}
.steps{margin:2px 0 8px;border-radius:12px;background:color-mix(in srgb,var(--text) 5%,transparent);overflow:hidden}
.steps-head{width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:var(--fs-sm);color:var(--muted);text-align:start}
.steps-head>span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps.running .steps-head{color:var(--text)}
.steps-head .spin{width:13px;height:13px;color:var(--accent-ink)}
.st-done{display:grid;color:var(--accent-ink)}
.st-done svg{width:15px;height:15px}
.steps-chev{display:grid;transition:transform .2s var(--ease)}
.steps-chev svg{width:15px;height:15px}
.steps.open .steps-chev{transform:rotate(180deg)}
.steps-list{display:none;margin:0;padding:0 10px 8px;list-style:none}
.steps.open .steps-list{display:grid;gap:2px}
.steps-list li{position:relative;display:flex;gap:10px;padding:5px 0;animation:enter .25s var(--ease) both}
.steps-list li:not(:last-child)::after{content:"";position:absolute;top:28px;bottom:-6px;inset-inline-start:11px;width:1.5px;background:var(--line)}
.st-ic{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--muted)}
.st-ic svg{width:13px;height:13px}
.st-ic .spin{width:12px;height:12px;color:var(--accent-ink)}
.st-t{display:grid;font-size:var(--fs-sm);line-height:1.5}
.st-t b{font-weight:600}
.st-t small{color:var(--faint);font-size:var(--fs-xs)}
.md{line-height:1.7}
.md>*:first-child{margin-top:0}
.md p{margin:0 0 8px}
.md .md-h{margin:10px 0 4px;font-weight:700}
.md .md-h.h1{font-size:1.12em}.md .md-h.h2,.md .md-h.h3{font-size:1.04em}
.md ul,.md ol{margin:0 0 8px;padding-inline-start:20px}
.md li{margin:2px 0}
.md blockquote{margin:6px 0 8px;padding:4px 12px;border-inline-start:3px solid var(--line-strong);color:var(--muted)}
.md a,.text a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.md code,.text code{padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--text) 10%,transparent);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
.code{margin:6px 0 10px;border-radius:12px;overflow:hidden;background:#0d0f14;border:1px solid var(--line)}

.code-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;font-size:var(--fs-xs);color:#9aa1ad;background:rgba(255,255,255,.04);direction:ltr}
.code-copy{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:8px;color:#c9ced6;font-size:var(--fs-xs)}
.code-copy:hover{background:rgba(255,255,255,.08)}
.code-copy svg{width:13px;height:13px}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;color:#e8eaee;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:left}
.code pre code{padding:0;background:none;font-size:inherit}
.md-table{margin:6px 0 10px;overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.md-table table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.md-table th,.md-table td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.md-table th{background:color-mix(in srgb,var(--text) 6%,transparent);font-weight:600}
.md-table tr:last-child td{border-bottom:0}
.bubble:has(.md),.bubble:has(.steps){min-width:min(260px,70vw)}
.bubble .md+.meta{margin-top:0}
.text.caption{display:block;padding:6px 8px 0}
.bubble.img-bubble.has-caption{line-height:1.6}
.bubble.img-bubble.has-caption .meta{position:static;float:left;margin:4px 8px 2px 0;padding:0;background:none;color:var(--muted);-webkit-backdrop-filter:none;backdrop-filter:none}
/* attachments waiting in the composer */
.att-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.att{position:relative;flex:none;height:64px;border-radius:14px;overflow:hidden;background:var(--fill);border:1px solid var(--line);animation:enter .2s var(--ease) both}
.att.image{width:64px}
.att.image img{width:100%;height:100%;object-fit:cover;display:block}
.att.file{display:flex;align-items:center;gap:8px;max-width:210px;padding:0 34px 0 10px}
.att-ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--fill-2);color:var(--text)}
.att-ic svg{width:18px;height:18px}
.att-n{min-width:0;display:grid;line-height:1.3}
.att-n b{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-n small{font-size:var(--fs-xs);color:var(--muted)}
.att-x{position:absolute;top:4px;inset-inline-end:4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(5,6,8,.6);color:#fff}
.att-x svg{width:12px;height:12px}
/* ↓ to the newest message */
.jump{position:absolute;inset-inline-end:16px;bottom:calc(var(--bottom-h,96px) + 12px);z-index:21;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow);color:var(--text);opacity:0;transform:translateY(10px) scale(.9);pointer-events:none;transition:opacity .2s,transform .25s var(--spring)}
.jump.on{opacity:1;transform:none;pointer-events:auto}
.jump svg{width:20px;height:20px}
.jump-n{position:absolute;top:-6px;inset-inline-start:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center}
/* floating day pill (WhatsApp): only while scrolling, just under the header */
.float-date{position:absolute;top:calc(var(--top-h,60px) + 8px);left:50%;z-index:19;transform:translate(-50%,-6px);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.float-date.on{opacity:1;transform:translate(-50%,0)}
.float-date span{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);color:var(--muted);font-size:var(--fs-xs);font-weight:600;box-shadow:var(--float-shadow)}
.float-date span:empty{display:none}
/* drop files */
.drop-zone{position:absolute;inset:0;z-index:40;display:none;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.dropping .drop-zone{display:grid}
.drop-zone>div{display:grid;justify-items:center;gap:8px;width:100%;height:100%;place-content:center;border:2px dashed var(--accent);border-radius:28px;color:var(--text)}
.drop-zone svg{width:40px;height:40px;color:var(--accent-ink)}
.drop-zone small{color:var(--muted)}
.row.is-off{opacity:.45;pointer-events:none}
/* ---- Auth layer (v17) */
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#auth{position:fixed;inset:0;z-index:300;display:grid;place-items:center;overflow-y:auto;background:radial-gradient(120% 60% at 50% -10%,rgba(124,131,253,.18),transparent 60%),var(--bg);animation:enter .3s var(--ease) both}
.auth-card{width:min(420px,100%);min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 22px calc(env(safe-area-inset-bottom) + 22px)}
@media(min-width:900px){.auth-card{min-height:auto;margin:40px 0;padding:28px 32px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--float-shadow)}}
.auth-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.auth-top .link{color:var(--muted);font-weight:600}
.auth-logo{display:grid}
.auth-back{border:0;background:transparent;box-shadow:none}
.auth-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;animation:enter .35s var(--ease) both}
.auth-art{width:132px;height:132px;margin-bottom:18px;border-radius:40px;display:grid;place-items:center;background:var(--fill);box-shadow:var(--raise);color:var(--text)}
.auth-art svg{width:56px;height:56px}
.auth-art.small{width:84px;height:84px;border-radius:28px;margin:0 auto 14px}
.auth-art.small svg{width:36px;height:36px}
#auth h1{margin:0;font-size:26px;line-height:1.3}
.auth-slide p{margin:0;max-width:300px;color:var(--muted);line-height:1.7}
.auth-dots{display:flex;justify-content:center;gap:6px;margin:22px 0}
.auth-dots i{width:7px;height:7px;border-radius:99px;background:var(--line-strong);transition:width .3s var(--spring),background .2s}
.auth-dots i.on{width:22px;background:var(--text)}
.auth-actions .btn,.auth-body .btn.full{width:100%;min-height:52px}
.auth-body{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.auth-body.center{justify-content:center;text-align:center}
.auth-body>.muted{margin:0 0 10px}
.auth-tabs{margin:6px 0 4px}
.auth-forgot{align-self:flex-start;margin:-6px 0 12px;font-size:var(--fs-sm)}
.auth-alt{text-align:center;color:var(--muted);font-size:var(--fs-sm);margin:14px 0 0}
.auth-legal{text-align:center;color:var(--faint);font-size:var(--fs-xs);margin-top:auto;padding-top:18px}
.link{padding:0;color:var(--accent-ink);font-weight:600}
.otp{position:relative;display:block;margin:14px 0 10px;cursor:text}
.otp input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.otp-boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr}
.otp-boxes i{height:56px;border-radius:14px;display:grid;place-items:center;background:var(--fill);border:1.5px solid var(--line);font-style:normal;font-size:24px;font-weight:700;color:var(--text);transition:border-color .15s}
.otp:focus-within .otp-boxes i.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.otp.bad .otp-boxes i{border-color:var(--red);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.pw-meter{display:flex;align-items:center;gap:6px;margin:-8px 0 12px}
.pw-meter i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.pw-meter span{flex:none;min-width:84px;font-size:var(--fs-xs);color:var(--muted);text-align:end}
.pw-meter[data-s="1"] i:nth-child(1){background:var(--red)}
.pw-meter[data-s="2"] i:nth-child(-n+2){background:var(--amber)}
.pw-meter[data-s="3"] i{background:var(--accent)}
/* ---- App lock */
#lock{position:fixed;inset:0;z-index:310;display:grid;place-items:center;background:var(--bg);animation:enter .25s var(--ease) both}
.lk{position:relative;width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.lk-close{position:absolute;top:0;inset-inline-start:0;border:0;background:transparent;box-shadow:none}
.lk-logo{margin-bottom:6px}
.lk-msg{margin:0;min-height:24px;color:var(--muted);text-align:center}
.lk-msg.bad{color:var(--red)}
.lk-dots{display:flex;gap:16px;margin:4px 0 18px;direction:ltr}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);transition:background .12s,transform .15s var(--spring)}
.lk-dots i.on{background:var(--text);border-color:var(--text);transform:scale(1.1)}
.lk-dots.shake{animation:shake .35s}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;direction:ltr}
.lk-key{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text);font-size:28px;font-weight:500;transition:background .12s,transform .12s}
.lk-key:active{background:var(--fill-2);transform:scale(.95)}
.lk-key[disabled]{opacity:.4}
.lk-key svg{width:26px;height:26px}
.lk-pad span{width:76px}
/* ---- Plans and checkout */
.plan-cycle small{font-size:var(--fs-xs);color:var(--accent-ink);margin-inline-start:4px}
.plans{display:grid;gap:12px;margin:14px 0}
@media(min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{position:relative;padding:18px 16px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--hi)}
.plan.hot{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),var(--float-shadow)}
.plan-tag{position:absolute;top:-11px;inset-inline-start:16px;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:var(--fs-xs);font-weight:700}
.plan h3{margin:0;font-size:var(--fs-lg);color:var(--text)}
.plan-price{margin:6px 0 12px;display:flex;align-items:baseline;gap:6px}
.plan-price b{font-size:30px;line-height:1}
.plan-price small{color:var(--muted)}
.plan ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.plan li{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm)}
.plan li svg{width:16px;height:16px;color:var(--accent-ink);flex:none}
.btn.is-current{pointer-events:none;gap:6px;color:var(--muted)}
.btn.is-current svg{width:16px;height:16px}
.checkout{border-radius:var(--r-md);background:var(--add-card);padding:6px 14px;margin:4px 0 10px}
.co-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.co-row:last-child{border-bottom:0}
.co-row.total b{font-size:var(--fs-lg)}
.state-hero.ok{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
/* ---- Account, storage, help, legal, a11y */
.acct{display:flex;align-items:center;gap:14px;padding:16px;margin:8px 0 16px}
.acct>div{flex:1;min-width:0;display:grid}
.acct small{color:var(--muted)}
.danger-row,.danger-row svg{color:var(--red)}
.row-icon.ok{color:var(--accent-ink)}.row-icon.warn{color:var(--amber)}
.store-hero{padding:16px;margin:8px 0 16px}
.store-total{margin:2px 0 12px;display:flex;align-items:baseline;gap:8px}
.store-total b{font-size:28px}
.store-total small{color:var(--muted)}
.store-bar{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--fill)}
.store-bar i{display:block;height:100%}
.c0{--c:#7c83fd}.c1{--c:#22E3A8}.c2{--c:#F2C46B}.c3{--c:#ff8a91}.c4{--c:#8B919E}
.store-bar i{background:var(--c)}
.row-icon.c0,.row-icon.c1,.row-icon.c2,.row-icon.c3,.row-icon.c4{color:var(--c)}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;list-style:none;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary span{flex:1}
.faq summary svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq details p{margin:0;padding:0 14px 14px;color:var(--muted);line-height:1.7}
.legal-p{margin:0 4px 6px;color:var(--muted);line-height:1.8}
.a11y-preview{padding:12px;margin:8px 0 6px;background:var(--bg)}
.a11y-preview .msg{pointer-events:none}
.size-row{display:flex;align-items:center;gap:12px}
.size-row input{flex:1;accent-color:var(--accent)}
.a-sm{font-size:14px;color:var(--muted)}.a-lg{font-size:24px;color:var(--muted)}
body.hc{--muted:#C9CDD5;--faint:#AEB3BD;--line:#3A3D46;--line-strong:#5A5E6A;--glass:var(--surface);--glass-bar:var(--surface);--glass-card:var(--raised);--glass-pop:var(--raised)}
body.light.hc{--muted:#3B3F48;--faint:#4F535C;--line:#B9B5AA;--line-strong:#8F8B80}
body.hc .bubble{border:1px solid var(--line-strong)}
body.rm *,body.rm *::before,body.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
/* ---- Heads-up banner */
#headsup{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;z-index:150;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;border-radius:22px;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow);transform:translateY(-130%);opacity:0;transition:transform .38s var(--spring),opacity .2s;touch-action:pan-x}
#headsup.in{transform:none;opacity:1}
#headsup.out{transform:translateY(-130%);opacity:0}
.hu-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:start;color:var(--text)}
.hu-main .avatar{width:40px;height:40px}
.hu-t{min-width:0;display:grid}
.hu-t strong{font-size:var(--fs-sm)}
.hu-t small{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- Shortcuts */
.kbd-list .keys{display:flex;gap:4px;align-items:center;color:var(--faint)}
kbd{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:var(--fill);border:1px solid var(--line);border-bottom-width:2px;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
/* ---- Generative UI: interfaces the agent sends inside its reply (v19) */
.msg.k-ui .msg-line{width:min(440px,94%);max-width:94%}

.bubble.ui-bubble{padding:8px 8px 6px}

.bubble.ui-bubble>.text{display:block;margin-bottom:2px}
.ux{--ux-card:color-mix(in srgb,var(--text) 3.5%,var(--bubble-in));--ux-raise:color-mix(in srgb,var(--text) 5%,transparent);--ux-track:color-mix(in srgb,var(--text) 9%,transparent);--ux-thumb:#3A3D46;
 --ux-s0:var(--accent-ink);--ux-s1:#3987e5;--ux-s2:#d95926;--ux-s3:#199e70;--ux-pos:var(--accent-ink);--ux-neg:#e66767;
 position:relative;margin:8px 0 2px;border-radius:16px;background:var(--ux-card);border:1px solid var(--line);text-align:start;line-height:1.5;transition:box-shadow .3s}
@media(hover:hover){.ux{-webkit-user-select:text;user-select:text}}

.ux-kv span{color:var(--muted)}
.ux-kv b{font-weight:600;text-align:end}
.ux-stat{display:grid;align-content:start;gap:1px;min-width:0;padding:10px 12px;border-radius:12px;background:var(--ux-raise)}
.ux-stat small{color:var(--muted);font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ux-stat b{font-size:19px;font-weight:700;letter-spacing:-.2px;line-height:1.3;overflow-wrap:anywhere}
.ux-stat.t-accent b{color:var(--accent-ink)}
.ux-sub{display:inline-flex;align-items:center;gap:3px;justify-self:start;color:var(--muted);font-size:var(--fs-xs)}
.ux-sub svg{width:14px;height:14px}
.ux-sub.tr-up svg{color:var(--accent-ink)}
.ux-sub.tr-down svg{color:var(--amber)}
.ux-progress{display:grid;gap:6px}
.ux-progress-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ux-progress-h b{color:var(--text);font-variant-numeric:tabular-nums}
.ux-track{height:8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden}
.ux-track i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s var(--ease)}
/* inputs */
.ux-field{display:grid;gap:6px;min-width:0}
.ux-field>label,.ux-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;font-weight:500}
.ux-field>label small{color:var(--faint);font-size:var(--fs-xs)}
.ux-field output{color:var(--text);font-weight:700;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.ux input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;min-height:28px;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;cursor:pointer}
.ux input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(to left,var(--accent) var(--p,0%),var(--ux-track) var(--p,0%))}
.ux input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:linear-gradient(to left,var(--accent) var(--p,0%),var(--ux-track) var(--p,0%))}
html[dir=ltr] .ux input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--accent) var(--p,0%),var(--ux-track) var(--p,0%))}
html[dir=ltr] .ux input[type=range]::-moz-range-track{background:linear-gradient(to right,var(--accent) var(--p,0%),var(--ux-track) var(--p,0%))}
.ux input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:linear-gradient(180deg,#fff,#e9e9e9);box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .15s}
.ux input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:linear-gradient(180deg,#fff,#e9e9e9);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.ux input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.ux input[type=range]:focus-visible{outline:none}
.ux input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.ux input[type=range]:disabled{cursor:default;opacity:.6}
.ux-input{position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);transition:border-color .15s}
body.light .ux-input{background:#fff}
.ux-input:focus-within{border-color:var(--line-strong);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ux-input:has([aria-invalid="true"]){border-color:var(--red)}
.ux-input input,.ux-input select{flex:1;min-width:0;height:100%;min-height:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:var(--fs-md);outline:none}
.ux-input input[dir=ltr]{text-align:end;font-variant-numeric:tabular-nums}
.ux-affix{color:var(--muted);font-size:var(--fs-sm)}
.ux-select select{-webkit-appearance:none;appearance:none;padding-inline-end:22px;cursor:pointer}
.ux-select svg{position:absolute;inset-inline-end:10px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.ux-seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:3px;border-radius:12px;background:var(--ux-track)}
.ux-seg::before{content:"";position:absolute;top:3px;bottom:3px;inset-inline-start:calc(3px + (100% - 6px) / var(--n) * var(--i));width:calc((100% - 6px) / var(--n));border-radius:9px;background:var(--ux-thumb);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .28s var(--ease)}
.ux-seg button{position:relative;z-index:1;min-height:36px;padding:4px 6px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.ux-seg button[aria-checked="true"]{color:var(--text)}
.ux-seg button:disabled{opacity:1}
.ux-chips{display:flex;flex-wrap:wrap;gap:6px}
.ux-chips .chip{min-height:36px;padding:5px 12px;background:transparent;border-color:var(--line-strong);box-shadow:none;font-size:13px}
.ux-chips .chip[aria-checked="true"]{background:var(--primary);border-color:transparent;color:var(--on-primary);font-weight:600}
.ux-tick{display:none}
.ux-tick svg{width:14px;height:14px}
.ux-chips .chip[aria-checked="true"] .ux-tick{display:inline-grid}
.ux-chips .chip:disabled{opacity:.7}
.ux-choice>div{display:grid;gap:8px}
.ux-opt{display:grid;gap:4px;width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--ux-raise);text-align:start;transition:border-color .15s,background .15s}
.ux-opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ux-opt:disabled{opacity:1}
.ux-opt-h{display:flex;align-items:center;gap:8px}
.ux-opt-h b{font-size:15px;font-weight:700}
.ux-opt>small{color:var(--muted);font-size:13px;padding-inline-start:26px}
.ux-radio{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--line-strong);transition:border .15s}
.ux-opt[aria-checked="true"] .ux-radio{border:5.5px solid var(--accent)}
.ux-pts{display:grid;gap:3px;margin-top:4px;padding-inline-start:26px;font-size:13px;color:var(--text)}
.ux-pts>span{display:flex;align-items:center;gap:6px}
.ux-pts svg{width:14px;height:14px;color:var(--accent-ink)}
.ux-switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ux-switch>span{display:grid}
.ux-switch small{color:var(--muted);font-size:var(--fs-xs)}
.ux-checklist{display:grid}
.ux-ci{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 2px;text-align:start;border-bottom:1px solid var(--line)}
.ux-ci:last-child{border-bottom:0}
.ux-ci:disabled{opacity:1}
.ux-box{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:7px;border:2px solid var(--line-strong);color:transparent;transition:background .15s,border-color .15s}
.ux-box svg{width:14px;height:14px;stroke-width:3}
.ux-ci[aria-checked="true"] .ux-box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ux-ci-t{display:grid;font-size:var(--fs-sm);line-height:1.5}
.ux-ci-t b{font-weight:500}
.ux-ci-t small{color:var(--faint);font-size:var(--fs-xs)}
.ux-ci[aria-checked="true"] .ux-ci-t b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.ux-days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.ux-days::-webkit-scrollbar{display:none}
.ux-days button{flex:0 0 auto;display:grid;justify-items:center;gap:1px;min-width:54px;padding:7px 6px;border-radius:12px;background:var(--ux-raise);border:1px solid var(--line)}
.ux-days small{color:var(--muted);font-size:11px;white-space:nowrap}
.ux-days b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ux-days button[aria-checked="true"]{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.ux-days button[aria-checked="true"] small{color:inherit;opacity:.8}
.ux .btn.sm{min-height:40px}
.ux .btn.outline{background:transparent}
.ux-full{width:100%}
/* data */
.ux-table{display:grid;gap:6px}
.ux-cap{color:var(--muted);font-size:13px;font-weight:500}
.ux-table .md-table,.ux-chart .md-table{margin:0}
.ux .md-table th.num,.ux .md-table td.num{text-align:end;font-variant-numeric:tabular-nums}
.ux .md-table tr.hi td{background:color-mix(in srgb,var(--accent) 11%,transparent);font-weight:700}
.ux-chart{display:grid;gap:4px;min-width:0}
.ux-chart-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.ux-chart-h b{font-size:13px;font-weight:600;color:var(--muted)}
.ux-view{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.ux-view:hover{background:var(--hover)}
.ux-view svg{width:17px;height:17px}
.ux-plot{position:relative}
.ux-plot svg{display:block;width:100%;height:auto;direction:ltr;overflow:visible;touch-action:pan-y;font-family:var(--font)}
.ux-plot svg:focus-visible{outline:2px solid var(--text);outline-offset:4px;border-radius:6px}
.ux-plot .g{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.ux-plot .g.z{stroke:var(--line-strong)}
.ux-plot .yl{fill:var(--faint);font-size:10px;text-anchor:end;font-variant-numeric:tabular-nums}
.ux-plot .xl{fill:var(--faint);font-size:10px}
.ux-plot .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ux-plot .area{opacity:.1}
.ux-plot .dot{stroke:var(--ux-card);stroke-width:2;vector-effect:non-scaling-stroke}
.ux-plot .vl{fill:var(--text);font-size:10.5px;font-weight:600}
.ux-plot .ux-x{stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none}
.ux-plot svg.hovering .ux-x{opacity:.55}
.ux-plot .bar{transition:opacity .15s}
.ux-plot svg.hovering .bar:not(.on){opacity:.4}
.ux-tip{position:absolute;top:0;z-index:3;display:grid;gap:1px;padding:6px 10px;border-radius:10px;border:1px solid var(--glass-line);background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--float-shadow);font-size:12px;white-space:nowrap;pointer-events:none;transform:translateY(-6px)}
.ux-tip[hidden]{display:none}
.ux-tip b{font-weight:700}
.ux-tip span{display:flex;align-items:center;gap:4px;color:var(--muted)}
.ux-tip em{font-style:normal;font-weight:600;color:var(--text)}
.ux-tip i{width:8px;height:8px;border-radius:2px}
.ux-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.ux-legend span{display:inline-flex;align-items:center;gap:6px}
.ux-legend i{width:10px;height:10px;border-radius:3px}
.ux-empty{margin:0;color:var(--muted);font-size:13px}
/* play */
.ux-quiz{display:grid;gap:14px}
.ux-q{display:grid;gap:8px}
.ux-q+.ux-q{padding-top:12px;border-top:1px solid var(--line)}
.ux-q-h{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-sm);line-height:1.55}
.ux-q-h b{font-weight:600}
.ux-q-n{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ux-track);font-size:12px;font-weight:700}
.ux-q.ok .ux-q-n{background:var(--accent);color:var(--on-accent)}
.ux-q.no .ux-q-n{background:color-mix(in srgb,var(--red) 70%,transparent);color:#fff}
.ux-q-opts{display:grid;gap:6px}
.ux-q-opts button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--ux-raise);text-align:start;font-size:var(--fs-sm);transition:border-color .15s,background .15s}
.ux-q-opts button:hover:not(:disabled){border-color:var(--line-strong)}
.ux-q-opts button:disabled{opacity:.5}
.ux-q-opts button.right,.ux-q-opts button.wrong{opacity:1}
.ux-q-opts button.right{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.ux-q-opts button.wrong{border-color:color-mix(in srgb,var(--red) 65%,transparent);background:color-mix(in srgb,var(--red) 9%,transparent)}
.ux-q-opts svg{width:17px;height:17px}
.ux-q-opts .right svg{color:var(--accent-ink)}
.ux-q-opts .wrong svg{color:var(--red)}
.ux-q-x{margin:0;color:var(--muted);font-size:13px;line-height:1.6;animation:ux-in .25s var(--ease) both}
.ux-q-x b{color:var(--text)}
.ux-timer{display:grid;gap:10px;justify-items:center}
.ux-ring{position:relative;width:140px;height:140px}
.ux-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ux-ring .trk{fill:none;stroke:var(--ux-track);stroke-width:8}
.ux-ring .arc{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .5s linear}
.ux-clock{position:absolute;inset:0;display:grid;place-content:center;justify-items:center}
.ux-clock b{font-size:30px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums;direction:ltr}
.ux-clock small{color:var(--muted);font-size:var(--fs-xs)}
.ux-timer.is-done .arc{stroke:var(--ux-track)}
.ux-timer .ux-row{width:100%}
.ux-fx{display:none}
.ux-confetti{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:visible}
.ux-confetti i{position:absolute;top:42%;width:7px;height:11px;border-radius:2px;animation:ux-conf var(--d) cubic-bezier(.2,.7,.35,1) forwards}
@keyframes ux-conf{0%{transform:translate(0,0) rotate(0);opacity:1}45%{transform:translate(calc(var(--x)*.7),var(--y)) rotate(calc(var(--r)*.5));opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 190px)) rotate(var(--r));opacity:0}}
/* gallery */
.ux-demo{margin:4px 0 26px}
.ux-demo-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ux-demo-k{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.ux-demo-k svg{width:19px;height:19px;color:var(--accent-ink)}
.ux-demo-h .chip{min-height:34px;padding:4px 12px;font-size:13px}
.ux-demo-h .chip svg{width:16px;height:16px}
.ux-demo-q{margin:6px 0 8px;color:var(--muted);font-size:13px}
.ux-demo .ux{margin:0;--ux-card:var(--surface);box-shadow:var(--hi),0 1px 2px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){.ux [data-ux-new],.ux-why,.ux-q-x{animation:none}.ux-seg::before,.ux-track i,.ux-ring .arc{transition:none}.ux-skel i{animation:none}}

/* ---- Custom lists (WhatsApp «القوائم») */
.list-filters .chip-add{width:32px;min-width:32px;padding:0;justify-content:center;border-radius:50%}
.list-filters .chip-add svg{width:18px;height:18px}
.list-filters .list-chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.list-label{font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.list-name-row{display:flex;align-items:center;gap:8px}
.list-name-row input{flex:1;min-height:54px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--bg);font-size:var(--fs-md)}
body.light .list-name-row input{background:#fff}
.list-name-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.list-emoji-b{width:44px;height:44px;flex:none;color:var(--muted)}
.list-emoji-b[aria-expanded="true"]{color:var(--accent-ink)}
.list-hint{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.lp-search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--fill);color:var(--muted)}
.lp-search svg{width:18px;height:18px}
.lp-search input{flex:1;min-width:0;height:100%;min-height:0;padding:0;border:0;background:transparent;box-shadow:none;outline:none}
.list-row[hidden],.list-none[hidden]{display:none}
.list-box{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line-strong);color:transparent;transition:background .15s,border-color .15s}
.list-box svg{width:15px;height:15px;stroke-width:3}
.list-row[aria-checked="true"] .list-box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.list-none{margin:0;padding:18px;text-align:center;color:var(--muted)}
.list-pick .list-save{margin-top:0}
.list-empty .btn{margin-top:16px}
.list-empty .btn svg{width:17px;height:17px;margin:0;display:block}
/* ---- Text cursor and selection in the brand colour (inputs, the composer, selectable text).
   The teardrop handles on phones are drawn by the browser; in the native build tint them with the theme accent. */
body{caret-color:var(--accent-ink);accent-color:var(--accent)}
::selection{background:color-mix(in srgb,var(--accent) 34%,transparent)}
body.light ::selection{background:color-mix(in srgb,var(--accent) 42%,transparent)}

/* ---- On-screen keyboard: sheets and the sign-in overlay sit above it (--kb from ad_keyboard) */
dialog{bottom:var(--kb,0px);max-height:min(88dvh,780px,calc(var(--app-height,100dvh) - 12px))}
#auth,#lock{bottom:var(--kb,0px)}
html.kb-open dialog{padding-bottom:12px}

/* ---- Full-height sheets (WhatsApp «قائمة جديدة»): content on top, the action at the bottom riding above the
   keyboard (--kb, --app-height) or the emoji panel */
dialog{--sheet-px:clamp(16px,4vw,24px)}
dialog.full-sheet{height:min(calc(var(--app-height,100dvh) - 8px - env(safe-area-inset-top)),940px);max-height:none;flex-direction:column;overflow:hidden}
dialog.full-sheet[open]{display:flex}   /* only when open: a closed dialog must stay display:none */
dialog.full-sheet>.sheet-page{flex:1;min-height:0;display:flex;flex-direction:column}
dialog.full-sheet.emo-open{padding-bottom:0}
@media(min-width:900px){dialog{--sheet-px:24px}dialog.full-sheet{height:min(680px,85dvh)}}
.list-form{flex:1;min-height:0;display:flex;flex-direction:column}
.list-top{flex:1;min-height:0;overflow:auto;display:grid;align-content:start;gap:10px;padding:2px 0 8px}
.list-foot{flex:none;padding-top:10px}
.list-foot .btn.full{margin-top:0}
.list-pick{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.list-rows{flex:1;min-height:0;overflow:auto;margin:0}
/* ---- Emoji panel */
.emoji-panel{position:relative;flex:none;display:flex;flex-direction:column;height:var(--emo-h,300px);margin:12px calc(-1 * var(--sheet-px)) 0;background:color-mix(in srgb,var(--text) 3%,var(--raised));border-top:1px solid var(--line);-webkit-user-select:none;user-select:none}
body.light .emoji-panel{background:#F1EEE7}
.emoji-panel[hidden]{display:none}
.emoji-panel.searching{height:auto}
.emoji-panel.searching .emo-top,.emoji-panel.searching .emo-scroll,.emoji-panel.searching .emo-tabs{display:none}
.emo-top{flex:none;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 10px}
.emo-ib{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.emo-ib:active{background:var(--hover)}
.emo-ib svg{width:22px;height:22px}
.emo-pill{display:grid;place-items:center;width:112px;height:34px;border-radius:999px;background:var(--fill-2);border:1px solid var(--line-strong);color:var(--text)}
body.light .emo-pill{background:#fff}
.emo-pill svg{width:22px;height:22px}
.emo-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 6px 6px;scrollbar-width:none}
.emo-scroll::-webkit-scrollbar{display:none}
.emo-sec h4{margin:8px 8px 2px;color:var(--muted);font-size:13px;font-weight:600}
.emo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
.emo{position:relative;height:46px;display:grid;place-items:center;border-radius:12px;font:28px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--font);transition:transform .1s}
.emo:active{background:var(--hover);transform:scale(.9)}
@media(hover:hover){.emo:hover{background:var(--hover)}}
.emo.tn::after{content:"";position:absolute;right:6px;bottom:6px;border-style:solid;border-width:0 0 5px 5px;border-color:transparent transparent var(--faint) transparent}
.emo-tabs{flex:none;display:flex;gap:2px;height:48px;padding:4px 6px;border-top:1px solid var(--line)}
.emo-tab{flex:1;min-width:0;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.emo-tab svg{width:21px;height:21px}
.emo-tab[aria-selected="true"]{background:var(--fill-2);color:var(--text)}

.emo-find{flex:none;display:flex;align-items:center;gap:6px;height:54px;padding:0 8px}

body.light .emo-find input{background:#fff}
.emo-results{flex:none;display:flex;gap:2px;min-height:54px;overflow-x:auto;scrollbar-width:none;padding:0 8px 8px}

/* ---- Skeletons for every data page (ag_skeleton): same geometry as the real cards, rows, tabs and buttons */
.sk-page{display:grid;align-content:start;gap:0;animation:enter .25s var(--ease) both}
.sk-line.thin{height:9px;margin:4px 0}
.sk-line.lg{height:15px;margin:6px 0}
.sk-line.xl{height:20px;margin:6px 0;border-radius:10px}
.sk-line.hero{height:38px;margin:6px 0;border-radius:12px}
.sk-line.end{margin-inline-start:auto}
.sk-pill{display:inline-block;flex:none;border-radius:999px}
.sk-btn{display:block;height:48px;border-radius:999px;flex:1}
.sk-btn.full{width:100%;margin-top:12px;flex:none}
.sk-h3{margin:14px 6px 2px}
.sk-h3 .sk-line{height:10px}
.sk-chips{display:flex;gap:8px;overflow:hidden;padding:2px 0 10px}
.sk-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:4px;margin:4px 0 16px;border-radius:var(--r-pill);background:var(--surface)}
.sk-tabs .sk{height:36px;border-radius:999px;opacity:.55}
.sk-tabs .sk:first-child{opacity:1}
.sk-group{margin:8px 0 16px;border-radius:var(--r-md);background:var(--surface);overflow:hidden;box-shadow:var(--hi)}
.sk-row.in-group{min-height:60px;padding:10px 14px}
.sk-row.in-group+.sk-row.in-group{border-top:1px solid var(--line)}
.sk-row.flat{padding:0;min-height:0}
.sk-ic{width:30px;height:30px;flex:none;border-radius:9px}
.sk-chev{width:14px;height:14px;flex:none;border-radius:4px;opacity:.6}
.sk-end{width:36px;flex:none;align-self:flex-start;margin-top:6px}
.sk-card-box{display:grid;gap:2px;margin:0 0 14px;padding:16px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--hi)}
.sk-card-box.plan{gap:4px}
.sk-big{display:flex;align-items:center;gap:12px}
.sk-big .sk-line{flex:none}
.sk-spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sk-spread .sk-line{flex:none}
.sk-track{display:block;height:8px;border-radius:999px;margin:8px 0}
.sk-track.full{width:100%}
.sk-track.tall{height:12px}
.sk-chart-in{display:block;height:170px;margin-top:10px;border-radius:12px}
.sk-hero-p{display:grid;justify-items:center;gap:4px;padding:10px 0 18px}
.sk-hero-p .sk-line{margin-inline:auto}
.sk-av-xl{width:96px;height:96px;border-radius:50%;margin-bottom:8px}
.sk-sq-xl{width:96px;height:96px;border-radius:28px;margin-bottom:8px}
.sk-actions{display:flex;justify-content:center;gap:12px;margin:-6px 0 18px}
.sk-note{padding:2px 6px 6px}
.sk-title{padding:4px 0 8px}
.sk-field{display:grid;gap:6px;margin:14px 0}
.sk-input{display:block;height:48px;border-radius:var(--r-sm)}
.sk-input.area{height:120px}
.sk-date{display:flex;justify-content:center;margin:2px 0 6px}
.sk-bar-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.sk-bar-row .sk-lines{display:grid;gap:4px}
.sk-bar-row>.sk-line{width:44px!important;flex:none}
/* photos in chat shimmer until loaded */
/* photos: shimmer at the photo's own size until it has downloaded (an upload in progress is local: never) */
.img-msg img,.sheet-photo-box img{transition:opacity .25s var(--ease)}
.img-msg:not(.busy):not(.ld),.sheet-photo-box:not(.ld){background:linear-gradient(90deg,var(--fill) 25%,var(--fill-2) 50%,var(--fill) 75%);background-size:300% 100%;animation:sk 1.3s ease-in-out infinite}
.img-msg:not(.busy):not(.ld) img,.sheet-photo-box:not(.ld) img{opacity:0}
.sheet-photo-box{display:block;border-radius:18px;overflow:hidden}
/* sheets that fetch: the skeleton keeps the content's size */
.sk-slot>.sk-page{gap:0}
.sk-chart-sheet{position:relative;width:100%;aspect-ratio:600/310;max-height:min(45dvh,340px);direction:ltr}
.sk-chart-sheet .sk{position:absolute;width:1.75%;border-radius:3px}

.sk-gap{display:block;height:12px}

.sk-older{display:flex;flex-direction:column;gap:12px;padding:8px 4px 18px}
@media (prefers-reduced-motion:reduce){.img-msg:not(.ld),.sheet-photo-box:not(.ld){animation:none}.sk-page{animation:none}}

/* ---- expandable sheets (the market chart): rest at their content's height, raise to the top of the screen.
   Always a flex column, so resting and raised lay out the same way and the chart (.grow) takes the extra height. */
dialog.expandable[open]{display:flex;flex-direction:column}
dialog.expandable>*{flex:none}
dialog.expandable:is(.resizing,.expanded){max-height:none}
