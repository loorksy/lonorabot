<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Lonora</title>
<style>
/* Lonora 6 · one design system for mobile and desktop.
   Brand: Charcoal #0B0C10 · Surface #15161B · Border #23252C · Muted #8B919E · Ivory #F7F5EF (primary) · Accent #22E3A8 (accent only).
   WhatsApp structure, Telegram floating tab bar, Claude floating composer, glass blur, light 3D touches. */
:root{
 color-scheme:dark;
 --font:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
 --bg:#0B0C10;--surface:#15161B;--raised:#1B1D23;--fill:#23252C;--fill-2:#2C2F37;
 --line:#23252C;--line-strong:#343741;
 --text:#F7F5EF;--muted:#8B919E;--faint:#6A707C;--wall-ink:#F2EEE4;--add-card:rgba(255,255,255,.055);--add-ic:rgba(255,255,255,.08);--add-press:rgba(255,255,255,.1);
 --primary:#F7F5EF;--on-primary:#0B0C10;--primary-hi:#ffffff;--primary-lo:#E6E2D8;
 --accent:#22E3A8;--accent-ink:#22E3A8;--on-accent:#05271c;--wave-accent:#0FA678;
 --mint:var(--accent-ink);
 --bubble-in:#15161B;--bubble-out:#23262E;
 --red:#ff8a91;--danger-fill:#e5484d;--amber:#F2C46B;--violet:#a99aff;
 --hover:rgba(255,255,255,.05);--lens:rgba(255,255,255,.10);
 --glass:rgba(11,12,16,.72);--glass-bar:rgba(21,22,27,.74);--glass-card:rgba(21,22,27,.84);--glass-pop:rgba(27,29,35,.86);
 --glass-line:rgba(255,255,255,.08);--stage:#050608;--viz-dim:#4B4E57;--viz-ink:#D9D6CE;--thumb:#30333C;--blur:blur(20px) saturate(160%);
 --hi:inset 0 1px 0 rgba(255,255,255,.07);
 --raise:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.35);
 --float-shadow:0 12px 36px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
 --r-sm:10px;--r-md:16px;--r-lg:24px;--r-pill:999px;--r-tail:6px;
 --fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:20px;--fs-xl:28px;
 --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.3,1.35,.5,1);
 --app-height:100dvh;
}
body.light{
 --stage:#E2DED3;--viz-dim:#CCC8BE;--viz-ink:#3A3D45;--thumb:#FFFFFF;
 color-scheme:light;
 --bg:#F7F5EF;--surface:#FFFFFF;--raised:#FFFFFF;--fill:#ECE9E1;--fill-2:#E2DED4;
 --line:#E3DFD5;--line-strong:#CFCAC0;
 --text:#0B0C10;--muted:#5D6270;--faint:#868B97;--wall-ink:#17181D;--add-card:rgba(11,12,16,.045);--add-ic:#FFFFFF;--add-press:rgba(11,12,16,.09);
 --primary:#0B0C10;--on-primary:#F7F5EF;--primary-hi:#2A2C33;--primary-lo:#0B0C10;
 --accent-ink:#087A57;--wave-accent:#22E3A8;
 --bubble-in:#FFFFFF;--bubble-out:#EAE7DF;
 --red:#c0392b;--amber:#9a6a00;--violet:#6c55ba;
 --hover:rgba(11,12,16,.05);--lens:rgba(11,12,16,.07);
 --glass:rgba(247,245,239,.78);--glass-bar:rgba(255,255,255,.76);--glass-card:rgba(255,255,255,.88);--glass-pop:rgba(255,255,255,.92);
 --glass-line:rgba(11,12,16,.08);
 --hi:inset 0 1px 0 rgba(255,255,255,.7);
 --raise:inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(11,12,16,.08);
 --float-shadow:0 12px 32px rgba(11,12,16,.12),0 2px 6px rgba(11,12,16,.06);
}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
 :root{--glass:#0B0C10;--glass-bar:#15161B;--glass-card:#15161B;--glass-pop:#1B1D23}
 body.light{--glass:#F7F5EF;--glass-bar:#fff;--glass-card:#fff;--glass-pop:#fff}
}
@media(prefers-reduced-transparency:reduce){
 :root{--glass:#0B0C10;--glass-bar:#15161B;--glass-card:#15161B;--glass-pop:#1B1D23}
 body.light{--glass:#F7F5EF;--glass-bar:#fff;--glass-card:#fff;--glass-pop:#fff}
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:400 var(--fs-md)/1.6 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:default}
:where(button,a,input,textarea,select,[tabindex]):focus-visible{outline:2px solid var(--text);outline-offset:2px}
svg{width:22px;height:22px;flex-shrink:0;vertical-align:middle}
button svg{pointer-events:none}
h1,h2,h3{margin:0}
h2{font-size:var(--fs-lg);font-weight:700;line-height:1.4;margin:4px 0 12px}
h3{font-size:var(--fs-xs);font-weight:600;color:var(--muted);margin:24px 4px 8px}
p{margin:8px 0 16px}
small,.muted{color:var(--muted)}
.small{font-size:var(--fs-xs)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* App shell: content scrolls under a glass top bar and floating bottom controls */
#app{position:relative;height:var(--app-height);width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 55% at 50% -8%,rgba(255,255,255,.045),transparent 62%),var(--bg)}
body.light #app{background:radial-gradient(120% 55% at 50% -8%,rgba(255,255,255,.9),transparent 62%),var(--bg)}
.topbar{position:absolute;inset:0 0 auto 0;z-index:20}
.topbar::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-line);border-radius:var(--pr,0px) var(--pr,0px) 0 0;opacity:var(--edge,1);transition:opacity .14s linear}
.topbar.bare{pointer-events:none;padding-top:env(safe-area-inset-top)}
.topbar.bare>*{pointer-events:auto}
.topbar.bare::before{bottom:-28px;border-bottom:0;background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 70%,transparent) 55%,transparent);-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.topbar.bare .call-strip{background:var(--glass-bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:0;border-bottom:1px solid var(--glass-line)}
.float-actions{position:absolute;top:calc(100% + 12px);inset-inline-end:12px;display:flex;gap:8px}
.float-actions .icon{width:42px;height:42px;background:var(--glass-card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--hi),0 8px 22px rgba(0,0,0,.28)}
.large-title{font-size:30px;font-weight:800;line-height:40px;letter-spacing:-.3px;margin:0 6px 14px;padding-inline-end:56px;transform-origin:100% 0;will-change:transform,opacity}
header{height:60px;display:flex;align-items:center;gap:6px;padding:8px 10px;position:relative}
header h1{flex:1;min-width:0;font-size:var(--fs-lg);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:6px}
main{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--top-h,60px) + 4px) 16px calc(var(--bottom-h,0px) + 24px);overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
main.root{touch-action:pan-y}
main.root.bare{padding-top:calc(var(--top-h,0px) + 13px)}
main.page-enter{animation:enter .22s var(--ease) both}
@keyframes enter{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Telegram-style floating tab bar with a sliding lens */
nav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:22;height:66px;display:flex;align-items:stretch;padding:5px;border-radius:33px;background:var(--glass-bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow),var(--hi);touch-action:none;user-select:none;-webkit-user-select:none;transition:left .32s var(--ease),right .32s var(--ease),height .32s var(--ease),bottom .32s var(--ease)}
nav button{position:relative;z-index:1;flex:1;min-width:0;display:grid;justify-items:center;align-content:center;gap:1px;border-radius:28px;--on:0;color:color-mix(in oklab,var(--text) calc(var(--on)*100%),var(--muted));font-size:var(--fs-xs);transition:color .2s}
nav .nav-icon{position:relative;display:grid;place-items:center;height:28px}
nav .nav-icon svg{width:24px;height:24px}
nav .nav-label{line-height:1.3;white-space:nowrap;max-height:18px;overflow:hidden;transition:opacity .2s,max-height .3s var(--ease)}
nav .active,nav button.peek{--on:1;font-weight:600}
nav.dragging .active:not(.peek){--on:0;font-weight:400}
nav.paging button{transition:none}
nav.paging .active.unpeek{font-weight:400}
.nav-lens{position:absolute;top:5px;bottom:5px;left:0;width:0;z-index:0;border-radius:28px;background:var(--lens);box-shadow:var(--hi),0 4px 14px rgba(0,0,0,.22);transition:transform .42s var(--spring),width .32s var(--ease)}
nav.dragging .nav-lens{background:color-mix(in srgb,var(--text) 14%,transparent);transform-origin:center}
nav.compact{left:21%;right:21%;height:54px;bottom:calc(env(safe-area-inset-bottom) + 10px)}
nav.compact .nav-label{opacity:0;max-height:0}
.nav-badge{position:absolute;top:-4px;inset-inline-end:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.nav-dot{position:absolute;top:1px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}

/* Buttons, chips, switches */
.icon{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0;color:var(--text);transition:background .15s,transform .15s}
.icon:hover{background:var(--hover)}
.icon:active,.btn:active,.chip:active,.tile:active{transform:scale(.97)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r-pill);border:1px solid transparent;background:var(--fill);color:var(--text);font-size:var(--fs-sm);font-weight:600;box-shadow:var(--raise);transition:background .15s,filter .15s}
.btn svg{width:18px;height:18px}
/* hover only where there is a real hover (no sticky hover after a tap), and never on primary buttons */
@media(hover:hover){.btn:where(:not(.primary)):hover:not(:disabled){background:var(--fill-2)}}
.btn.primary{background:linear-gradient(180deg,var(--primary-hi),var(--primary-lo));color:var(--on-primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 8px rgba(0,0,0,.28)}
body.light .btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 8px rgba(11,12,16,.18)}
.btn.primary:hover:not(:disabled){filter:brightness(.96)}
.btn.outline{background:transparent;border-color:var(--line-strong);box-shadow:none}
.btn.outline:hover:not(:disabled){background:var(--hover)}
.btn.danger{background:transparent;color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);box-shadow:none}
.btn.danger:hover:not(:disabled){background:color-mix(in srgb,var(--red) 10%,transparent)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line-strong)}
.btn.sm{min-height:36px;padding:6px 14px}
.btn.full,.full{width:100%;margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.actions>.btn{flex:1}
.link{color:var(--text);font-size:var(--fs-xs);font-weight:600;padding:4px 6px;border-radius:var(--r-sm);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.link:hover{background:var(--hover)}
.chip{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;min-height:36px;padding:6px 14px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:var(--fs-sm);white-space:nowrap;box-shadow:var(--hi);transition:background .15s,border-color .15s}
.chip svg{width:18px;height:18px;color:var(--muted)}
.chip:hover{background:var(--fill)}
.chip.active{background:var(--primary);border-color:transparent;color:var(--on-primary);font-weight:600}
.chip.active svg{color:currentColor}
input[type=checkbox][role=switch],.switch{appearance:none;-webkit-appearance:none;position:relative;display:inline-block;flex:0 0 48px;width:48px!important;height:28px;min-height:28px!important;padding:0!important;margin:0;border:0!important;border-radius:var(--r-pill)!important;background:var(--line-strong)!important;cursor:pointer;direction:ltr;box-shadow:inset 0 1px 3px rgba(0,0,0,.3);transition:background-color .2s}
input[type=checkbox][role=switch]::before,.switch::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#fff,#e9e9e9);box-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .22s var(--spring)}
input[type=checkbox][role=switch]:checked,.switch[aria-checked="true"]{background:var(--accent)!important}
input[type=checkbox][role=switch]:checked::before,.switch[aria-checked="true"]::before{transform:translateX(20px)}

/* Forms */
input,textarea,select{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:var(--fs-md);transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--muted);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
input[type=radio],input[type=checkbox]:not([role=switch]){width:20px;height:20px;min-height:20px;padding:0;accent-color:var(--primary);flex-shrink:0}
.field{display:block;margin:16px 0}
.field>span{display:block;margin-bottom:6px;font-size:var(--fs-sm);font-weight:600}
.field small{display:block;margin-top:6px;font-size:var(--fs-xs)}
.check{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.check>span{flex:1;min-width:0}
.check strong{font-weight:600}
.check>svg{color:var(--muted)}
.secret{display:flex;align-items:center;gap:6px}
.secret input{flex:1;min-width:0}
.color-input{width:44px!important;min-height:36px;padding:3px;border-radius:var(--r-sm)}
.select-native{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;opacity:0;pointer-events:none;clip-path:inset(50%)}
.select-trigger{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);text-align:start;font-size:var(--fs-md);transition:background .15s,border-color .15s}
.select-trigger:hover{background:var(--fill)}
.select-trigger[aria-expanded="true"]{border-color:var(--muted)}
.select-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.select-trigger svg{width:18px;height:18px;color:var(--muted)}
.select-popup{position:fixed;inset:auto;margin:0;padding:6px;border:1px solid var(--glass-line);border-radius:var(--r-md);background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--text);box-shadow:var(--float-shadow);overflow:auto;max-height:320px;z-index:1000;scrollbar-width:thin;direction:rtl;animation:pop-in .14s ease}
.select-popup:popover-open{display:block}
.select-option{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-sm);text-align:start;font-size:var(--fs-sm)}
.select-option:hover,.select-option:focus-visible{background:var(--hover);outline:none}
.select-option[aria-selected="true"]{font-weight:700}
.select-option[aria-selected="true"] .option-mark{color:var(--accent-ink)}
.select-option svg{width:18px;height:18px}
.select-option:disabled{opacity:.4}
.select-option .option-mark{width:18px;flex-shrink:0}
@keyframes pop-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Lists */
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:start;color:var(--text);transition:background .15s}
button.row:hover{background:var(--hover)}
.row>svg{color:var(--muted)}
.row .body{flex:1;min-width:0;display:block}
.row strong{display:block;font-size:var(--fs-md);font-weight:600;line-height:1.45}
.row small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:var(--fs-sm);line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.row .value{max-width:52%;min-width:0;color:var(--muted);font-size:var(--fs-sm);text-align:end;overflow-wrap:anywhere}
.row .chevron{display:grid;color:var(--muted)}
.row .chevron svg,.row>svg:last-child:not(:first-child){width:18px;height:18px}
.flat{border-bottom:0}
.group{background:var(--surface);border-radius:var(--r-md);overflow:hidden;margin:8px 0 16px;box-shadow:var(--hi),0 1px 2px rgba(0,0,0,.18)}
.group>.row,.group>.check{padding-inline:14px}
.group>.row:last-child,.group>.check:last-child{border-bottom:0}
.group>.btn.full{margin:0;border-radius:0;background:transparent;box-shadow:none}
.group .pad{padding:14px;margin:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 4px 8px}
.section-head h3{margin:0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.on{color:var(--accent-ink)}
.status.off{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill);background:var(--fill);color:var(--text);font-size:var(--fs-xs);font-weight:600;box-shadow:var(--hi)}
.badge svg{width:14px;height:14px;color:var(--accent-ink)}
.badge.off{color:var(--muted)}
.badge.off svg{color:var(--muted)}
.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty svg{width:32px;height:32px;margin-bottom:12px}
.note{margin:0;padding:12px 4px;color:var(--muted);font-size:var(--fs-xs);line-height:1.8}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
.row-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--fill);color:var(--muted);box-shadow:var(--hi)}
.row-icon svg{width:20px;height:20px}
.row.unread strong{font-weight:700}

/* Avatars: glossy 3D bead */
.avatar{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;flex-shrink:0;background:var(--fill);color:var(--muted)}
.avatar svg{width:100%;height:100%}
.avatar.agent-av::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.42),rgba(255,255,255,0) 36%),radial-gradient(circle at 70% 92%,rgba(0,0,0,.34),rgba(0,0,0,0) 52%);box-shadow:inset 0 -2px 5px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.18)}
.avatar.big{width:88px;height:88px}
.avatar.initial{background:linear-gradient(180deg,var(--fill-2),var(--fill));color:var(--text);font-size:var(--fs-lg);font-weight:700;box-shadow:var(--hi)}
.avatar.initial.big{font-size:var(--fs-xl)}
.avatar.group-av{background:linear-gradient(180deg,var(--fill-2),var(--fill));box-shadow:var(--hi)}
.avatar.group-av svg{width:55%;height:55%}
.avatar.icon-av{background:linear-gradient(180deg,var(--fill-2),var(--fill));color:var(--text);box-shadow:var(--hi)}
.avatar.icon-av svg{width:50%;height:50%}

/* Brand mark (3D bars) */
.logo-mark .lb{fill:url(#lm-ivory)}
body.light .logo-mark .lb{fill:url(#lm-ink)}
.logo-hero{position:relative;display:inline-grid;place-items:center;width:112px;height:112px;border-radius:30px;background:linear-gradient(160deg,var(--fill-2),var(--surface) 55%,var(--bg));box-shadow:var(--hi),0 18px 40px rgba(0,0,0,.45),0 0 0 1px var(--glass-line);transform:perspective(700px) rotateX(10deg) rotateY(-12deg);animation:float3d 7s ease-in-out infinite}
body.light .logo-hero{background:linear-gradient(160deg,#fff,#F2EFE7);box-shadow:var(--hi),0 18px 40px rgba(11,12,16,.12),0 0 0 1px var(--glass-line)}
.logo-hero::after{content:"";position:absolute;left:12%;right:12%;bottom:-26px;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);filter:blur(4px);z-index:-1}
@keyframes float3d{0%,100%{transform:perspective(700px) rotateX(10deg) rotateY(-12deg) translateY(0)}50%{transform:perspective(700px) rotateX(4deg) rotateY(12deg) translateY(-6px)}}
.arcs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.arcs::before,.arcs::after{content:"";position:absolute;left:50%;width:160%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);border-top:1px solid rgba(255,255,255,.16);box-shadow:0 -24px 80px -30px rgba(255,255,255,.18)}
.arcs::before{top:58%}
.arcs::after{top:70%;width:190%;border-top-color:rgba(34,227,168,.14);box-shadow:0 -24px 80px -34px rgba(34,227,168,.16)}
body.light .arcs::before{border-top-color:rgba(11,12,16,.10);box-shadow:none}
body.light .arcs::after{border-top-color:rgba(8,122,87,.14);box-shadow:none}

/* Cards, hero, tabs, data */
.hero{text-align:center;padding:16px 0 24px}
.hero h2{margin:12px 0 2px}
.hero p{color:var(--muted);margin:0 0 10px}
.edit-wrap{position:relative;display:inline-block;line-height:0}
.pencil{position:absolute;bottom:0;left:-4px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);border:3px solid var(--bg)}
.pencil svg{width:16px;height:16px}
.hero-actions{display:flex;justify-content:center;gap:28px;margin-top:18px}
.hero-actions button{display:grid;justify-items:center;gap:6px;font-size:var(--fs-xs);color:var(--text)}
.hero-actions .icon{width:48px;height:48px;background:var(--surface);box-shadow:var(--raise)}
.card{background:var(--surface);border-radius:var(--r-md);padding:16px;margin:12px 0;box-shadow:var(--hi)}
.card .row:last-child{border-bottom:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:4px 0 16px;padding:4px;border-radius:var(--r-pill);background:var(--surface);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-height:36px;padding:6px 14px;border-radius:var(--r-pill);color:var(--muted);font-size:var(--fs-sm);white-space:nowrap;transition:background .2s,color .2s}
.tabs button.active{background:var(--fill-2);color:var(--text);font-weight:600;box-shadow:var(--raise)}
.stat{font-size:var(--fs-xl);font-weight:700;line-height:1.3;direction:ltr}
.stats{display:flex;gap:16px}
.stats>div{flex:1}
.progress{height:8px;margin:12px 0;border-radius:var(--r-pill);background:var(--fill);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.progress i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--accent),#7ff2cf)}
.paper{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:var(--surface);border-radius:var(--r-md);line-height:1.8}
.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.catalog .btn{justify-content:flex-start;min-width:0;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:400;text-align:start;overflow-wrap:anywhere}
.chart{width:100%;display:block;max-height:min(45dvh,340px);height:auto;aspect-ratio:600/310;touch-action:manipulation;direction:ltr}   /* time runs left→right; labels anchor at their left */
.fold-card{overflow:hidden}
.fold-top{width:100%;display:flex;align-items:center;gap:8px;padding:2px 0;border-radius:var(--r-sm);text-align:start}
.fold-top .fold-title{flex:1;min-width:0}
.fold-top strong,.fold-top small{display:block}
.fold-top small{font-size:var(--fs-sm);color:var(--muted);overflow-wrap:anywhere}
.fold-arrow{color:var(--muted);transition:transform .2s var(--ease)}
.fold-card.is-collapsed .fold-arrow{transform:rotate(90deg)}
.fold-content{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .22s var(--ease),opacity .2s}
.fold-card.is-collapsed .fold-content{grid-template-rows:0fr;opacity:0}
.fold-inner{min-height:0;overflow:hidden}

/* Chats list (WhatsApp structure) */
header.chats-header h1{flex:0 1 auto;max-width:160px;transition:max-width .34s var(--ease),opacity .2s,padding .34s var(--ease)}
header.chats-header.title-off h1{max-width:0;opacity:0;padding-inline:0}
.header-search{position:relative;display:flex;align-items:center;flex:1 1 0;min-width:0;max-width:520px;height:42px;border-radius:var(--r-pill);background:var(--fill);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);overflow:hidden;transition:flex-basis .2s var(--ease),max-width .2s var(--ease)}
.header-search:focus-within{box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 1px var(--line-strong)}
.header-search-icon{position:absolute;right:13px;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.header-search-icon svg{width:18px;height:18px}
.header-search input[type=search]{flex:1;width:100%;min-width:0;height:42px;min-height:0;padding:6px 40px 6px 8px;border:0;border-radius:var(--r-pill);background:transparent;font-size:var(--fs-sm);outline:none;text-overflow:ellipsis}
.header-search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.header-search .search-clear{flex:0 0 0;width:0;height:30px;display:grid;place-items:center;overflow:hidden;opacity:0;pointer-events:none;color:var(--muted);transition:flex-basis .18s,opacity .15s}
.header-search.is-searching .search-clear,.header-search.has-query .search-clear{flex-basis:30px;width:30px;opacity:1;pointer-events:auto;margin-left:6px}
.header-search .search-clear svg{width:16px;height:16px}
header.chats-header.search-active{gap:0}
header.chats-header.search-active h1,header.chats-header.search-active>button[data-do="new-chat"]{flex:0 0 0;width:0;max-width:0;padding:0;opacity:0;overflow:hidden;visibility:hidden;pointer-events:none}
header.chats-header.search-active .header-search{flex:1 1 100%;max-width:100%}
/* chips run edge to edge (WhatsApp): the row bleeds into the page padding, the first chip still lines up with the content */
.list-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 10px;scroll-padding-inline:16px;overscroll-behavior-x:contain}
.list-filters::-webkit-scrollbar{display:none}
.list-filters .chip{min-height:32px;padding:4px 14px}
.thread{min-height:72px;padding:10px 8px;border-bottom:0;border-radius:var(--r-md);gap:12px}
.thread .avatar{width:50px;height:50px}
.thread .line1,.thread .line2{display:flex;align-items:center;gap:8px;min-width:0}
.thread .line1 strong{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .line1 time{flex-shrink:0;font-size:var(--fs-xs);color:var(--muted)}
.thread .line2{margin-top:1px}
.thread .pv{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden}
.thread .pv>span{overflow:hidden;text-overflow:ellipsis}
.thread .pv svg{width:16px;height:16px}
.thread .pv .read{color:var(--accent-ink)}
.thread.unread .line1 time{color:var(--accent-ink);font-weight:600}
.thread.unread .pv{color:var(--text)}
.thread.selected{background:var(--fill)}
.count{flex-shrink:0;min-width:22px;height:22px;padding:0 7px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);font-size:var(--fs-xs);font-weight:700;line-height:22px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.paused{flex-shrink:0;padding:1px 8px;border-radius:var(--r-pill);background:var(--fill);color:var(--muted);font-size:var(--fs-xs)}
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.stories::-webkit-scrollbar{display:none}
.story{width:70px;flex-shrink:0;display:grid;justify-items:center;gap:6px;color:var(--muted);font-size:var(--fs-xs)}
.story small{max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-ring{display:grid;padding:3px;border-radius:50%;border:2px solid var(--line-strong)}
.story.ring .story-ring{border-color:var(--accent)}
.story .avatar{width:54px;height:54px}

/* Chat header: WhatsApp — name and presence */
.chat-head{gap:2px;padding-inline:6px}
.head-avatar{display:grid;flex-shrink:0;border-radius:50%}
.head-avatar .avatar{width:40px;height:40px}
.chat-title{flex:1;min-width:0;display:grid;gap:0;padding-inline:8px 4px}
.chat-name{justify-self:start;max-width:100%;font-size:var(--fs-md);font-weight:700;line-height:1.3;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.presence{min-width:0;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.presence.typing{color:var(--accent-ink)}

/* Messages */
main.chat-main{display:flex;flex-direction:column;padding-inline:12px}
.messages{width:100%;max-width:760px;margin:auto auto 0;display:flex;flex-direction:column;padding-top:4px}
.date{align-self:center;margin:6px 0 8px}
.date span{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);background:var(--glass-bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--muted);font-size:var(--fs-xs);box-shadow:var(--hi)}
.msg{position:relative;display:flex;flex-direction:column;align-items:flex-start;margin-top:2px}
.msg.first{margin-top:10px}
.msg.mine{align-items:flex-end}
.msg-line{position:relative;display:flex;align-items:center;gap:6px;max-width:84%;min-width:0}
.msg.mine .msg-line{flex-direction:row-reverse}
.bubble{position:relative;z-index:1;min-width:0;display:flow-root;padding:7px 12px 6px;border-radius:var(--r-md);background:var(--bubble-in);color:var(--text);font-size:var(--fs-md);line-height:1.6;text-align:start;overflow-wrap:anywhere;touch-action:pan-y;box-shadow:var(--hi),0 1px 2px rgba(0,0,0,.25);transition:transform .2s var(--ease),box-shadow .15s}
.msg.mine .bubble{background:var(--bubble-out)}
body.light .bubble{box-shadow:0 1px 2px rgba(11,12,16,.08)}
.msg.first.theirs .bubble{border-start-start-radius:var(--r-tail)}
.msg.first.mine .bubble{border-start-end-radius:var(--r-tail)}
.bubble .text{display:inline;white-space:pre-wrap}
.meta{float:left;display:inline-flex;align-items:center;gap:3px;margin:7px 12px -3px 0;color:var(--muted);font-size:var(--fs-xs);line-height:1;direction:ltr}
.ticks{display:inline-grid}
.ticks svg{width:16px;height:16px}
.ticks.read{color:var(--accent-ink)}
.sender{display:block;margin-bottom:2px;font-size:var(--fs-sm);font-weight:600}
.quote{display:block;width:100%;margin:2px 0 6px;padding:6px 12px 6px 10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--text) 6%,transparent);box-shadow:inset -3px 0 0 var(--q,var(--accent-ink));text-align:start;overflow:hidden}
.quote:hover{background:color-mix(in srgb,var(--text) 10%,transparent)}
.quote-name{display:block;color:var(--q,var(--accent-ink));font-size:var(--fs-xs);font-weight:700}
.quote-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--muted);font-size:var(--fs-sm);line-height:1.5}
.msg-more{position:absolute;top:4px;left:4px;z-index:2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:inherit;color:var(--muted);opacity:0;transition:opacity .15s}
.msg-more svg{width:18px;height:18px}
.bubble:hover .msg-more,.msg-more:focus-visible,.msg.selected .msg-more{opacity:1}
.msg-react{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);opacity:0;box-shadow:var(--hi);transition:opacity .15s}
.msg-react svg{width:18px;height:18px}
.msg:hover .msg-react,.msg-react:focus-visible{opacity:1}
.reacts{position:relative;z-index:2;display:inline-flex;align-items:center;gap:4px;height:26px;margin:-6px 10px 0;padding:0 8px;border-radius:var(--r-pill);border:2px solid var(--bg);background:var(--raised);font-size:var(--fs-sm);line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.reacts .n{color:var(--muted);font-size:var(--fs-xs)}
.reacts.has-mine{background:var(--fill-2)}
.msg.selected .bubble{box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 45%,transparent)}
.msg.flash .bubble{animation:flash 1.6s ease-out}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.swipe-hint{position:absolute;top:50%;right:6px;z-index:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text);opacity:0;pointer-events:none;transform:translateY(-50%) scale(.7);transition:transform .12s,background .12s}
.swipe-hint svg{width:18px;height:18px}
.msg.swipe-ready .swipe-hint{background:var(--primary);color:var(--on-primary);transform:translateY(-50%) scale(1)}
.typing .dots{display:inline-flex;gap:4px;padding:8px 2px 6px}
.typing .dots i{width:7px;height:7px;border-radius:50%;background:var(--accent-ink);animation:blink 1.2s infinite both}
.typing .dots i:nth-child(2){animation-delay:.2s}
.typing .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.msg.k-card .msg-line{width:min(340px,92%);max-width:92%}
.bubble.wide{flex:1}
.mcard{display:grid;gap:6px;padding:4px 0 2px}
.mcard-kicker{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:var(--fs-xs);font-weight:600}
.mcard-kicker svg{width:16px;height:16px}
.mcard strong{font-weight:700;line-height:1.5}
.mcard>small:not(.mcard-note){font-size:var(--fs-sm)}
.mcard-actions,.mcard .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mcard-actions .btn{flex:1}
.mcard .badge{justify-self:start;margin-top:4px}
.mcard-note{color:var(--faint);font-size:var(--fs-xs)}
.mcard-form{display:flex;align-items:center;gap:6px;margin-top:4px}
.mcard-form input{height:40px;min-height:40px;padding:6px 14px;border-radius:var(--r-pill);background:var(--bg);font-size:var(--fs-sm)}
.send-sm{width:40px;height:40px;background:var(--primary);color:var(--on-primary)}
.send-sm svg{width:20px;height:20px}
.call-bubble{display:flex;align-items:center;gap:10px;padding:8px 12px}
.call-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--fill);color:var(--accent-ink);box-shadow:var(--hi)}
.call-ico svg{width:20px;height:20px}
.call-bubble.missed .call-ico{color:var(--red)}
.call-body{flex:1;display:grid;line-height:1.4}
.call-body strong{font-size:var(--fs-sm);font-weight:600}
.call-body small{font-size:var(--fs-xs)}
.call-bubble .meta{float:none;margin:0 6px 0 0;align-self:flex-end}
.file-chip{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--text) 6%,transparent);text-align:start}
.file-chip>svg{width:28px;height:28px;color:var(--text)}
.file-chip strong{display:block;font-size:var(--fs-sm);font-weight:600;overflow-wrap:anywhere}
.file-chip small{font-size:var(--fs-xs)}
.chat-empty{position:relative;margin:auto;padding:40px 16px;display:grid;justify-items:center;gap:6px;text-align:center;isolation:isolate}
.chat-empty>*{position:relative;z-index:1}
.chat-empty .arcs{z-index:0}
.chat-empty h2{margin:14px 0 0}
.chat-empty p{margin:0;color:var(--muted)}

/* Composer (Claude): floating glass card, text on top, controls below, no top edge */
.composer{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:22}
.composer::before{content:"";position:absolute;left:-10px;right:-10px;top:-36px;bottom:calc(-10px - env(safe-area-inset-bottom));z-index:-1;pointer-events:none;background:linear-gradient(to top,var(--bg) 46%,color-mix(in srgb,var(--bg) 0%,transparent))}
.composer-card{position:relative;max-width:820px;margin:0 auto;padding:10px 10px 8px;border-radius:26px;background:var(--glass-card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--float-shadow),var(--hi)}
.composer textarea[name=message]{display:block;width:100%;height:28px;min-height:28px;max-height:min(164px,34dvh);margin:0;padding:2px 8px;border:0;border-radius:0;background:transparent;resize:none;font-size:var(--fs-md);line-height:24px;outline:none;overflow-y:hidden;scrollbar-width:thin}
.composer textarea::placeholder{color:var(--muted)}
.composer-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.composer-row .grow{flex:1}
.composer-row .icon{width:40px;height:40px}
.composer .cbtn{background:var(--fill);color:var(--text);box-shadow:var(--raise)}
.composer .cbtn:hover{background:var(--fill-2)}
.composer .voice,.composer .send{background:linear-gradient(180deg,var(--primary-hi),var(--primary-lo));color:var(--on-primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 10px rgba(0,0,0,.35)}
.composer .send svg{stroke-width:2.2}
.composer .send{display:none}
.composer.has-text .send{display:grid}
.composer.has-text .voice{display:none}
.composer.listening .mic{background:var(--accent);color:var(--on-accent);animation:listen 1.3s ease-in-out infinite}
@keyframes listen{0%,100%{box-shadow:0 0 0 0 rgba(34,227,168,.45)}50%{box-shadow:0 0 0 8px rgba(34,227,168,0)}}
.wave-ico .wa{stroke:var(--wave-accent)}
.mode-chip{display:inline-flex;align-items:center;gap:6px;flex-shrink:1;min-width:0;height:40px;padding-inline:12px 10px;border-radius:var(--r-pill);background:var(--fill);color:var(--text);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;box-shadow:var(--raise)}
.mode-chip span{overflow:hidden;text-overflow:ellipsis}
.mode-chip svg{width:18px;height:18px;color:var(--muted)}
.mode-chip>svg:last-child{width:14px;height:14px}
.mode-chip:is(.lvl-supervised,.lvl-ask)>svg:first-child{color:var(--text)}
.mode-chip:is(.lvl-autonomous,.lvl-auto){color:var(--amber)}
.mode-chip:is(.lvl-autonomous,.lvl-auto) svg{color:var(--amber)}
.reply-bar{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 8px 6px 6px;border-radius:var(--r-md);background:color-mix(in srgb,var(--text) 6%,transparent);box-shadow:inset -3px 0 0 var(--q,var(--accent-ink))}
.reply-bar-body{flex:1;min-width:0;display:grid;padding-inline:8px 2px}
.reply-bar .quote-text{-webkit-line-clamp:1}
.reply-bar .icon{width:32px;height:32px}
.reply-bar .icon svg{width:18px;height:18px}

/* Popovers (floating glass card) */
.pop{position:fixed;z-index:60;min-width:220px;max-width:min(340px,calc(100vw - 20px));max-height:min(70dvh,520px);overflow:auto;padding:8px;border-radius:var(--r-lg);border:1px solid var(--glass-line);background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--text);box-shadow:var(--float-shadow),var(--hi);opacity:0;transform:scale(.97);transition:opacity .14s,transform .16s var(--ease);direction:rtl}
.pop.show{opacity:1;transform:none}
.pop-title{padding:8px 10px 6px;color:var(--muted);font-size:var(--fs-xs);font-weight:600}
.pop-item{width:100%;display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 10px;border-radius:var(--r-sm);text-align:start;font-size:var(--fs-sm)}
.pop-item:hover,.pop-item:focus-visible{background:var(--hover);outline:none}
.pop-item svg{width:20px;height:20px;color:var(--muted)}
.pop-item.danger,.pop-item.danger svg{color:var(--red)}
.pop-item.static{cursor:default}
.pop-item.static:hover{background:none}
.pop-item strong{display:block;font-weight:600}
.pop-item small{display:block;font-size:var(--fs-xs)}
.pop-emo{width:28px;font-size:22px;line-height:1;text-align:center}
.pop-sep{height:1px;margin:6px 4px;background:var(--glass-line)}
.pop-opt{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);text-align:start}
.pop-opt:hover,.pop-opt:focus-visible{background:var(--hover);outline:none}
.pop-opt-body{flex:1;min-width:0}
.pop-opt strong{display:block;font-size:var(--fs-md);font-weight:700}
.pop-opt small{display:block;margin-top:2px;font-size:var(--fs-xs);line-height:1.5}
.pop-opt>svg{width:20px;height:20px;color:var(--accent-ink)}
.pop-opt.on{background:var(--lens)}
.pop-row{width:100%;display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 12px;border-radius:var(--r-sm);font-size:var(--fs-md)}
.pop-row:hover{background:var(--hover)}
.pop-row>span:first-child{flex:1;text-align:start}
.pop-val{color:var(--muted);font-size:var(--fs-sm)}
.pop-row svg{width:16px;height:16px;color:var(--muted)}
.pop-note{margin:0;padding:6px 12px 4px;color:var(--faint);font-size:var(--fs-xs)}
.react-row{display:flex;justify-content:space-between;gap:2px;padding:2px}
.react-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;transition:transform .15s var(--spring),background .12s}
.react-btn:hover{background:var(--hover);transform:scale(1.18) translateY(-2px)}
.react-btn.on{background:var(--lens)}
.msg-pop{min-width:276px}
.react-pop{min-width:0;padding:6px}
.mode-pop{width:min(330px,calc(100vw - 20px))}

/* Sheets: glass, drag the top area down to close */
dialog{position:fixed;inset:auto 0 0;margin:0 auto;width:min(820px,100%);max-width:820px;max-height:min(88dvh,780px);overflow-y:auto;overscroll-behavior:contain;padding:10px clamp(16px,4vw,24px) max(20px,env(safe-area-inset-bottom));border:1px solid var(--glass-line);border-bottom:0;border-radius:28px 28px 0 0;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--text);box-shadow:0 -12px 60px rgba(0,0,0,.45),var(--hi);transition:transform .22s var(--ease)}
dialog[open]{animation:sheet-in .26s var(--ease) both}
dialog.closing{animation:sheet-out .16s ease-in both;pointer-events:none}
dialog::backdrop{background:rgba(5,6,8,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@keyframes sheet-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes sheet-out{to{opacity:0;transform:translateY(24px)}}
.handle{width:38px;height:5px;margin:2px auto 10px;border-radius:var(--r-pill);background:var(--line-strong);touch-action:none}
.sheet-head{position:sticky;top:-10px;z-index:2;display:flex;align-items:center;gap:8px;padding:4px 0 10px;touch-action:none}
.sheet-head h2{flex:1;margin:0;font-size:var(--fs-lg)}
.sheet-head h2 small{font-size:var(--fs-xs);font-weight:400}
dialog input,dialog textarea,dialog .select-trigger{background:var(--bg)}
.attach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.tile{display:grid;justify-items:center;gap:8px;padding:10px 2px;border-radius:var(--r-md);color:var(--text);font-size:var(--fs-xs);text-align:center;transition:background .15s}
.tile:hover{background:var(--hover)}
.tile-icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(180deg,var(--fill-2),var(--fill));color:var(--text);box-shadow:var(--raise)}
.tile-icon svg{width:24px;height:24px}
.face-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.face-option{min-width:0;display:grid;justify-items:center;gap:6px;padding:10px 2px;border:1px solid var(--line);border-radius:var(--r-md);transition:background .15s,border-color .15s}
.face-option:hover{background:var(--hover)}
.face-option small{font-size:var(--fs-xs)}
.face-option.selected{border-color:var(--text);background:var(--lens)}
.colors{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 2px 3px rgba(255,255,255,.3),inset 0 -2px 3px rgba(0,0,0,.25)}
.swatch.selected{outline:2px solid var(--text);outline-offset:2px}
.preview{text-align:center;padding:12px 0}
.preview .avatar{width:110px;height:110px}
.permission-option{width:100%;display:flex;align-items:flex-start;gap:12px;padding:16px 4px;border-bottom:1px solid var(--line);text-align:start}
.permission-option .body{flex:1}
.permission-option strong,.permission-option small{display:block}
.permission-option small{margin-top:4px;font-size:var(--fs-sm)}
.permission-option.active strong{text-decoration:underline;text-underline-offset:4px}
.permission-option.active>svg:last-child{color:var(--accent-ink)}

/* Calls */
.call-strip{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 12px 4px;color:var(--text);border-top:1px solid var(--glass-line)}
.call-strip>svg{color:var(--accent-ink)}
.call-strip .label{flex:1;min-width:0;text-align:start;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call-strip .icon{width:36px;height:36px}
.call-page{min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(8px,4vh,40px);touch-action:pan-x}
.call-page .avatar{width:128px;height:128px;margin:24px 0 12px}
.call-page h2{margin:4px 0;font-size:var(--fs-xl)}
.call-controls{display:flex;justify-content:center;gap:clamp(16px,6vw,32px);margin-top:auto;padding:24px 0 max(16px,env(safe-area-inset-bottom))}
.call-controls button{display:grid;justify-items:center;gap:8px;font-size:var(--fs-xs)}
.circle{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--fill);box-shadow:var(--raise)}
.circle.red{background:linear-gradient(180deg,#f0605f,var(--danger-fill));color:#fff}
.circle.red svg{transform:rotate(135deg)}
.circle.green{background:linear-gradient(180deg,#5ff2c4,var(--accent));color:var(--on-accent)}
.wave{display:flex;align-items:center;gap:6px;height:36px;margin:16px}
.wave i{width:6px;height:16px;border-radius:var(--r-pill);background:var(--text);animation:wave .7s ease-in-out alternate infinite}
.wave i:nth-child(2){height:30px;animation-delay:.2s}
.wave i:nth-child(3){height:22px;animation-delay:.4s;background:var(--accent)}
.wave i:nth-child(4){height:12px;animation-delay:.1s}
@keyframes wave{to{transform:scaleY(.4)}}


/* Unified search */
#app.search-mode nav{display:none}
#app.search-mode #view-scroll{padding:var(--top-h,60px) 0 max(22px,env(safe-area-inset-bottom));scrollbar-width:none}
.search-surface{animation:enter .18s var(--ease) both}
.search-tabs{position:sticky;top:0;z-index:3;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 14px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.search-tabs::-webkit-scrollbar{display:none}
.search-tabs button{flex-shrink:0;min-height:34px;padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.search-tabs button[aria-selected="true"]{border-color:transparent;background:var(--primary);color:var(--on-primary);font-weight:600}
.search-section{margin-bottom:12px}
.search-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.search-section-head h2{margin:0;color:var(--muted);font-size:var(--fs-xs);font-weight:600}
.search-count{color:var(--muted);font-size:var(--fs-xs);direction:ltr;unicode-bidi:isolate}
.search-hit-row{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;text-align:start;transition:background .15s}
.search-hit-row:hover,.search-hit-row:focus-visible{background:var(--hover)}
.search-hit-row+.search-hit-row{border-top:1px solid var(--line)}
.search-hit-icon{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--muted)}
.search-hit-icon svg{width:20px;height:20px}
.search-hit-body{flex:1;min-width:0;display:grid;gap:2px}
.search-hit-title{font-size:var(--fs-sm);font-weight:600;overflow-wrap:anywhere}
.search-hit-sub{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--muted);font-size:var(--fs-xs);line-height:1.6;overflow-wrap:anywhere;white-space:pre-line}
.search-hit-meta{flex:0 0 auto;max-width:25%;color:var(--muted);font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-hit-row mark{padding-inline:1px;border-radius:4px;background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}
.search-more{width:100%;min-height:40px;color:var(--text);font-size:var(--fs-sm);font-weight:600}
.search-more:hover{background:var(--hover)}
.search-tip{display:flex;align-items:center;gap:10px;margin:16px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);color:var(--muted);font-size:var(--fs-xs)}
.search-tip svg{width:18px;height:18px}
.search-empty{padding:48px 18px;text-align:center;color:var(--muted)}
.search-empty svg{width:32px;height:32px;margin-bottom:12px;opacity:.7}
.search-empty h2{margin:0 0 6px;color:var(--text);font-size:var(--fs-md)}
.search-empty p{max-width:360px;margin:0 auto;font-size:var(--fs-xs);line-height:1.8}

#toast{pointer-events:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);z-index:100;display:none;width:max-content;max-width:min(90vw,420px);padding:10px 18px;border-radius:var(--r-pill);border:1px solid var(--glass-line);background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--text);box-shadow:var(--float-shadow);font-size:var(--fs-sm);font-weight:600;text-align:center;transform:translateX(-50%)}
#toast.show{display:block;animation:pop-in .18s var(--ease)}

.desktop-rail,.desktop-list{display:none}
