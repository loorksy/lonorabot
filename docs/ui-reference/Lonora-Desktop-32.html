.sheet-top>.icon.sheet-expand{inset-inline-end:56px}
@media(min-width:900px){
 dialog.expandable.expanded{width:min(1240px,calc(100vw - 64px));max-width:none;height:calc(100dvh - 64px)}
 .sheet-top:has(.sheet-expand){gap:8px}
}

/* ---- the permissions menu forms out of the composer (ah_morph): a flat fill reshaped per frame, glass once settled */
:root{--mp-solid:rgba(21,22,27,.95)}
body.light{--mp-solid:rgba(255,255,255,.96)}
body.hc{--mp-solid:var(--glass-card)}
.pop.morph{z-index:21;padding:0;min-width:0;max-width:none;max-height:none;overflow:visible;border:0;border-radius:0;background:none;box-shadow:none;opacity:1;transform:none;transition:none;pointer-events:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.pop.morph .mp-glass{position:absolute;inset:0;background:var(--mp-solid);transition:background .14s}
.pop.morph.settled .mp-glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}   /* same near-opaque fill: text behind never bleeds through the menu */
.pop.morph .mp-line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pop.morph .mp-line path{fill:none;stroke:var(--glass-line);stroke-width:1;vector-effect:non-scaling-stroke}
.pop.morph .mp-in{position:absolute;overflow:auto;overscroll-behavior:contain;padding:8px;pointer-events:auto}
.pop.morph .mp-in>:not(.mp-pages),.pop.morph .p1>*{opacity:0;transform:translateY(6px) scale(.985);transition:opacity .14s var(--ease),transform .24s var(--spring)}
.pop.morph.in .mp-in>:not(.mp-pages),.pop.morph.in .p1>*{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 18ms)}
/* pages inside the menu: the model list slides in from the inline end over the permissions, which drift back and dim */
.pop.morph .mp-in:has(.mp-pages){padding:0;overflow:hidden;border-radius:24px 24px 0 0}
.mp-pages{position:relative;height:100%}
.mp-page{padding:8px;transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .34s cubic-bezier(.32,.72,0,1)}
.mp-page.p1{position:relative}
:root{--mp-page:rgb(21,22,27);--mp-edge:14px 0 28px -14px rgba(0,0,0,.5)}
body.light{--mp-page:#fff;--mp-edge:14px 0 28px -14px rgba(11,12,16,.22)}
body.hc{--mp-page:var(--glass-card)}
.mp-page.p2{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;background:var(--mp-page);transform:translateX(-100%);touch-action:pan-y;box-shadow:none;transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .34s cubic-bezier(.32,.72,0,1),box-shadow .34s}
.mp-pages:is([data-page="2"],.swiping) .p2{box-shadow:var(--mp-edge)}
.mp-pages[data-page="2"] .p1{transform:translateX(30%);opacity:.35}
.mp-pages[data-page="2"] .p2{transform:none}
[dir=ltr] .mp-page.p2{transform:translateX(100%)}
[dir=ltr] .mp-pages:is([data-page="2"],.swiping) .p2{box-shadow:calc(-1 * 14px) 0 28px -14px rgba(0,0,0,.4)}
[dir=ltr] .mp-pages[data-page="2"] .p1{transform:translateX(-30%)}
[dir=ltr] .mp-pages[data-page="2"] .p2{transform:none}
.mp-head{display:flex;align-items:center;gap:4px;padding:0 2px 6px}
.mp-head strong{color:var(--muted);font-size:var(--fs-xs);font-weight:600}
.mp-back{width:36px;height:36px}
.mp-back svg{width:18px;height:18px}
.pop-row .mp-grow{flex:1;text-align:start}
@media (prefers-reduced-motion:reduce){.mp-page{transition:opacity .12s}}
.pop.morph.fade{animation:morph-fade .14s var(--ease) both}
.pop.morph.leaving{opacity:0;transition:opacity .12s}
@keyframes morph-fade{from{opacity:0}}
.mp-scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.32);opacity:0;transition:opacity .2s var(--ease)}
body.light .mp-scrim{background:rgba(11,12,16,.14)}
.mp-scrim.on{opacity:1}
.composer-card{transition:border-radius .22s var(--ease)}
.composer-card.mp-open{border-top-left-radius:14px;border-top-right-radius:14px}
.composer .mode-chip[aria-expanded=true]{background:var(--lens)}

/* ---- reply suggestion (ai_suggest): ghost words where the placeholder sits, a ‹ chip to take them */
.ta-suggest{position:absolute;inset:0 0 auto 0;z-index:2;display:flex;align-items:center;gap:8px;min-height:28px;padding:2px 8px;pointer-events:none;color:var(--muted);font-size:var(--fs-md);line-height:24px;animation:sg-in .42s var(--ease) both}
.ta-suggest[hidden]{display:none}
.sg-text{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sg-take{pointer-events:auto;flex:none;display:grid;place-items:center;width:36px;height:26px;margin-block:-1px;border-radius:13px;border:1px solid var(--glass-line);background:var(--fill);color:var(--text);transition:background .15s,transform .15s var(--spring)}
.sg-take:hover{background:var(--fill-2)}
.sg-take:active{transform:scale(.92)}
.sg-take svg{width:15px;height:15px}
.composer.has-suggest:not(.listening) textarea::placeholder{color:transparent}
.composer:is(.has-text,.is-replying,.listening,.recording) .ta-suggest{display:none}
@keyframes sg-in{from{opacity:0;filter:blur(4px)}}
@media (prefers-reduced-motion:reduce){.ta-suggest{animation:none}}

/* ---- the call folded into its chat's header (h_views callPill) */
.chat-head .presence.oncall{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.chat-head .presence.oncall.muted{color:var(--muted)}
.call-pill{display:flex;align-items:center;gap:4px;height:40px;padding:4px;flex:none;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--fill));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent);transition:background .25s,box-shadow .25s}
.call-pill.enter{animation:cp-in .5s cubic-bezier(.2,.9,.25,1.12) both}
@keyframes cp-in{from{clip-path:inset(0 calc(100% - 40px) 0 0 round 20px)}to{clip-path:inset(0 0 0 0 round 20px)}}
.call-pill.enter>*{animation:cp-fade .34s .12s var(--ease) both}
.call-pill.enter>.cp-end{animation:none}
@keyframes cp-fade{from{opacity:0;transform:scale(.7)}}
.cp-wave{display:grid;place-items:center;width:44px;height:32px;border-radius:var(--r-pill)}
.cp-bars{display:flex;align-items:center;gap:3px;height:20px}
.cp-bars i{width:3px;height:6px;border-radius:2px;background:var(--accent-ink);animation:cp-bar 1.05s ease-in-out infinite}
.cp-bars i:nth-child(2){animation-duration:.86s;animation-delay:-.32s}
.cp-bars i:nth-child(3){animation-duration:1.2s;animation-delay:-.6s}
.cp-bars i:nth-child(4){animation-duration:.94s;animation-delay:-.15s}
.cp-bars i:nth-child(5){animation-duration:1.12s;animation-delay:-.45s}
@keyframes cp-bar{0%,100%{height:5px}30%{height:18px}55%{height:9px}75%{height:15px}}
.cp-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--text);transition:background .2s,color .2s,transform .15s var(--spring)}
.cp-btn:active{transform:scale(.9)}
.cp-btn svg{width:17px;height:17px}
.cp-end{background:linear-gradient(180deg,#f0605f,var(--danger-fill));color:#fff}
.cp-end svg{transform:rotate(135deg)}
.call-pill.muted{background:var(--fill);box-shadow:inset 0 0 0 1px var(--glass-line)}
.call-pill.muted .cp-bars i{animation:none;height:4px;background:var(--faint);transition:height .2s}
.call-pill.muted .cp-mute{background:color-mix(in srgb,var(--danger-fill) 18%,var(--fill));color:var(--red)}
.chat-head .call-back{animation:cp-back .42s cubic-bezier(.2,.9,.25,1.3) both}
@keyframes cp-back{from{transform:scale(.6) rotate(-35deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.call-pill.enter,.call-pill.enter>*,.chat-head .call-back{animation:none}.cp-bars i{animation:none;height:10px}}

<script>
"use strict";
/* ==========================================================================
   Lonora 14 · UI reference for the React + TypeScript app
   مرجع واجهة Lonora لمشروع React وTypeScript: القيم، أنواع البيانات، المكوّنات، قواعد التفاعل واللمس.
   --------------------------------------------------------------------------
   DESIGN TOKENS — see :root and body.light in <style>. One set for every breakpoint (brand guidelines).
     Brand     Charcoal --bg #0B0C10 · Surface --surface #15161B · Border --line #23252C · Muted --muted #8B919E
               Ivory --text / --primary #F7F5EF (primary actions) · Accent --accent #22E3A8 (accent only)
     Accent    only for: logo bar, unread badges, read ticks, typing, active status, switch on, story ring
     Bubbles   --bubble-in = Surface · --bubble-out #23262E (neutral, no green)
     Glass     --glass / --glass-bar / --glass-card / --glass-pop + --blur (blur 20px, saturate 160%)
     Depth     --hi (top highlight) · --raise (highlight + drop) · --float-shadow (floating bars)
     Radius    --r-sm 10 · --r-md 16 · --r-lg 24 · --r-pill · --r-tail 6 · floating bar 33 · composer 26
     Type      --fs-xs 12 · --fs-sm 14 · --fs-md 16 · --fs-lg 20 · --fs-xl 28 · weights 400/600/700
   Light theme: Ivory background, white surfaces, Charcoal primary, accent ink #087A57.

   DATA MODEL (TypeScript)
     type AgentId = string; type ThreadKey = AgentId | `group:${string}`;
     type PermissionLevel = "analysis" | "supervised" | "autonomous";
     interface Message {
       id: string;
       sender: "user" | "agent";
       agent?: AgentId;                 // author of agent messages; the thread agent for calls
       text: string;                    // plain text; for cards/files/calls a searchable summary
       time: string;                    // "HH:mm", Latin digits
       status?: "sent" | "read";        // user messages: one tick, then two accent ticks
       kind?: "card" | "file" | "call"; // undefined = text
       reply?: { id: string; sender: "user" | "agent"; agent?: AgentId | null; text: string }; // snapshot of the quote
       reactions?: Partial<Record<"user" | AgentId, string>>;  // one emoji per reactor
       card?: ApprovalCard | QuestionCard | TaskCard;
       file?: { id: string; name: string; size: number };
       call?: { dir: "in" | "out"; dur?: string; missed?: boolean };
     }
     interface ApprovalCard { type: "approval"; kind: "mail" | "trade"; title: string; status: string;
       recipient?: string; action?: "modify" | "close"; payload?: { sl?: number; tp?: number };
       agent?: AgentId; account?: string; expires?: number }
     interface QuestionCard { type: "question"; question: string; options: string[]; answer: string }
     interface TaskCard { type: "task"; task: string; title: string }
     State extras: unread: Record<ThreadKey, number>; lastAt: Record<ThreadKey, number> (list order);
     chatDrafts: Record<ThreadKey, string>; storage key "lonora-complete-v4" (migrates v3).

   COMPONENT MAP (class → suggested component)
     .topbar ........................ <GlassTopBar> absolute; content scrolls under it (--top-h). On the main tabs it is
                                      clear at rest and its glass (::before, opacity = --edge 0..1) fades in once content
                                      slides under it (scroll edge). Detail pages keep it solid.
     .topbar.bare + .float-actions .. <ScrollEdge> Updates · Tasks · Settings on phones: no title bar; actions float as glass
                                      circles; a soft blurred fade appears at the top edge when scrolled.
     main > .large-title ............ <LargeTitle> section name inside the page; rides with it in the pager and dissolves
                                      on scroll: opacity 1→0 by ~0.8×height, parallax 0.45, scale −8%, blur up to 4px.
     .pager-ghost / .pager-shade .... <TabPager> see MOTION below
     nav + .nav-lens ................ <FloatingTabBar> Telegram style: glass pill, sliding lens, badges; .compact when folded
     .desktop-rail .................. <Rail> same four sections; .rail-brand = app icon
     #chat-rows > .list-filters ..... <ListFilters> hidden above the list; revealed by pulling down (WhatsApp)
     .thread ........................ <ThreadRow> avatar, name, time, ticks, preview, unread count; data-key = thread key.
                                      Marks at the end of line 2: muted (bellOff), pinned (pin), count (grey when muted)
                                      or .count.dot for "marked unread".
     .thread.picked / .sel-bar ...... <ChatSelection> long-press 430ms (touch) or right-click starts it (+ a history entry so
                                      Back ends it); taps toggle; the header becomes a toolbar: ✕ · count | pin · mute ·
                                      archive · delete · ⋮ (select all, read/unread, favourites, group from the selected
                                      agents → new-group prefilled, clear messages). Picked row: accent 13% tint, avatar 92%,
                                      check badge springs in. Pins: three at most, on top in pin order. Delete clears an
                                      agent's messages (the agent stays) and removes a group, after a confirm sheet.
     .archive-row / archived route .. <ArchivedRow> on top of «الكل» with the count (accent when unread); the archived page
                                      lists them; selecting there offers «إلغاء الأرشفة». Archive shows an undo toast.
     state ........................... S.pinned[] · S.muted{} · S.archived{} · S.fav{} · S.unreadMark{} (keyed by thread key)
   AI CHAT (x_ai) — every item switchable in «تجربة المحادثة» (S.prefs: stream, steps, stepsOpen, markdown,
   enterSend, assist, haptics, genui, genuiWhy)
     streaming ...................... answer revealed two tokens per 34–68ms with a caret; composer send → ■ stop (.is-streaming);
                                      a stopped answer keeps its text + «أوقفتَ الرد». Typing dots hide while streaming.
     .steps ......................... <AgentSteps> live (spinner on the current step, ~620ms each) before the text, then folds
                                      to «N خطوات · Xث» (check); tap toggles; message.stepsOpen overrides the default.
     .md ............................ <Markdown> escaped first: headings, lists, quotes, tables (.md-table), code (.code with
                                      copy, LTR mono), inline code, bold, links (new tab, noopener), @mentions.
     (no action row) ................ removed in v19 by request: no copy/regenerate/👍/👎 under answers; copy stays in the
                                      long-press menu. Own text messages: «تعديل وإعادة الإرسال» → edit bar, «مُعدّلة».
     .att-row ....................... <ComposerAttachments> pick (multiple), paste images, drop files on the chat (.drop-zone);
                                      ≤6 items, ≤8MB; the text becomes the first picture's caption.
     .jump / .date .................. ↓ button when >260px from the bottom, with the count of answers that arrived meanwhile;
                                      day pills (اليوم · أمس · weekday · date) stay in the flow between messages (not sticky).
     .float-date .................... <FloatingDay> WhatsApp: only while the user scrolls (wheel/touch/keys, never on programmatic
                                      scrolls) the day of the topmost message floats 8px under the header, then fades 1.3s after.
                                      Messages without `at` (older saves, calls, cards) get one from fillAt(): walk back from the
                                      next known time and put "HH:MM" on the latest day that keeps the order.
   GENERATIVE UI (aa_genui engine · ab_agentui decisions) — the agent answers with a working interface when it is
   clearer than text, in the spirit of OpenUI / "intelligent UI".
     message ........................ {kind:"ui", text: lead, ui:{v, kind, title, sub, icon, why, state, calc, root[], fallback,
                                      values, sent?, view?, fx?, whyOpen?, asText?, cut?}}. The spec is data the model emits
                                      (JSON tool output or a streamed DSL); the app renders it with its own components and
                                      never accepts HTML. Validate each node with Zod (discriminated union on `type`).
     decision ....................... system prompt: text by default (explain, opinion, short fact, a requested table/code, «اكتب/
                                      اشرح/لخّص»); an interface only when the user will act: try numbers → calculator; several
                                      fields → short form; day+time → picker; options → choice cards; a plan → checklist;
                                      a series → chart + period switch; practice → quiz; focus → timer. Always `why` (shown
                                      under «لماذا هذه الواجهة؟») and a markdown `fallback` (used when genui is off, in
                                      notifications/copy, and «عرض كنص» in the message menu). Intent beats topic.

   TOUCH AND INTERACTION RULES
     Tab bar: tap, or press and drag the lens across tabs and release (haptic tick per tab).
       Folds to an icon-only pill while scrolling down; unfolds on scroll up or touch.
     Main tabs (WhatsApp pager): the page follows the finger 1:1 with the neighbouring tab beside it
       (RTL: finger right → next tab, entering from the left). Lock after 10px when |dx| > 1.3·|dy|; vertical wins otherwise.
       Release commits past 50% (projected 160ms ahead) or on a fling > 0.35px/ms in the same direction; else springs back.
       Rubber band at the first/last tab. A settling page can be caught by the finger. Tab taps and lens drags slide the
       same way; tapping the current tab scrolls back to its resting top. Haptic tick where release starts to commit.
     List filters: hidden on open; pull down to reveal; they snap open or closed; stay visible while a filter is on.
     Sheets (phones): follow the finger 1:1 from the handle row / title, or from the content when it is at its top
       (touch-action: pan-x pan-down there, pan-x pan-y once scrolled). Release past 30% of the height (max 240px)
       or a downward flick > 0.45px/ms closes on a spring from the finger's speed; else springs back. Backdrop opacity
       follows the travel (::backdrop inherits --bd). Open/close use springs too; a moving sheet can be caught.
       Only the handle and ✕ stay pinned (glass once scrolled); the sheet title scrolls away and fades.
     Page names never stay pinned: main tabs and inner pages put the title inside the page (it dissolves on scroll);
       inner pages float a glass back button; the chat list folds "Lonora" away and the search field takes its place.
       The conversation header (chat) and the call screen keep their bars.
     Call screen: pull down to fold into the strip.
     Voice messages: the same mic — one tap = dictation (speech → text into the field, placeholder "أستمع إليك…",
       tap again to stop; survives re-renders); long press 350ms = record (haptic). A one-time tip above the mic says so.
       Holding: the composer becomes a
       recording bar (blinking dot, timer, live waveform, "slide to cancel"); the mic becomes a 68px knob under the
       finger with a ring that breathes with the input level. Slide toward the text side ≥110px = cancel, up ≥70px =
       lock (hands-free: delete · pause/resume · send), release = send (<0.7s = hint, not sent). Max 2:00.
       "+ › رسالة صوتية" starts locked; Esc cancels; Enter sends when locked. A re-render keeps the session.
       Audio: MediaRecorder (opus 32kbps) + AnalyserNode levels; ≤360KB kept as a data URL, larger as a blob URL;
       no microphone → silent recording with a voice-like envelope. Bubble: play/pause, waveform = progress
       (tap/drag to seek, arrows ±2s), elapsed/total, speed 1×/1.5×/2×, one note plays at a time.
     Reply: long-press · right-click · hover chevron → menu; swipe any bubble ≥ 56px (max 72): the agent's toward the middle
       (= inline end, left in RTL); your own both ways — toward the middle or toward the inline end. The ↩ icon waits under
       the bubble on the side it leaves; a haptic tick at the threshold.
       Esc or ✕ cancels. In a group, replying to an agent routes the answer to that agent.
     React: six quick emojis; one per person; the same emoji again removes it. Agents can react too.
     Composer: mic = dictation (Web Speech API where available); voice = call the agent; turns into send with text.
     Permission: chip at the bottom of the composer; amber with a warning icon when autonomous; never changed by text.

   MOTION (TabPager)
     Settle: spring from the finger's velocity, never overshooting the resting page —
       swipe k 380 ζ .88 · tap k 320 ζ .88 · snap back k 460 ζ .9  (≈ 300–340ms, lands with no visible stop).
     Depth while travelling, by distance d = |offset| / width: scale 1 − .035d, corner radius 26d px,
       black shade .34d² over the whole page (title bar included), pages ride over a darker stage (--stage).
     Lens: interpolates between the two tabs by progress p; widens by sin(πp)·22% plus a little with speed;
       tab colour = mix(text, muted, --on) so the two labels cross-fade; weight switches at p = .5.
     Hand-off: the incoming page is rendered with the same state and scroll it will have after navigation,
       so the real route change at the end is pixel-identical. prefers-reduced-motion: tabs switch instantly.

 .replace(/[\u064b-\u065f\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي");}

function scoreSearch(title,detail,term){const t=normalizeSearch(title);if(t===term)return 6;
 if(t.startsWith(term))return 5;if(t.includes(term))return 4;
 const d=normalizeSearch(detail);return d.startsWith(term)?3:1;}
function highlightSearch(value){const str=String(value??""),q=search.trim();if(!q)return E(str);
 const lower=str.toLocaleLowerCase(),needle=q.toLocaleLowerCase();
 const index=lower.indexOf(needle);if(index<0)return E(str);
 return E(str.slice(0,index))+"<mark>"+E(str.slice(index,index+q.length))+"</mark>"+E(str.slice(index+q.length));}
function previewSearch(value,size=145){const str=String(value??"").replace(/\s+/g," ").trim();
 if(str.length<=size)return str;
 const index=normalizeSearch(str).indexOf(normalizeSearch(search.trim()));
 const begin=index>55?Math.max(0,index-45):0;
 return (begin?"…":"")+str.slice(begin,begin+size)+(begin+size<str.length?"…":"");}

 const isGroup=storedKey.startsWith("group:");const tid=isGroup?storedKey.slice(6):storedKey;
 const entity=isGroup?S.groups.find(g=>g.id===tid):S.agents.find(a=>a.id===tid);

 // Activity timestamps are recorded when a thread is opened or receives a message.
 const keys=Object.entries(S.threadActivity||{}).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
 keys.push(...Object.keys(S.messages||{}).reverse());

  if(isSearchMatch(t.name+" "+description,q))r.chats.push({...t,title:t.name,description,score:scoreSearch(t.name,description,q)});
 }
 for(const [storedKey,arr] of Object.entries(S.messages||{})){
  const thread=threadFromStorage(storedKey);if(!thread||!Array.isArray(arr))continue;
  for(let i=0;i<arr.length;i++){
   const m=arr[i];if(!isSearchMatch(m.text,q))continue;
   r.messages.push({kind:thread.kind,thread:thread.thread,threadName:thread.name,index:i,message:m,
    score:scoreSearch("",m.text,q),order:Number(S.threadActivity?.[storedKey]||0)});
  }
 }
 for(const t of S.tasks||[]){const info=[t.title,t.description,t.criteria].join(" ");if(isSearchMatch(info,q))r.tasks.push({...t,score:scoreSearch(t.title,info,q)});}
 for(const f of S.files||[]){const info=[f.name,f.content].join(" ");if(isSearchMatch(info,q))r.files.push({...f,score:scoreSearch(f.name,info,q)});}
 for(const n of S.knowledge||[]){const info=[n.title,n.content,n.type].join(" ");if(isSearchMatch(info,q))r.other.push({...n,type:"knowledge",score:scoreSearch(n.title,info,q)});}
 for(const k of S.skills||[]){const info=[k.name,k.description,k.instructions,k.tool].join(" ");if(isSearchMatch(info,q))r.other.push({...k,title:k.name,type:"skill",score:scoreSearch(k.name,info,q)});}
 for(const t of searchCategories.slice(1).map(x=>x[0]))r[t].sort((a,b)=>b.score-a.score||(b.order||0)-(a.order||0));

function browseSearchData(){

  description:t.kind==="group"?t.entity.purpose:t.entity.role||"",score:0 }));

 for(const [storedKey,arr] of Object.entries(S.messages||{})){
  const thread=threadFromStorage(storedKey);if(!thread||!Array.isArray(arr))continue;

 }

 return {chats,messages,tasks:[...(S.tasks||[])].sort((a,b)=>(a.status==="active"?-1:0)-(b.status==="active"?-1:0)),

/* ---- Voice messages (WhatsApp / Telegram behaviour, Lonora motion).

   Holding: the composer turns into a recording bar (pulsing dot, timer, live waveform, "slide to cancel");
   the mic becomes a knob under the finger that pulses with the voice level. Slide toward the text side
   (right in RTL) past 110px to cancel, slide up onto the lock (70px) to keep recording hands-free, release to send.
   Locked: delete · timer + waveform · pause/resume · send. "+ › رسالة صوتية" starts a locked recording
   (the keyboard / mouse path); Esc cancels. Real audio through MediaRecorder when the page may use the
   microphone; otherwise a silent recording with a voice-like envelope, so the interface still works.
   Message: {kind:"voice", voice:{dur, peaks[44] 0..1, src?}}. Bubble: play/pause, a waveform you can tap or
   drag to seek, elapsed/total time, speed 1× · 1.5× · 2×; one note plays at a time. */

 return `<div class="vnote" data-vmid="${E(m.id)}"><button type="button" class="vplay" ${attrs("voice-play",{mid:m.id})} aria-label="تشغيل الرسالة الصوتية (${voiceFmt(dur)})">${I("play")}</button><div class="vwave" role="slider" tabindex="0" aria-label="موضع التشغيل" aria-valuemin="0" aria-valuemax="${Math.round(dur)}" aria-valuenow="0" aria-valuetext="0:00 من ${voiceFmt(dur)}"><span class="vbars">${bars}</span><span class="vbars on" aria-hidden="true">${bars}</span></div><div class="vside"><span class="vtime ltr">${voiceFmt(dur)}</span><button type="button" class="vspeed" dir="ltr" ${attrs("voice-speed",{mid:m.id})} aria-label="سرعة التشغيل">1×</button></div></div>`;

function selAction(act){
 chatState();
 const ks=[...(sel||[])],n=ks.length;if(!n)return;
 const done=(msg)=>{save();selClear();render({scroll:"remember"});if(msg)toast(msg)};

  const add=ks.filter(k=>!S.pinned.includes(k));
  if(S.pinned.length+add.length>3)return toast("يمكنك تثبيت 3 محادثات فقط");
  S.pinned=[...add,...S.pinned];return done(n>1?"ثُبّتت المحادثات في الأعلى":"ثُبّتت المحادثة في الأعلى");
 }
 if(act==="mute"){const off=ks.every(k=>S.muted[k]);ks.forEach(k=>{if(off)delete S.muted[k];else S.muted[k]=true});return done(off?"أُعيدت الإشعارات":"كُتمت الإشعارات")}
 if(act==="archive"){

  ks.forEach(k=>{if(un)delete S.archived[k];else{S.archived[k]=true;S.pinned=S.pinned.filter(x=>x!==k)}});
  save();selClear();render({scroll:"remember"});
  if(un)return toast(n>1?"أُعيدت المحادثات إلى القائمة":"أُعيدت المحادثة إلى القائمة");
  return toastUndo(`أُرشفت ${chatsWord(n)}`,()=>{ks.forEach(k=>delete S.archived[k]);save();render({scroll:"remember"})});
 }
 if(act==="read"){
  const unread=ks.some(k=>(S.unread?.[k]||0)>0||S.unreadMark[k]);
  ks.forEach(k=>{if(unread){if(S.unread)delete S.unread[k];delete S.unreadMark[k]}else S.unreadMark[k]=true});
  return done();
 }
 if(act==="fav"){const off=ks.every(k=>S.fav[k]);ks.forEach(k=>{if(off)delete S.fav[k];else S.fav[k]=true});return done(off?"أُزيلت من المفضلة":"أُضيفت إلى المفضلة")}
 if(act==="list"){if(listsOf().length)return listAddSheet(ks);listDraft={name:"",keys:new Set(ks),then:"select"};return listNameSheet()}
 if(act==="group"){
  const members=ks.filter(k=>!k.startsWith("group:"));

  sel=null;if(history.state?.sel)history.replaceState({lonora:{...U}},"","#"+U.route);return handle("go",{route:"new-group"});
 }
 if(act==="clear"||act==="delete"){
  const groups=ks.filter(k=>k.startsWith("group:")).length,agents=n-groups;
  const gw=groups===1?"المجموعة المحددة":"المجموعات المحددة";
  const what=act==="clear"?`تُحذف رسائل ${chatsWord(n)} من هذا الجهاز وتبقى المحادثات في القائمة.`
   :!agents?`تُحذف ${gw} ورسائلها من هذا الجهاز.`
   :`تُحذف رسائل ${chatsWord(agents)} من هذا الجهاز${groups?`، وتُحذف ${gw}`:""}. يبقى الوكلاء في قائمة الوكلاء.`;
  return sheet(act==="clear"?"مسح الرسائل؟":"حذف المحادثات؟",`<p>${what}</p><div class="actions">${B("إلغاء","close",{},"outline")}${B(act==="clear"?"مسح":"حذف","sel-confirm",{act},"danger")}</div>`);
 }
}

 tpress={row,x:e.clientX,y:e.clientY,id:e.pointerId,timer:setTimeout(()=>{const p=tpress;tpress=null;p?.row.classList.remove("pressing");if(p)pressSelect(p.row.dataset.key,true)},430)};
},{passive:true});

/* ---- Interface states: notices, network, failures, errors, loading — and a hidden lab to preview them.
   Notices (toast) have a type (success · error · warn · info) with an icon and may carry one action; actionable
   ones sit at the bottom like a snackbar. Offline is real (navigator.onLine) or simulated: a strip under the
   header says so, outgoing messages wait with a clock and go out by themselves when the network returns.
   A message that fails shows a red ! beside it (retry · delete). An agent that cannot answer posts an error
   card with the fix (raise the limit, wait, retry, change the model). Forms show errors under the field.
   Rendering is guarded: a page that throws shows a calm error state instead of a blank screen; unknown
   routes get a «not found» page. Loading: skeletons on slow networks, older messages page in at the top,
   uploads show progress with cancel. The lab (7 taps on the version in «حول») triggers every state. */
const LAB=()=>S.lab??={};
const isOffline=()=>!!S.lab?.offline||!navigator.onLine;
let netPhase=isOffline()?"off":"on",netTimer=0,lastCrashToast=0;

/* ---- notices */
function toast(t,o={}){
 if(typeof o==="string")o={type:o};
 const el=$("#toast");if(!el)return;
 const ic={success:"check",error:"alert",warn:"alert",info:"info"}[o.type];
 el.className="";
 el.innerHTML=`${ic?`<span class="t-ic">${I(ic)}</span>`:""}<span class="t-msg">${E(t)}</span>${o.action?`<button type="button" class="t-act">${E(o.action.label)}</button>`:""}`;
 if(o.type)el.classList.add("t-"+o.type);
 el.setAttribute("role",o.type==="error"?"alert":"status");
 const hide=()=>el.classList.remove("show");
 if(o.action){el.classList.add("has-action");el.querySelector(".t-act").onclick=()=>{hide();o.action.fn()}}
 void el.offsetWidth;el.classList.add("show");
 clearTimeout(toast.timer);toast.timer=setTimeout(hide,o.duration||(o.action?5200:3300));
}
function toastUndo(text,undo){toast(text,{type:"success",action:{label:"تراجع",fn:undo}})}

/* ---- network */
function queuedCount(){let n=0;for(const arr of Object.values(S.messages||{}))if(Array.isArray(arr))n+=arr.filter(m=>m.status==="queued").length;return n}
function netStripMarkup(){
 if(netPhase==="on")return "";
 const q=queuedCount();
 if(netPhase==="off")return `<div class="net-strip off" role="status">${I("wifiOff")}<span>لا يوجد اتصال بالإنترنت${q?` · ${arCount(q,["رسالة واحدة تنتظر","رسالتان تنتظران","رسائل تنتظر","رسالة تنتظر"],"")}`:""}</span></div>`;
 if(netPhase==="connecting")return `<div class="net-strip wait" role="status"><span class="spin" aria-hidden="true"></span><span>جارٍ إعادة الاتصال…</span></div>`;
 return `<div class="net-strip back" role="status">${I("check")}<span>عاد الاتصال</span></div>`;
}
function netChanged(){
 clearTimeout(netTimer);
 if(isOffline()){netPhase="off";render({scroll:"remember"});return}
 if(netPhase==="on")return;
 netPhase="connecting";render({scroll:"remember"});
 netTimer=setTimeout(()=>{netPhase="back";flushQueue();render({scroll:"remember"});netTimer=setTimeout(()=>{netPhase="on";render({scroll:"remember"})},1800)},S.lab?.slow?2200:1100);
}
window.addEventListener("online",netChanged);window.addEventListener("offline",netChanged);
function flushQueue(){
 let n=0,delay=0;
 for(const [k,arr] of Object.entries(S.messages||{})){
  if(!Array.isArray(arr))continue;
  arr.filter(m=>m.status==="queued").forEach(m=>{
   n++;m.status="sent";
   if(m.upload)return;
   const later=delay;delay+=350;
   if(m.sender==="user"&&!m.noReply)setTimeout(()=>startReplies(k,m),later);
  });
 }
 if(n){save();toast(`أُرسلت ${arCount(n,["رسالة واحدة","رسالتان","رسائل","رسالة"],"")} كانت تنتظر`,{type:"success"})}
}

/* ---- failed messages */
function sendState(){if(S.lab?.failNext){S.lab.failNext=false;save();return "failed"}return isOffline()?"queued":"sent"}
function retryMessage(k,mid){
 const m=findMsg(k,mid);if(!m)return;
 if(m.upload){m.upload.p=0;m.status="uploading";save();patchMessage(mid);return startUpload(k,mid)}
 m.status=isOffline()?"queued":"sent";save();
 if(m.status==="sent")startReplies(k,m);else{render({scroll:"remember"});toast("ستُرسل الرسالة عند عودة الاتصال",{type:"info"})}
}

}
function dropMessage(mid){const k=key(),arr=S.messages[k]||[],i=arr.findIndex(m=>m.id===mid);if(i>=0){arr.splice(i,1);save();render({scroll:"remember"})}}

/* ---- uploads: progress inside the bubble, cancel, failure after a reload */
function startUpload(k,mid){
 const dur=S.lab?.slow?3600:1400,t0=performance.now();
 const tick=t=>{
  const m=findMsg(k,mid);if(!m?.upload)return;
  const p=Math.min(1,(t-t0)/dur);m.upload.p=p;
  document.querySelectorAll(`.msg[data-mid="${CSS.escape(mid)}"] .up`).forEach(el=>{el.style.setProperty("--p",p.toFixed(3));const n=el.querySelector(".up-n");if(n)n.textContent=Math.round(p*100)+"%"});
  if(p<1)return requestAnimationFrame(tick);
  delete m.upload;m.status=isOffline()?"queued":"sent";save();
  if(U.route==="chat"&&key()===k)patchMessage(mid);
  if(m.status==="sent"&&!m.noReply)startReplies(k,m);
 };
 requestAnimationFrame(tick);
}
function uploadMarkup(m){
 const p=m.upload?.p||0;
 return `<span class="up" style="--p:${p.toFixed(3)}"><span class="up-ring" aria-hidden="true"></span><span class="up-n">${Math.round(p*100)}%</span><button type="button" class="up-x" ${attrs("upload-cancel",{mid:m.id})} aria-label="إلغاء الرفع">${I("close")}</button></span>`;
}
function cancelUpload(mid){dropMessage(mid);toast("أُلغي الرفع",{type:"info"})}
/* uploads cut by a reload come back as failed, ready to retry */
function healUploads(){for(const arr of Object.values(S.messages||{}))if(Array.isArray(arr))arr.forEach(m=>{if(m.upload){m.upload.p=0;m.status="failed"}})}

/* ---- forms: errors under the field */
function validateForm(f){

 let first=null;
 f.querySelectorAll(".field-err").forEach(x=>x.remove());
 f.querySelectorAll("[aria-invalid]").forEach(x=>x.removeAttribute("aria-invalid"));
 f.querySelectorAll("input,select,textarea").forEach(el=>{
  if(!el.willValidate||el.checkValidity())return;
  const v=el.validity,msg=v.valueMissing?(el.type==="checkbox"?"هذا الخيار مطلوب.":"هذا الحقل مطلوب."):v.typeMismatch?(el.type==="email"?"أدخل بريدًا إلكترونيًا صحيحًا.":el.type==="url"?"أدخل رابطًا صحيحًا يبدأ بـ https://":"القيمة غير صحيحة."):v.tooShort?`أدخل ${el.minLength} أحرف على الأقل.`:v.tooLong?`الحد الأقصى ${el.maxLength} حرفًا.`:v.rangeUnderflow?`أقل قيمة مسموحة ${el.min}.`:v.rangeOverflow?`أكبر قيمة مسموحة ${el.max}.`:v.patternMismatch?(el.title||"الصيغة غير صحيحة."):"القيمة غير صحيحة.";
  const host=el.closest(".field,.check,.select-field")||el.parentElement,eid="err-"+id();
  el.setAttribute("aria-invalid","true");el.setAttribute("aria-describedby",eid);
  host.insertAdjacentHTML("beforeend",`<span class="field-err" id="${eid}">${I("alert")}<span>${E(msg)}</span></span>`);
  first??=el;
 });
 if(first){first.focus({preventScroll:true});first.scrollIntoView({block:"center",behavior:reduceMotion.matches?"auto":"smooth"});navigator.vibrate?.([8,40,8]);
  const n=f.querySelectorAll(".field-err").length;toast(n>1?`راجع ${arCount(n,["حقلًا","حقلين","حقول","حقلًا"],"")} قبل الحفظ`:"راجع الحقل المحدد قبل الحفظ",{type:"warn"})}

/* ---- markdown (safe: escaped first) */
const MD_BLOCK=/(^|\n)(```|#{1,3}\s|\s*[-*•]\s+\S|\s*\d+[.)]\s+\S|>\s?|\s*\|.*\|\s*\n\s*\|?\s*:?-{2,})/;
function mdInline(t){
 t=E(t);const codes=[];
 t=t.replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return `\u0001${codes.length-1}\u0001`});
 t=t.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,،)!?؟]|$)/g,"$1<em>$2</em>");
 t=t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 t=t.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,،)])/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer" dir="ltr">$2</a>');
 t=t.replace(mentionRe(),(_,n)=>`<span class="mention" dir="auto">@${n}</span>`);
 return t.replace(/\u0001(\d+)\u0001/g,(_,n)=>`<code dir="ltr">${codes[+n]}</code>`);
}
function md(src){
 const L=String(src).replace(/\r/g,"").split("\n");let out="",i=0;
 const isRow=l=>/^\s*\|.*\|\s*$/.test(l),isSep=l=>/^\s*\|?\s*:?-{2,}/.test(l||"");
 const special=j=>/^(```|#{1,3}\s|\s*[-*•]\s+\S|\s*\d+[.)]\s+\S|>\s?)/.test(L[j])||(isRow(L[j])&&isSep(L[j+1]));
 const cells=l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
 while(i<L.length){
  const l=L[i];
  if(/^```/.test(l)){const lang=l.slice(3).trim(),buf=[];i++;while(i<L.length&&!/^```/.test(L[i]))buf.push(L[i++]);i++;
   out+=`<div class="code"><div class="code-head"><span>${E(lang||"code")}</span><button type="button" class="code-copy" data-do="code-copy" aria-label="نسخ الكود">${I("copy")}<span>نسخ</span></button></div><pre dir="ltr"><code>${E(buf.join("\n"))}</code></pre></div>`;continue}
  if(isRow(l)&&isSep(L[i+1])){const head=cells(l);i+=2;const rows=[];while(i<L.length&&isRow(L[i]))rows.push(cells(L[i++]));
   out+=`<div class="md-table"><table><thead><tr>${head.map(h=>`<th>${mdInline(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue}
  if(/^#{1,3}\s/.test(l)){const n=l.match(/^#+/)[0].length;out+=`<p class="md-h h${n}">${mdInline(l.replace(/^#+\s*/,""))}</p>`;i++;continue}
  if(/^\s*[-*•]\s+\S/.test(l)){const it=[];while(i<L.length&&/^\s*[-*•]\s+\S/.test(L[i]))it.push(L[i++].replace(/^\s*[-*•]\s+/,""));out+=`<ul>${it.map(x=>`<li>${mdInline(x)}</li>`).join("")}</ul>`;continue}
  if(/^\s*\d+[.)]\s+\S/.test(l)){const it=[];while(i<L.length&&/^\s*\d+[.)]\s+\S/.test(L[i]))it.push(L[i++].replace(/^\s*\d+[.)]\s+/,""));out+=`<ol>${it.map(x=>`<li>${mdInline(x)}</li>`).join("")}</ol>`;continue}
  if(/^>\s?/.test(l)){const q=[];while(i<L.length&&/^>\s?/.test(L[i]))q.push(L[i++].replace(/^>\s?/,""));out+=`<blockquote>${q.map(mdInline).join("<br>")}</blockquote>`;continue}
  if(!l.trim()){i++;continue}
  const buf=[];while(i<L.length&&L[i].trim()&&!special(i))buf.push(L[i++]);
  out+=`<p>${buf.map(mdInline).join("<br>")}</p>`;
 }
 return out;
}

function streamAnswer(k,m,done){

 streams.set(m.id,st);m.streaming=true;

  if(!streams.has(m.id))return;

   repaintMsg(st.k,st.mid);st.timer=setTimeout(tick,st.phase==="steps"?620*slow:160);return;
  }

   if(m.kind==="ui"&&m.ui?.root?.length&&prefs().genui&&!m.ui.asText){st.phase="ui";st.ui=0;repaintMsg(st.k,st.mid);st.timer=setTimeout(tick,260*slow);return}

function dayLabel(t){
 const d=new Date(t),today=new Date();today.setHours(0,0,0,0);
 const day=new Date(d);day.setHours(0,0,0,0);const diff=Math.round((today-day)/864e5);
 if(diff<=0)return "اليوم";if(diff===1)return "أمس";
 if(diff<7)return d.toLocaleDateString("ar-u-nu-latn",{weekday:"long"});
 return d.toLocaleDateString("ar-u-nu-latn",{day:"numeric",month:"long",...(d.getFullYear()!==today.getFullYear()?{year:"numeric"}:{})});
}
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
/* Messages saved before timestamps existed (and calls, cards…) only carry "HH:MM". Walk back from the next known
   time and put each one on the latest day that keeps the order — 22:50 before 00:46 lands on the day before. */
function fillAt(list){
 let anchor=Date.now();
 for(let i=list.length-1;i>=0;i--){
  const m=list[i];if(m.at){anchor=Math.min(anchor,m.at);continue}
  const t=/^(\d{1,2}):(\d{2})/.exec(m.time||"");
  if(!t){m.at=anchor;continue}
  const d=new Date(anchor);d.setHours(+t[1],+t[2],0,0);
  if(d.getTime()>anchor)d.setDate(d.getDate()-1);
  m.at=anchor=d.getTime();
 }
}

["wheel","touchmove"].forEach(t=>document.addEventListener(t,e=>{if(e.target.closest?.("#view-scroll"))userScrollAt=Date.now()},{passive:true,capture:true}));
document.addEventListener("pointerdown",e=>{if(e.target.id==="view-scroll")userScrollAt=Date.now()},{passive:true,capture:true});
document.addEventListener("keydown",e=>{if(/^(PageUp|PageDown|ArrowUp|ArrowDown|Home|End)$/.test(e.key)&&!e.target.closest?.("input,textarea,select,[role=radiogroup],.ux-plot,[contenteditable]"))userScrollAt=Date.now()},true);

function syncFloatDate(sc){
 const f=document.querySelector(".float-date");if(!f||!sc)return;
 if(!f.classList.contains("on")&&Date.now()-userScrollAt>900)return;
 const line=sc.getBoundingClientRect().top+(parseFloat(getComputedStyle(sc).paddingTop)||0);
 let label="",clash=false;

/* ---- app lock */
const LOCK=()=>S.lock??={on:false,pin:"",bio:false,after:60};
function lockOpen(mode="unlock",onDone=null){lockState={mode,entry:"",first:"",tries:0,until:0,onDone,msg:mode==="set"?"اختر رمزًا من 4 أرقام":mode==="confirm"?"أعد إدخال الرمز":"أدخل رمز القفل"};lockRender()}
function lockRender(err=false){
 let el=document.getElementById("lock");
 if(!lockState)return el?.remove();
 if(!el){el=document.createElement("div");el.id="lock";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","قفل التطبيق");document.body.appendChild(el)}
 const s=lockState,wait=s.until>Date.now()?Math.ceil((s.until-Date.now())/1000):0,setup=s.mode!=="unlock";
 const key=(d,label=d)=>`<button type="button" class="lk-key" ${attrs("lock-key",{d})} aria-label="${label}" ${wait?"disabled":""}>${d==="del"?I("backspace"):d==="bio"?I("fingerprint"):`<b>${d}</b>`}</button>`;
 el.innerHTML=`<div class="lk">${setup?`<button type="button" class="icon lk-close" ${attrs("lock-cancel")} aria-label="إلغاء">${I("close")}</button>`:""}<span class="lk-logo">${logoMark(44)}</span><p class="lk-msg ${err?"bad":""}" aria-live="assertive">${wait?`محاولات كثيرة. حاول بعد ${wait} ث`:E(s.msg)}</p><div class="lk-dots ${err?"shake":""}" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<s.entry.length?"on":""}"></i>`).join("")}</div>
 <div class="lk-pad">${["1","2","3","4","5","6","7","8","9"].map(d=>key(d)).join("")}${!setup&&LOCK().bio?key("bio","فتح بالبصمة"):"<span></span>"}${key("0")}${key("del","حذف")}</div></div>`;
 if(wait)setTimeout(()=>lockState&&lockRender(),1000);
}
function lockKey(d){
 const s=lockState;if(!s||s.until>Date.now())return;
 if(d==="del"){s.entry=s.entry.slice(0,-1);return lockRender()}
 if(d==="bio"){s.msg="جارٍ التحقق…";lockRender();return setTimeout(()=>{if(lockState){lockState=null;lockRender();toast("فُتح القفل",{type:"success"})}},700)}
 if(s.entry.length>=4)return;
 s.entry+=d;navigator.vibrate?.(4);lockRender();
 if(s.entry.length<4)return;
 setTimeout(()=>{
  const L=LOCK();
  if(s.mode==="set"){s.first=s.entry;s.entry="";s.mode="confirm";s.msg="أعد إدخال الرمز";return lockRender()}
  if(s.mode==="confirm"){if(s.entry===s.first){L.pin=s.entry;L.on=true;save();lockState=null;lockRender();s.onDone?.(true);return toast("فُعّل قفل التطبيق",{type:"success"})}s.mode="set";s.entry="";s.msg="الرمزان غير متطابقين. اختر رمزًا جديدًا";navigator.vibrate?.([10,40,10]);return lockRender(true)}
  if(s.entry===L.pin){lockState=null;return lockRender()}
  s.tries++;s.entry="";navigator.vibrate?.([10,40,10]);
  if(s.tries>=5){s.until=Date.now()+30000;s.tries=0}
  s.msg=`رمز غير صحيح${s.tries?`. بقيت ${5-s.tries} محاولات`:""}`;lockRender(true);
 },120);
}
document.addEventListener("visibilitychange",()=>{const L=S.lock;if(!L?.on)return;if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>=L.after*1000&&!lockState)lockOpen()});
document.addEventListener("keydown",e=>{if(!lockState)return;if(/^[0-9]$/.test(e.key)){e.preventDefault();lockKey(e.key)}else if(e.key==="Backspace"){e.preventDefault();lockKey("del")}});

/* ---- Generative UI: the agent answers with a working interface when that is clearer than text (v19).
   Same idea as OpenUI / "intelligent UI": a reply may carry a small declarative spec that the app renders with
   its own components. The model never sends HTML; every string is escaped and every expression runs in a tiny
   sandboxed evaluator (no eval, no globals, no prototype access).

   Spec    {v:1, kind, title, sub?, icon?, why, state:{…}, calc?:{name:expr}, root:[node…], fallback:"markdown"}
           Stored on the message: {kind:"ui", text:lead, ui:{…spec, values, sent?, view?, fx?, whyOpen?, asText?, cut?}}
   Node    {type, when?:expr, …props}. Text props are templates: "{@Money($amount)} من {$total}".
           Layout  Col · Row · Grid{cols} · Card{title} · Divider
           Text    Title · Text{tone,size} · Markdown · Badge · Note{tone} · List · KeyValue{rows} · Stat{label,value,sub,trend}
                   Progress{value 0..100}
           Inputs  Slider{bind,min,max,step,show} · Number{bind,suffix,hint} · Input{bind,placeholder} · Select · Segmented
                   Chips{multi} · Choice{options:[{value,title,sub,badge,points}]} · Switch · Checklist{items} · Days{count}
                   (an option may carry also:{key:value} to set other state with it)
           Data    Table{columns, rows | each+as+cells, highlight} · Chart{kind:line|bar, series, labels, by, polar, fmt}
           Play    Quiz{questions} · Timer{minutes} · Celebrate{on}
           Action  Button{label, style, action, disabled}
   Expr    $state · local · 12.5 · "text" · [a,b] · + - * / % · < <= > >= == != · && || ! · c ? a : b · a.b · a[i] · @Fn(…)
   Actions {do:"set",key,value} {do:"toggle",key} {do:"reset"} {do:"copy",text} {do:"open",url} {do:"go",route}
           {do:"send",intent,text,data,lock?} → a message from you to the agent (quoting the card); the agent acts on it
           (creates the alert, the tasks, the schedule…) and may answer with another interface. The card locks
           («أُرسل · تعديل») so it is not sent twice. */

const UX_BAD=new Set(["__proto__","prototype","constructor"]);

const UX_FN={

 Floor:x=>Math.floor(+x||0),Ceil:x=>Math.ceil(+x||0),Abs:x=>Math.abs(+x||0),Sqrt:x=>Math.sqrt(Math.max(0,+x||0)),
 Min:(...a)=>Math.min(...a.flat().map(Number)),Max:(...a)=>Math.max(...a.flat().map(Number)),
 Pow:(a,b)=>(+a)**(+b),Clamp:(x,a,b)=>Math.min(Math.max(+x||0,+a),+b),
 Fmt:(x,d=0)=>uxNum(x,d),
 Money:(x,d=0)=>(+x<0?"-":"")+"$"+uxNum(Math.abs(+x),d,0),
 Pct:(x,d=0)=>uxNum(x,d,0)+"%",
 Signed:(x,d=0)=>(+x>0?"+":+x<0?"−":"")+uxNum(Math.abs(+x),d,0),
 If:(c,a,b)=>c?a:b,
 Pick:(k,...p)=>{for(let i=0;i+1<p.length;i+=2)if(p[i]==k)return p[i+1];return p.length%2?p[p.length-1]:""},
 Len:x=>Array.isArray(x)||typeof x==="string"?x.length:x&&typeof x==="object"?Object.keys(x).length:0,
 Count:(x,v=true)=>uxKeys(x).filter(y=>y===v).length,
 Sum:x=>uxKeys(x).reduce((s,v)=>s+(+v||0),0),
 Range:(a,b,s=1)=>{const r=[];s=+s||1;for(let i=+a;s>0?i<+b:i>+b;i+=s){r.push(+i.toFixed(6));if(r.length>200)break}return r},
 Includes:(x,v)=>Array.isArray(x)&&x.map(String).includes(String(v)),
 Join:(x,s="، ")=>uxKeys(x).join(s),

function uxLex(s){
 const T=[];let i=0,m;
 while(i<s.length){
  const c=s[i],rest=s.slice(i);
  if(/\s/.test(c)){i++;continue}

  if((m=/^[A-Za-z_]\w*/.exec(rest))){T.push({k:"i",v:m[0]});i+=m[0].length;continue}
  if((m=/^(&&|\|\||==|!=|<=|>=|[-+*/%<>!?:().,[\]])/.exec(rest))){T.push({k:"o",v:m[0]});i+=m[0].length;continue}

function uxRun(n,env){

  case "l":return env.l&&Object.prototype.hasOwnProperty.call(env.l,n[1])?env.l[n[1]]:undefined;

const uxCache=new Map();
function uxExpr(src,env,dflt=null){

const uxHost=mid=>mid?(uxGallery.get(mid)||curMsg(mid)||null):null;
function uxVals(h){const u=h.ui;if(!u.values)u.values=uxClone(u.state||{});return u.values}
function uxEnv(h){const v={...uxVals(h)};for(const [k,e] of Object.entries(h.ui.calc||{}))v[k]=uxExpr(e,{v,l:null},null);return {v,l:null}}
function uxAt(h,path){const ps=String(path).split(".").map(Number);let n=h.ui.root?.[ps[0]];for(let i=1;i<ps.length&&n;i++)n=n.children?.[ps[i]];return n||null}
let uxSaveT=0;
function uxSave(h){if(uxGallery.has(h.id))return;clearTimeout(uxSaveT);uxSaveT=setTimeout(save,220)}
const uxAgentName=h=>S.agents.find(a=>a.id===h.agent)?.name||"الوكيل";

/* ---------- components ---------- */
const UX_CONTAINER=new Set(["Col","Row","Grid","Card"]),UX_INPUT=new Set(["Slider","Number","Input","Select"]),UX_PICKER=new Set(["Segmented","Chips","Choice","Switch","Checklist","Days"]);
const uxLast=new Map();   // last markup per node, so a refresh only touches what changed
function uxNode(n,c){
 if(!n||typeof n!=="object"||!UX[n.type])return "";
 const html=n.when!=null&&!uxExpr(n.when,c.env,false)?`<div data-ux="${c.path}" data-ux-off hidden></div>`:UX[n.type](n,c);
 uxLast.set(c.mid+"|"+c.path,html);return html;
}
const uxKids=(n,c)=>(n.children||[]).map((k,i)=>uxNode(k,{...c,path:c.path+"."+i})).join("");
const uxBox=(c,cls,inner,extra="")=>`<div class="${cls}" data-ux="${c.path}"${extra}>${inner}</div>`;

const uxLby=(n,c)=>n.label?`aria-labelledby="${uxId(c)}-l"`:"";
const UX={

 Badge:(n,c)=>uxBox(c,"ux-badge"+uxTone(n,c),(n.icon?I(n.icon):"")+`<span>${E(uxTpl(n.text,c.env))}</span>`),
 Note:(n,c)=>{const t=uxTpl(n.tone||"info",c.env);return uxBox(c,"ux-note"+uxTone(n,c),I(n.icon||(t==="warn"?"alert":t==="good"?"check":"info"))+`<span>${mdInline(uxTpl(n.text,c.env))}</span>`,` role="status"`)},
 List:(n,c)=>uxBox(c,"ux-list",(n.items||[]).map(t=>`<div>${I(n.icon||"check")}<span>${mdInline(uxTpl(t,c.env))}</span></div>`).join("")),
 KeyValue:(n,c)=>uxBox(c,"ux-kv",(n.rows||[]).map(([k,v])=>`<div><span>${E(uxTpl(k,c.env))}</span><b>${E(uxTpl(v,c.env))}</b></div>`).join("")),
 Stat:(n,c)=>{const tr=n.trend?uxExpr(n.trend,c.env,""):"";return uxBox(c,"ux-stat"+uxTone(n,c),`<small>${E(uxTpl(n.label,c.env))}</small><b>${E(uxTpl(n.value,c.env))}</b>${n.sub?`<span class="ux-sub ${tr?"tr-"+tr:""}" dir="auto">${tr?I(tr==="down"?"trendDown":"trend"):""}${E(uxTpl(n.sub,c.env))}</span>`:""}`)},
 Progress:(n,c)=>{const v=Math.max(0,Math.min(100,+uxExpr(n.value,c.env,0)||0)),l=uxTpl(n.label||"",c.env);return uxBox(c,"ux-progress"+uxTone(n,c),`${l?`<div class="ux-progress-h"><span>${E(l)}</span><b>${Math.round(v)}%</b></div>`:""}<div class="ux-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(v)}" aria-label="${E(l||"التقدم")}"><i style="width:${v}%"></i></div>`)},
 Slider:(n,c)=>{const min=+n.min||0,max=+n.max||100,v=+(c.env.v[n.bind]??min),pct=max>min?(v-min)/(max-min)*100:0,id=uxId(c),show=uxTpl(n.show||"{$"+n.bind+"}",c.env);
  return uxBox(c,"ux-field ux-slider",`<label for="${id}"><span>${E(uxTpl(n.label,c.env))}</span><output for="${id}" data-ux-out>${E(show)}</output></label><input id="${id}" type="range" min="${min}" max="${max}" step="${+n.step||1}" value="${v}" style="--p:${pct}%" data-ux-bind="${E(n.bind)}" data-ux-kind="num" aria-valuetext="${E(show)}" ${c.lock?"disabled":""}>`)},

 Input:(n,c)=>{const id=uxId(c);
  return uxBox(c,"ux-field",`<label for="${id}"><span>${E(uxTpl(n.label,c.env))}</span></label><div class="ux-input"><input id="${id}" type="text" autocomplete="off" maxlength="${+n.max||120}" value="${E(c.env.v[n.bind]??"")}" placeholder="${E(n.placeholder||"")}" data-ux-bind="${E(n.bind)}" ${n.required?'aria-required="true"':""} ${c.lock?"disabled":""}></div>`)},
 Select:(n,c)=>{const id=uxId(c),v=c.env.v[n.bind];
  return uxBox(c,"ux-field",`<label for="${id}"><span>${E(uxTpl(n.label,c.env))}</span></label><div class="ux-input ux-select"><select id="${id}" data-ux-bind="${E(n.bind)}" ${c.lock?"disabled":""}>${uxOpts(n.options,c.env).map(o=>`<option value="${E(o.value)}" ${String(o.value)===String(v)?"selected":""}>${E(o.label)}</option>`).join("")}</select>${I("down")}</div>`)},

  return uxBox(c,"ux-field",`${uxLabel(n,c)}<div class="ux-seg" role="radiogroup" ${uxLby(n,c)} style="--n:${o.length};--i:${i}">${o.map(x=>`<button type="button" role="radio" aria-checked="${String(x.value)===String(v)}" ${attrs("ux-pick",{mid:c.mid,p:c.path,v:x.value})} ${c.lock?"disabled":""}>${E(x.label)}</button>`).join("")}</div>`)},
 Chips:(n,c)=>{const v=c.env.v[n.bind],multi=!!n.multi,on=x=>multi?Array.isArray(v)&&v.map(String).includes(String(x.value)):String(v)===String(x.value);
  return uxBox(c,"ux-field",`${uxLabel(n,c)}<div class="ux-chips" role="${multi?"group":"radiogroup"}" ${uxLby(n,c)}>${uxOpts(n.options,c.env).map(x=>`<button type="button" class="chip" role="${multi?"checkbox":"radio"}" aria-checked="${on(x)}" ${attrs("ux-pick",{mid:c.mid,p:c.path,v:x.value})} ${c.lock?"disabled":""}>${multi?`<span class="ux-tick" aria-hidden="true">${I("check")}</span>`:""}<span dir="auto">${E(x.label)}</span></button>`).join("")}</div>`)},
 Choice:(n,c)=>{const v=c.env.v[n.bind];
  return uxBox(c,"ux-choice",`<div role="radiogroup" aria-label="${E(uxTpl(n.label||"الخيارات",c.env))}">${(n.options||[]).map(o=>`<button type="button" class="ux-opt" role="radio" aria-checked="${String(o.value)===String(v)}" ${attrs("ux-pick",{mid:c.mid,p:c.path,v:o.value})} ${c.lock?"disabled":""}><span class="ux-opt-h"><span class="ux-radio" aria-hidden="true"></span><b>${E(uxTpl(o.title,c.env))}</b>${o.badge?`<span class="ux-badge t-accent">${E(o.badge)}</span>`:""}</span>${o.sub?`<small>${E(uxTpl(o.sub,c.env))}</small>`:""}${o.points?.length?`<span class="ux-pts">${o.points.map(t=>`<span>${I("check")}${E(uxTpl(t,c.env))}</span>`).join("")}</span>`:""}</button>`).join("")}</div>`)},
 Switch:(n,c)=>{const on=!!c.env.v[n.bind],l=uxTpl(n.label,c.env);
  return uxBox(c,"ux-switch",`<span><b>${E(l)}</b>${n.sub?`<small>${E(uxTpl(n.sub,c.env))}</small>`:""}</span><button type="button" class="switch" role="switch" aria-checked="${on}" aria-label="${E(l)}" ${attrs("ux-toggle",{mid:c.mid,p:c.path})} ${c.lock?"disabled":""}></button>`)},
 Checklist:(n,c)=>{const v=c.env.v[n.bind]||{};
  return uxBox(c,"ux-checklist",(n.items||[]).map(it=>`<button type="button" class="ux-ci" role="checkbox" aria-checked="${!!v[it.id]}" ${attrs("ux-check",{mid:c.mid,p:c.path,id:it.id})} ${c.lock?"disabled":""}><span class="ux-box" aria-hidden="true">${I("check")}</span><span class="ux-ci-t"><b>${E(uxTpl(it.label,c.env))}</b>${it.sub?`<small>${E(uxTpl(it.sub,c.env))}</small>`:""}</span></button>`).join(""))},
 Days:(n,c)=>{const v=c.env.v[n.bind],N=Math.min(14,Math.max(1,+n.count||7)),t0=new Date();t0.setHours(0,0,0,0);
  return uxBox(c,"ux-field",`${uxLabel(n,c)}<div class="ux-days" role="radiogroup" ${uxLby(n,c)}>${Array.from({length:N},(_,i)=>{const d=new Date(t0);d.setDate(t0.getDate()+i);const ymd=uxYmd(d);
   return `<button type="button" role="radio" aria-checked="${ymd===v}" aria-label="${E(uxDayLabel(ymd))}" ${attrs("ux-pick",{mid:c.mid,p:c.path,v:ymd})} ${c.lock?"disabled":""}><small>${i===0?"اليوم":i===1?"غدًا":E(d.toLocaleDateString("ar-u-nu-latn",{weekday:"long"}).replace(/^ال/,""))}</small><b>${d.getDate()}</b></button>`}).join("")}</div>`)},
 Button:(n,c)=>{const a=n.action||{},safe=["go","open","copy"].includes(a.do),off=(c.lock&&!safe)||(n.disabled!=null&&!!uxExpr(n.disabled,c.env,false));
  return `<button type="button" class="btn sm ${n.style==="primary"?"primary":"outline"} ${n.full?"ux-full":""}" data-ux="${c.path}" ${attrs("ux-do",{mid:c.mid,p:c.path})} ${off?"disabled":""}>${n.icon?I(n.icon):""}<span>${E(uxTpl(n.label,c.env))}</span></button>`},
 Table:(n,c)=>{const cols=n.columns||[];let rows;
  if(n.each){const list=uxExpr(n.each,c.env,[]);rows=(Array.isArray(list)?list:[]).slice(0,60).map((x,i)=>{const env={v:c.env.v,l:{[n.as||"item"]:x,i}};return {cells:(n.cells||[]).map(t=>uxTpl(t,env)),hi:!!(n.highlight&&uxExpr(n.highlight,env,false))}})}
  else rows=(n.rows||[]).map(r=>({cells:r.map(t=>uxTpl(t,c.env)),hi:false}));
  return uxBox(c,"ux-table",`${n.title?`<div class="ux-cap">${E(uxTpl(n.title,c.env))}</div>`:""}<div class="md-table"><table><thead><tr>${cols.map(h=>`<th class="${h.num?"num":""}">${E(uxTpl(h.label,c.env))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.hi?"hi":""}" ${r.hi?'aria-current="true"':""}>${r.cells.map((t,j)=>`<td class="${cols[j]?.num?"num":""}">${E(t)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)},
 Chart:(n,c)=>uxChart(n,c),
 Quiz:(n,c)=>{const ans=c.env.v[n.bind]||{};
  return uxBox(c,"ux-quiz",(n.questions||[]).map((q,qi)=>{const a=ans[qi],done=a!=null,ok=done&&+a===q.answer;
   return `<div class="ux-q ${done?(ok?"ok":"no"):""}"><div class="ux-q-h"><span class="ux-q-n">${qi+1}</span><b>${E(uxTpl(q.q,c.env))}</b></div><div class="ux-q-opts" role="radiogroup" aria-label="${E(uxTpl(q.q,c.env))}">${(q.options||[]).map((o,oi)=>{const st=done?(oi===q.answer?"right":oi===+a?"wrong":""):"";
    return `<button type="button" role="radio" class="${st}" aria-checked="${done&&oi===+a}" ${attrs("ux-quiz",{mid:c.mid,p:c.path,q:qi,o:oi})} ${done||c.lock?"disabled":""}><span>${E(uxTpl(o,c.env))}</span>${st==="right"?I("check"):st==="wrong"?I("close"):""}</button>`}).join("")}</div>${done?`<p class="ux-q-x">${ok?"<b>صحيح.</b> ":"<b>ليس تمامًا.</b> "}${E(uxTpl(q.explain||"",c.env))}</p>`:""}</div>`}).join(""))},
 Timer:(n,c)=>{const t=uxTimer(c,n),left=t.status==="run"?Math.max(0,t.end-Date.now()):t.left,frac=t.total?left/t.total:0;
  const btn=(op,icon,label,cls)=>`<button type="button" class="btn sm ${cls}" ${attrs("ux-timer",{mid:c.mid,p:c.path,op})} ${c.lock?"disabled":""}>${I(icon)}<span>${label}</span></button>`;
  return uxBox(c,`ux-timer is-${t.status}`,`<div class="ux-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="arc" cx="60" cy="60" r="52" pathLength="100" style="stroke-dashoffset:${(100-frac*100).toFixed(2)}"/></svg><span class="ux-clock"><b data-ux-clock role="timer" aria-live="off">${uxClock(left)}</b><small>${t.status==="done"?"انتهت الجلسة":t.status==="run"?"جارية":t.status==="pause"?"متوقفة مؤقتًا":E(uxTpl(n.label||"جاهز",c.env))}</small></span></div><div class="ux-row ux-center">${t.status==="run"?btn("pause","pause","إيقاف مؤقت","outline"):t.status==="done"?"":btn("start","play",t.status==="pause"?"متابعة":"ابدأ","primary")}${t.status!=="idle"?btn("reset","refresh","من جديد","outline"):""}</div>`)},
 Celebrate:(n,c)=>{const on=!!uxExpr(n.on,c.env,false);if(on){c.h.ui.fx??={};c.h.ui.fx[c.path]=1}return `<span class="ux-fx" data-ux="${c.path}" aria-hidden="true"></span>`}
};
function uxTimer(c,n){
 const v=uxVals(c.h);let t=v[n.bind];
 const total=Math.max(1,+uxExpr(n.minutes,c.env,25)||25)*60000;
 if(!t||typeof t!=="object"||!t.status)t=v[n.bind]={status:"idle",total,left:total};
 if(t.status==="idle"&&t.total!==total){t.total=total;t.left=total}
 c.env.v[n.bind]=t;return t;
}

/* ---------- chart (data-viz method: 2px lines, 10% area wash, ≤24px bars with a 4px rounded data-end, hairline
   grid, value at the line end, legend only for 2+ series, crosshair + tooltip, a table view one tap away) ---------- */
function uxNice(lo,hi,ticks=3){
 if(!(hi>lo))hi=lo+1;
 const raw=(hi-lo)/ticks,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw)||10*mag;
 return {lo:Math.floor(lo/step+1e-9)*step,hi:Math.ceil(hi/step-1e-9)*step,step};
}
function uxChart(n,c){
 const by=n.by?c.env.v[n.by]:null,pick=d=>d&&!Array.isArray(d)&&typeof d==="object"?d[by]:d;
 const labels=(pick(n.labels)||[]).map(String);
 const series=(n.series||[]).map((s,i)=>({name:uxTpl(s.name||"",c.env),data:(pick(s.data)||[]).map(x=>x==null?null:+x),slot:i}));
 const title=uxTpl(n.title||"",c.env),bar=n.kind==="bar",multi=series.length>1;
 const fmt=v=>v==null?"—":uxTpl(n.fmt||"{@Fmt(x)}",{v:c.env.v,l:{x:v}});
 const table=c.h.ui.view?.[c.path]==="table";
 const head=`<div class="ux-chart-h"><b>${E(title)}</b><button type="button" class="ux-view" ${attrs("ux-view",{mid:c.mid,p:c.path})} aria-pressed="${table}" aria-label="${table?"عرض كرسم":"عرض كجدول"}" title="${table?"عرض كرسم":"عرض كجدول"}">${I(table?"chart":"table")}</button></div>`;
 const legend=multi?`<div class="ux-legend">${series.map(s=>`<span><i style="background:var(--ux-s${s.slot+1})"></i>${E(s.name)}</span>`).join("")}</div>`:"";
 if(table)return uxBox(c,"ux-chart",head+`<div class="md-table"><table><thead><tr><th></th>${series.map(s=>`<th class="num">${E(s.name||title)}</th>`).join("")}</tr></thead><tbody>${labels.map((l,i)=>`<tr><td>${E(l)}</td>${series.map(s=>`<td class="num">${E(fmt(s.data[i]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
 const vals=series.flatMap(s=>s.data).filter(v=>v!=null&&Number.isFinite(v));
 if(!vals.length)return uxBox(c,"ux-chart",head+`<p class="ux-empty">لا توجد بيانات.</p>`);
 let lo=Math.min(...vals),hi=Math.max(...vals);if(bar||n.zero)lo=Math.min(0,lo),hi=Math.max(0,hi);
 const sc=uxNice(lo,hi,3),W=320,H=+n.height||150,PT=10,PB=22,PL=42,PR=bar?6:46,pw=W-PL-PR,ph=H-PT-PB;
 const N=Math.max(1,labels.length||series[0].data.length),dx=bar?pw/N:N>1?pw/(N-1):0,x0=bar?PL+dx/2:PL;
 const X=i=>x0+dx*i,Y=v=>PT+ph-(v-sc.lo)/(sc.hi-sc.lo)*ph,base=Y(Math.max(sc.lo,Math.min(0,sc.hi)));
 const unit=n.unit||"",compact=Math.max(Math.abs(sc.lo),Math.abs(sc.hi))>=1e4;
 const tick=t=>(t<0?"−":"")+unit+(compact?uxNum(Math.abs(t)/1000,1,0)+"K":uxNum(Math.abs(t),sc.step<1?1:0,0));
 let g="";for(let t=sc.lo,k=0;t<=sc.hi+sc.step/2&&k<12;t+=sc.step,k++){const y=Y(t).toFixed(1);g+=`<line class="g${Math.abs(t)<1e-9&&bar?" z":""}" x1="${PL}" x2="${W-PR+(bar?0:8)}" y1="${y}" y2="${y}"/><text class="yl" x="${PL-7}" y="${y}" dy="3.6">${E(tick(t))}</text>`}
 const shown=N<=7?labels.map((_,i)=>i):[0,1,2,3,4].map(k=>Math.round(k*(N-1)/4));
 let xl="";[...new Set(shown)].forEach(i=>{if(labels[i]==null)return;const anchor=bar?"middle":i===0?"start":i===N-1?"end":"middle";xl+=`<text class="xl" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${anchor}">${E(labels[i])}</text>`});
 let marks="",ends=[];
 series.forEach((s,si)=>{
  const col=multi?`var(--ux-s${si+1})`:"var(--ux-s0)";
  if(bar){
   const gw=Math.min(24*series.length+2*(series.length-1),dx*.66),bw=(gw-2*(series.length-1))/series.length;
   s.data.forEach((v,i)=>{if(v==null)return;const x=X(i)-gw/2+si*(bw+2),y=Y(v),h=Math.abs(y-base),r=Math.min(4,bw/2,h),up=v>=0;
    const fill=n.polar?(up?"var(--ux-pos)":"var(--ux-neg)"):col;
    const d=up?`M${x.toFixed(1)} ${base.toFixed(1)}V${(y+r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x+r).toFixed(1)} ${y.toFixed(1)}H${(x+bw-r).toFixed(1)}Q${(x+bw).toFixed(1)} ${y.toFixed(1)} ${(x+bw).toFixed(1)} ${(y+r).toFixed(1)}V${base.toFixed(1)}Z`
     :`M${x.toFixed(1)} ${base.toFixed(1)}V${(y-r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x+r).toFixed(1)} ${y.toFixed(1)}H${(x+bw-r).toFixed(1)}Q${(x+bw).toFixed(1)} ${y.toFixed(1)} ${(x+bw).toFixed(1)} ${(y-r).toFixed(1)}V${base.toFixed(1)}Z`;
    marks+=`<path class="bar" data-i="${i}" d="${d}" style="fill:${fill}"/>`});
  }else{
   const pts=s.data.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
   const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
   if(!multi&&n.area!==false)marks+=`<path class="area" d="${d}L${pts.at(-1)[0].toFixed(1)} ${(PT+ph).toFixed(1)}L${pts[0][0].toFixed(1)} ${(PT+ph).toFixed(1)}Z" style="fill:${col}"/>`;
   marks+=`<path class="ln" d="${d}" style="stroke:${col}"/><circle class="dot" cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="4" style="fill:${col}"/>`;
   const lv=[...s.data].reverse().find(v=>v!=null);ends.push({y:pts.at(-1)[1],x:pts.at(-1)[0],t:fmt(lv)});
  }
 });
 // value at the line end; when two ends would collide, leave them to the legend and tooltip

/* what you ask to do outranks what it is about: «اختبرني في إدارة المخاطر» is a quiz, not a calculator */
const UX_MATCH=["quiz","focus","alert","schedule","choose","plan","risk","perf"];
function uxPlan(text,a,um){
 if(!text||um.cmd||um.kind||um.uiev||UX_TEXT_ONLY.test(text))return null;
 if(/سؤال/.test(text)&&!/اختب|امتحان/.test(text))return null;   // «سؤال» keeps the built-in question card
 const r=UX_MATCH.map(k=>UX_RECIPES.find(x=>x.id===k)).find(x=>x&&x.test.test(text));if(!r)return null;
 const s=r.build({a,text,um});return {r,spec:{...s,kind:r.kind}};
}
/* the answer: an interface (or, with interfaces off, the same answer as text) */
function uxReply(plan,push){
 if(prefs().genui)push({kind:"ui",text:plan.spec.lead,ui:uxSpec(plan.spec)});
 else push({text:plan.spec.fallback});
}

function uxReceipt({title,icon="check",lead,rows,buttons=[],why}){
 return {kind:"إيصال",title,icon,lead,
  why:why||"تأكيد مختصر بالتفاصيل مع زر للخطوة التالية؛ أوضح من فقرة وأسهل من البحث في القوائم.",
  state:{},root:[{type:"KeyValue",rows:rows.map(([k,v])=>[k,uxLit(v)])},...(buttons.length?[{type:"Row",children:buttons}]:[])],
  fallback:lead+"\n\n"+rows.map(([k,v])=>`- **${k}:** ${v}`).join("\n")};
}
const uxPushReceipt=(push,r)=>prefs().genui?push({kind:"ui",text:r.lead,ui:uxSpec(r)}):push({text:r.fallback});

/* ---- the agent acts on what you sent from an interface: its own tools, then an answer (text or another interface) */

 "risk.apply":({d,push})=>push({text:`اعتمدت **${uxNum(d.lot,2)} لوت** لكل صفقة، أي مخاطرة **$${uxNum(d.amount,0,0)}** (${uxNum(d.risk,1,0)}%) من رأس مال $${uxNum(d.capital)} مع وقف على بعد $${uxNum(d.stop,1,0)}.\n\nسأقترح هذا الحجم تلقائيًا، وأنبّهك قبل أي صفقة تتجاوز ${uxNum(d.risk,1,0)}%.`}),
 "alert.create":({responder,d,push})=>{
  const name=d.name||d.symbol,op=d.dir==="below"?"تحت":"فوق",price=uxNum(d.price,+d.dp||2);
  const ch=(Array.isArray(d.ch)?d.ch:[]).map(x=>({app:"داخل التطبيق",push:"إشعار الهاتف",call:"مكالمة الوكيل"})[x]).filter(Boolean);
  const s={id:id(),agent:responder,title:`تنبيه ${name} ${op} ${price}`,type:"عند تحقق شرط",repeat:`${d.symbol} ${op} ${price}`,time:"فوري",condition:`${d.symbol} ${d.dir==="below"?"<":">"} ${price}`,channel:ch[0]||"داخل التطبيق",on:true};
  S.schedules.unshift(s);log("إنشاء تنبيه سعر",s.title);
  uxPushReceipt(push,uxReceipt({title:"التنبيه فعّال",icon:"bell",lead:"أنشأت التنبيه وسأراقب السعر على مدار الساعة.",rows:[["الأصل",name],["الشرط",op+" "+price],["الإشعار",ch.join("، ")||"داخل التطبيق"]],
   buttons:[{type:"Button",label:"عرض التنبيهات",icon:"clock",action:{do:"go",route:"tasks",args:{filter:"scheduled"}}},{type:"Button",label:"إيقاف التنبيه",icon:"bellOff",action:{do:"send",intent:"alert.off",text:"أوقف تنبيه "+name,data:{id:s.id}}}]}));
 },
 "alert.off":({d,push})=>{const s=S.schedules.find(x=>x.id===d.id);if(s){s.on=false;log("إيقاف تنبيه",s.title)}push({text:s?`أوقفت «${s.title}». يمكنك تشغيله من المهام المجدولة متى شئت.`:"لم أجد هذا التنبيه؛ ربما حُذف."})},
 "schedule.create":({responder,d,push})=>{
  const rep={once:"مرة واحدة",daily:"يوميًا",weekly:"أسبوعيًا"}[d.repeat]||"مرة واحدة",topic=String(d.topic||"متابعة").trim().slice(0,60)||"متابعة";
  const s={id:id(),agent:responder,title:topic,type:d.repeat==="once"?"مرة واحدة":"متكرر",repeat:d.repeat==="once"?uxDayLabel(d.day):rep,date:d.day,time:d.time,channel:"داخل التطبيق",on:true};
  S.schedules.unshift(s);log("جدولة موعد",topic);
  uxPushReceipt(push,uxReceipt({title:"الموعد مثبّت",icon:"calendar",lead:"ثبّتّ الموعد، وسأذكّرك هنا قبله بعشر دقائق.",rows:[["الموضوع",topic],["الموعد",uxDayLabel(d.day)+" · "+d.time],["التكرار",rep]],
   buttons:[{type:"Button",label:"المهام المجدولة",icon:"clock",action:{do:"go",route:"tasks",args:{filter:"scheduled"}}}]}));
 },
 "plan.choose":({d,push})=>{
  const items=UX_STYLE_ITEMS[d.plan]||UX_STYLE_ITEMS.balanced;
  uxReply({spec:{...uxPlanSpec({items,title:`بدء أسلوب «${uxLit(d.name)}»`,lead:`ممتاز، اخترت أسلوب «${d.name}». هذه خطوات البدء؛ أشّر على ما تنجزه.`}),kind:"قائمة قابلة للتأشير"}},push);
 },
 "plan.tasks":({responder,d,card,push})=>{
  const items=card?.ui?.root?.find(x=>x.type==="Checklist")?.items||[],done=d.done||{},left=items.filter(x=>!done[x.id]);
  const made=left.map(x=>{const t={id:id(),agent:responder,title:x.label,description:x.sub||x.label,due:"18:00",criteria:"إنجاز الخطوة",status:"active"};S.tasks.unshift(t);return t});
  if(made.length)log("إنشاء مهام من خطة",arCount(made.length,["مهمة واحدة","مهمتان","مهام","مهمة"],""));
  uxPushReceipt(push,uxReceipt({title:"أُضيفت إلى المهام",icon:"task",lead:made.length?`أضفت ${arCount(made.length,["مهمة واحدة","مهمتين","مهام","مهمة"],"")} وسأتابعها معك.`:"كل الخطوات منجزة؛ لا شيء لإضافته.",rows:made.map((t,i)=>[String(i+1),t.title]),
   buttons:[{type:"Button",label:"عرض المهام",icon:"task",action:{do:"go",route:"tasks",args:{filter:"active"}}}]}));
 },
 "perf.explain":({d,push})=>{
  const T={week:"**أفضل يوم:** الجمعة (+$239) بعد اختراق مقاومة 2,350.\n**أسوأ يوم:** الأحد (−$41) مع فجوة الافتتاح.\n\nالخلاصة: أرباح الأسبوع جاءت من صفقتين فقط؛ التزام الوقف حمى بقية الأيام.",
   month:"**أفضل أسبوع:** الرابع (+$412).\n**أضعف أسبوع:** الثاني (+$170) بسبب تذبذب جانبي.\n\nكل أسابيع الشهر رابحة، والانضباط في حجم الصفقة هو السبب الأول.",
   year:"**أفضل شهر:** نوفمبر (+$1,286).\n**أسوأ شهر:** مارس (−$170).\n\nشهران فقط بخسارة صغيرة خلال السنة؛ النتيجة متسقة مع مخاطرة 1%."};
  push({text:T[d.range]||T.week});
 },
 "quiz.review":({d,card,push})=>{
  const q=card?.ui?.root?.find(x=>x.type==="Quiz")?.questions||[],ans=d.ans||{};
  const wrong=q.map((x,i)=>({x,i})).filter(({x,i})=>ans[i]!=null&&+ans[i]!==x.answer);
  push({text:wrong.length?`### مراجعة الأخطاء\n${wrong.map(({x,i})=>`**${i+1}. ${x.q}**\n- إجابتك: ${x.options[+ans[i]]}\n- الصحيح: **${x.options[x.answer]}** — ${x.explain}`).join("\n\n")}\n\nجرّب الاختبار مرة أخرى بعد قراءة الشرح.`:"كل إجاباتك صحيحة؛ لا أخطاء لشرحها."});
 },
 "focus.log":({d,push})=>{log("جلسة تركيز",`${d.mins} دقيقة`);push({text:`سجّلت جلسة تركيز مدتها ${d.mins} دقيقة في سجل الإجراءات. خذ استراحة قصيرة، ثم أخبرني إن أردت جلسة أخرى.`})}
};
const UX_EVENT_STEPS={
 "alert.create":d=>[{icon:"bolt",t:"أداة: إنشاء تنبيه سعر",d:`${d.symbol} ${d.dir==="below"?"<":">"} ${uxNum(d.price,+d.dp||2)}`},{icon:"check",t:"تأكيد الإنشاء"}],
 "schedule.create":d=>[{icon:"bolt",t:"أداة: جدولة تذكير",d:`${d.day} ${d.time}`},{icon:"check",t:"تأكيد الموعد"}],
 "plan.tasks":()=>[{icon:"bolt",t:"أداة: إنشاء مهام"},{icon:"check",t:"ربطها بالوكيل"}],

};
function uxAnswer({a,responder,um,arr,push}){
 const ev=um.uiev||{},card=arr.find(m=>m.id===ev.mid),f=UX_EVENTS[ev.intent];
 if(f)f({a,responder,um,d:ev.data||{},card,push});
 else push({text:"وصلني اختيارك وسأتصرف بناءً عليه."});
}
function uxSteps(um,lead,web){
 if(um.uiev){const f=UX_EVENT_STEPS[um.uiev.intent];return f?f(um.uiev.data||{}):null}
 if(lead?.kind!=="ui"||!lead.ui)return null;
 return [...(web?[{icon:"globe",t:"البحث في الويب",d:"4 نتائج"}]:[]),{icon:"chat",t:"فهم الطلب",d:lead.ui.title},{icon:"sparkle",t:"اختيار طريقة العرض",d:lead.ui.kind},{icon:"layers",t:"بناء الواجهة",d:arCount(lead.ui.root.length,["عنصر واحد","عنصران","عناصر","عنصرًا"],"")}];
}
const uxCopyText=m=>m?.kind==="ui"?[m.text,m.ui?.fallback].filter(Boolean).join("\n\n"):String(m?.text||"");

 S.chatDrafts??={};S.chatDrafts[a.id]=r.sample;save();openChat("agent",a.id);
