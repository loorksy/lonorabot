/* ---- Custom lists (WhatsApp «القوائم»): your own filters above the chat list.
   «+» at the end of the filter chips opens «قائمة جديدة» (full height): a name (😊 opens the emoji panel), then
   pick agents and groups.
   The list becomes a chip between the built-in filters and «+»; tapping it filters the chats. Long-press (or
   right-click) a list chip: تعديل · حذف (with undo). While selecting chats: ⋮ → «إضافة إلى قائمة».
   S.lists = [{id, name, keys:[threadKey…]}]; listFilter = "list:<id>". */
let listDraft=null;   // {id?, name, keys:Set, then?:"select"}
const listsOf=()=>(S.lists??=[]);
const listById=id=>listsOf().find(l=>l.id===id);
const activeList=()=>String(listFilter).startsWith("list:")?listById(String(listFilter).slice(5)):null;
const inList=x=>!!activeList()?.keys.includes(x.key);
const listCount=l=>arCount(l.keys.length,["محادثة واحدة","محادثتان","محادثات","محادثة"],"فارغة");
function listChips(){
 return listsOf().map(l=>{const on=listFilter==="list:"+l.id;return `<button type="button" class="chip list-chip ${on?"active":""}" data-list="${E(l.id)}" ${attrs("list-filter",{filter:"list:"+l.id})} aria-pressed="${on}">${E(l.name)}</button>`}).join("")
  +`<button type="button" class="chip chip-add" ${attrs("list-new")} aria-label="قائمة جديدة" title="قائمة جديدة">${I("plus")}</button>`;
}
function listEmpty(l){return `<div class="empty list-empty">${I("layers")}<div>لا محادثات في «${E(l.name)}» بعد.</div>${B(`${I("plus")}<span>إضافة محادثات</span>`,"list-edit",{id:l.id,step:"pick"},"outline sm")}</div>`}

/* step 1: the name — a full-height sheet (WhatsApp): the field on top, the button at the bottom, riding above the
   keyboard or the emoji panel */
function listNameSheet(dir=""){
 const d=listDraft,edit=!!d.id;emojiReset();
 sheet(edit?"تعديل القائمة":"قائمة جديدة",`<form class="list-form" data-form="list-name" novalidate><div class="list-top"><label class="list-label" for="list-name">اسم القائمة</label><div class="list-name-row"><input id="list-name" name="name" maxlength="30" autocomplete="off" enterkeyhint="next" placeholder="مثال: العمل، الأصدقاء" value="${E(d.name||"")}"><button type="button" class="icon list-emoji-b" data-emo-toggle ${attrs("list-emoji")} aria-label="إضافة رمز تعبيري" aria-expanded="false">${I("smile")}</button></div><p class="list-hint">أي قائمة تنشئها تصير فلترًا أعلى قائمة المحادثات.</p></div><div class="list-foot"><button type="submit" class="btn primary full list-next" ${d.name?.trim()?"":"disabled"}>${edit?"التالي: المحادثات":"إضافة وكلاء أو مجموعات"}</button></div><div class="emoji-panel" hidden aria-label="الرموز التعبيرية"></div></form>`,{bar:true,id:"list",dir,full:true});
 setTimeout(()=>{const i=document.getElementById("list-name");if(i&&document.activeElement!==i){i.focus({preventScroll:true});i.setSelectionRange(i.value.length,i.value.length)}},dir?40:340);
}
/* step 2: who is in it */
function listPickSheet(dir=""){
 const d=listDraft;
 const rows=[...S.agents.map(a=>({key:a.id,name:a.name,sub:a.role,av:avatar(a)})),...S.groups.map(g=>({key:"group:"+g.id,name:g.name,sub:g.purpose||"مجموعة",av:groupAvatar()}))];
 emojiReset();
 sheet(`إضافة إلى «${E(d.name)}»`,`<div class="list-pick"><label class="lp-search">${I("search")}<input id="list-q" type="search" placeholder="بحث" autocomplete="off" aria-label="بحث في الوكلاء والمجموعات"></label><div class="group list-rows" role="group" aria-label="الوكلاء والمجموعات">${rows.map(r=>`<button type="button" class="row list-row" role="checkbox" aria-checked="${d.keys.has(r.key)}" data-q="${E(fold(r.name+" "+(r.sub||"")))}" ${attrs("list-toggle",{key:r.key})}>${r.av}<span class="body"><strong>${E(r.name)}</strong><small>${E(r.sub||"")}</small></span><span class="list-box" aria-hidden="true">${I("check")}</span></button>`).join("")}<p class="list-none" hidden>لا نتائج.</p></div><div class="list-foot"><button type="button" class="btn primary full list-save" ${attrs("list-save")}>${listSaveLabel()}</button></div></div>`,{bar:true,id:"list",back:["list-back"],dir,full:true});
}
const listSaveLabel=()=>(listDraft.id?"حفظ القائمة":"إنشاء القائمة")+(listDraft.keys.size?` · ${listDraft.keys.size}`:"");
function listSave(){
 const d=listDraft;if(!d||!d.name.trim())return;
 const name=d.name.trim().slice(0,30),keys=[...d.keys];
 const dup=listsOf().find(l=>l.id!==d.id&&l.name===name);if(dup)return toast(`توجد قائمة باسم «${name}»`,{type:"warn"});
 let l=d.id&&listById(d.id);
 if(l)Object.assign(l,{name,keys});else{l={id:id(),name,keys};listsOf().push(l)}
 const wasSel=d.then==="select";listDraft=null;listFilter="list:"+l.id;save();close();
 if(wasSel&&sel){sel=null;if(history.state?.sel)history.replaceState({lonora:{...U}},"","#"+U.route)}
 if(isDesktop())refreshDesktopList(true);else if(U.route==="chats")render({scroll:"top"});
 setTimeout(()=>document.querySelector(`.list-filters .chip[data-list="${CSS.escape(l.id)}"]`)?.scrollIntoView({inline:"nearest",block:"nearest",behavior:"smooth"}),80);
 toast(d.id?`حُفظت «${name}»`:`أُنشئت قائمة «${name}»`,{type:"success"});
}
/* long-press or right-click on a list chip */
function listMenu(lid,anchor){
 const l=listById(lid);if(!l)return;navigator.vibrate?.(10);
 openPop(anchor,`<div class="pop-title">${E(l.name)} · ${listCount(l)}</div>`+popItem("edit","تعديل القائمة","list-edit",{id:lid})+popItem("users","المحادثات","list-edit",{id:lid,step:"pick"})+'<div class="pop-sep"></div>'+popItem("trash","حذف القائمة","list-delete",{id:lid},"danger"),{cls:"menu-pop"});
}
function listDelete(lid){
 const arr=listsOf(),i=arr.findIndex(l=>l.id===lid);if(i<0)return;
 const [l]=arr.splice(i,1),was=listFilter==="list:"+lid;if(was)listFilter="all";save();
 const redraw=()=>{if(isDesktop())refreshDesktopList(true);else if(U.route==="chats")render({scroll:"remember"})};redraw();
 toast(`حُذفت «${l.name}»`,{action:{label:"تراجع",fn:()=>{listsOf().splice(i,0,l);if(was)listFilter="list:"+lid;save();redraw()}}});
}
/* selecting chats → ⋮ → إضافة إلى قائمة */
function listAddSheet(keys){
 const lists=listsOf();
 sheet("إضافة إلى قائمة",`<div class="group">${lists.map(l=>`<button type="button" class="row" ${attrs("list-add-to",{id:l.id})}><span class="row-icon">${I("layers")}</span><span class="body"><strong>${E(l.name)}</strong><small>${listCount(l)}</small></span></button>`).join("")}<button type="button" class="row" ${attrs("list-new",{from:"select"})}><span class="row-icon">${I("plus")}</span><span class="body"><strong>قائمة جديدة</strong><small>${E(chatsWord(keys.length))} ستُضاف إليها</small></span></button></div>`,{bar:true,id:"list"});
}
function listAction(action,p,button){
 if(action==="list-new"){
  const keys=p.from==="select"&&sel?[...sel]:[];listDraft={name:"",keys:new Set(keys),then:p.from==="select"?"select":""};
  closePop();return $("#dialog").open?sheetMorph(()=>listNameSheet("fwd")):listNameSheet();
 }
 if(action==="list-edit"){
  const l=listById(p.id);if(!l)return true;closePop();listDraft={id:l.id,name:l.name,keys:new Set(l.keys)};
  return p.step==="pick"?listPickSheet():listNameSheet();
 }
 if(action==="list-delete"){closePop();return listDelete(p.id)}
 if(action==="list-back"){if(listDraft)sheetMorph(()=>listNameSheet("back"));return true}
 if(action==="list-save")return listSave();
 if(action==="list-toggle"){
  const d=listDraft;if(!d)return true;
  if(d.keys.has(p.key))d.keys.delete(p.key);else d.keys.add(p.key);
  button.setAttribute("aria-checked",String(d.keys.has(p.key)));navigator.vibrate?.(6);
  const s=document.querySelector("#dialog .list-save");if(s)s.textContent=listSaveLabel();return true;
 }
 if(action==="list-emoji"){const i=document.getElementById("list-name"),pn=document.querySelector("#dialog .emoji-panel");if(i&&pn)emojiToggle(i,pn,button);return true}
 if(action==="list-add-to"){
  const l=listById(p.id);if(!l||!sel)return true;
  const add=[...sel].filter(k=>!l.keys.includes(k));l.keys.push(...add);
  save();close();selClear();render({scroll:"remember"});
  return toast(add.length?`أُضيفت ${chatsWord(add.length)} إلى «${l.name}»`:`كلها موجودة في «${l.name}»`,{type:"success"}),true;
 }
 return false;
}
document.addEventListener("input",e=>{
 if(e.target.id==="list-name"&&listDraft){listDraft.name=e.target.value;const b=e.target.form?.querySelector(".list-next");if(b)b.disabled=!e.target.value.trim();return}
 if(e.target.id==="list-q"){const q=fold(e.target.value.trim());let n=0;document.querySelectorAll("#dialog .list-row").forEach(r=>{const show=!q||r.dataset.q.includes(q);r.hidden=!show;if(show)n++});const none=document.querySelector("#dialog .list-none");if(none)none.hidden=n>0}
});
document.addEventListener("submit",e=>{const f=e.target.closest?.('#dialog form[data-form="list-name"]');if(!f)return;e.preventDefault();e.stopImmediatePropagation();
 if(!listDraft?.name?.trim())return;emojiHide(false);sheetMorph(()=>listPickSheet("fwd"))});
/* long-press a list chip (touch) or right-click it (mouse) */
let chipPress=null,chipEat=null;   // chipEat: the chip whose release-click must not also switch the filter
document.addEventListener("pointerdown",e=>{const c=e.target.closest?.(".list-filters .list-chip");if(!c)return;
 chipPress={x:e.clientX,y:e.clientY,t:setTimeout(()=>{chipPress=null;chipEat=c;listMenu(c.dataset.list,c)},480)}},{passive:true});
document.addEventListener("click",e=>{if(!chipEat)return;const hit=e.target.closest?.(".list-chip")===chipEat;chipEat=null;if(hit){e.preventDefault();e.stopPropagation()}},true);
document.addEventListener("pointermove",e=>{if(chipPress&&Math.hypot(e.clientX-chipPress.x,e.clientY-chipPress.y)>8){clearTimeout(chipPress.t);chipPress=null}},{passive:true});
["pointerup","pointercancel","scroll"].forEach(t=>document.addEventListener(t,()=>{if(chipPress){clearTimeout(chipPress.t);chipPress=null}},{passive:true,capture:true}));
document.addEventListener("contextmenu",e=>{const c=e.target.closest?.(".list-filters .list-chip");if(!c)return;e.preventDefault();if(pop?.anchor!==c)listMenu(c.dataset.list,c)});
/* the chips row keeps its sideways position across re-renders, and the active chip stays in view */
let filtersX=0;
document.addEventListener("scroll",e=>{if(e.target.classList?.contains("list-filters"))filtersX=e.target.scrollLeft},true);
function restoreFiltersX(){
 document.querySelectorAll(".list-filters").forEach(f=>{
  if(f.scrollLeft!==filtersX)f.scrollLeft=filtersX;

/* ---- On-screen keyboard: sheets and full-screen overlays sit just above it (v20.1).
   --app-height already follows the visual viewport, which keeps the app and the chat composer above the keyboard.
   Dialogs and the sign-in overlay are fixed to the layout viewport, which the keyboard covers, so they get
   --kb = the height the keyboard hides (0 on desktop, and while pinch-zoomed), and a field focused inside a sheet
   is kept in view. Native build: the system resizes the window (adjustResize / KeyboardAvoidingView). */
let kbLast=0;   // the last real keyboard height: the emoji panel opens at the same height
function measureKeyboard(){
 const v=window.visualViewport;if(!v)return;
 const kb=v.scale>1.01?0:Math.max(0,Math.round(window.innerHeight-v.height-v.offsetTop));
 const root=document.documentElement;
 if(root.style.getPropertyValue("--kb")!==kb+"px")root.style.setProperty("--kb",kb+"px");
 root.classList.toggle("kb-open",kb>80);if(kb>150)kbLast=kb;
}
window.visualViewport?.addEventListener("resize",measureKeyboard,{passive:true});
window.visualViewport?.addEventListener("scroll",measureKeyboard,{passive:true});
window.addEventListener("resize",measureKeyboard,{passive:true});
measureKeyboard();

 const t=e.target;if(!t.matches?.("input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea"))return;
 const box=t.closest("dialog,#auth");if(!box)return;
 // after the keyboard has finished opening, bring the field (and its label) into the visible part of the sheet
 setTimeout(()=>{if(document.activeElement===t)(t.closest(".field,.list-form,.ux-field")||t).scrollIntoView({block:"nearest",behavior:reduceMotion.matches?"auto":"smooth"})},360);
});

function emoData(){
 if(EMO)return EMO;

/* ---- Skeletons everywhere data would come from the server (v25).
   Each shape mirrors the real page — same cards, rows, avatars, tabs and buttons — so nothing jumps when the data
   arrives. Shown while a view's data is on its way: in this prototype that is the first visit of a view while «شبكة
   بطيئة» is on in «مختبر الحالات» (no server here); in the app, while the query is loading (Suspense / isLoading).
   Covered: chats · archived · chat · agents · agent · group · tasks · task · updates · usage (+ agents, models, detail)
   · trades · files · knowledge · skills · goals · schedules · activity · integrations · providers · MCP · broker account
   · account · plans · storage · help · edit forms (identity, profile, note, file) · the desktop chat list · search
   results · older messages at the top of a long chat · sheets that fetch (the market chart and each timeframe, a file's
   preview, a skill's version history) · photos in chat and in the photo viewer (shimmer at the photo's own size until it
   has downloaded). The pager's half-swiped page shows the same skeleton. Settings that live on the device (appearance,
   notifications, privacy, about) and sheets built from data already on screen never show one.

/* true while key's data is "loading"; starts its own timer once, then marks it loaded and calls done */
function skPending(key,done,ms=1300){

/* ---- Usage: a calm dashboard (data-viz method).

const uDay=(d,who)=>who.reduce((s,i)=>s+uAgentDay(i,d),0);
function usageSeries(period,agent=null){

  const full=uDay(today,who),h=now.getHours(),m=now.getMinutes()/60;
  const pts=USAGE.hours.map((w,i)=>({t:new Date(today.getFullYear(),today.getMonth(),today.getDate(),i),v:i<h?full*w/uHourW:i===h?full*w/uHourW*m:null}));
  return {unit:"hour",pts,total:full*fr,prev:uDay(uShift(today,-1),who)*fr};
 }
 const n=period==="هذا الأسبوع"?7:30,pts=[];
 for(let k=n-1;k>=0;k--){const d=uShift(today,-k),f=uDay(d,who);pts.push({t:d,v:k?f:f*fr})}
 let prev=0;for(let k=n;k<2*n;k++)prev+=uDay(uShift(today,-k),who);

function usageMonth(){

 let spent=uDay(today,who)*fr;for(let d=1;d<dNow;d++)spent+=uDay(new Date(y,m,d),who);

 return {spent,proj:rate*dIn,budget,dIn,cross:rate>0?Math.ceil(budget/rate):null,month:uDate(today,{month:"long"}),end:uDate(new Date(y,m,dIn),{day:"numeric",month:"long"})};
}

const uUsd=v=>"$"+(v>=1000?Math.round(v).toLocaleString("en"):v>=100?v.toFixed(0):v>=.1||!v?v.toFixed(2):v>=.01?v.toFixed(3):Math.max(v,1e-4).toFixed(4));

}
function usageIndexAt(bars,x){let best=0,bd=Infinity;[...bars.children].forEach((s,i)=>{const r=s.getBoundingClientRect(),d=x<r.left?r.left-x:x>r.right?x-r.right:0;if(d<bd){bd=d;best=i}});return best}

/* ---- The market chart sheet. It rests at half height and raises to the whole screen (sheet opt.expand: drag it up
   or tap ⤢; on desktop ⤢ makes it nearly full-window). The drawing follows the chart's real size: up to 600 units wide
   it scales down like before (phones), wider charts get more candles instead of bigger ones (desktop), and a taller
   chart shows the same candles in more detail (the price axis fits them). A ResizeObserver redraws while the sheet
   grows. No drawing tools: the whole sheet, chart included, is a handle for raising and lowering it. */
const FRAME_MIN={"5m":5,"15m":15,"1h":60,"4h":240};
function chart(){
 sheet('الذهب <small class="ltr">XAUUSD · توضيحي</small>',`<div class="tabs">${["5m","15m","1h","4h"].map(f=>`<button type="button" class="${frame===f?"active":""}" ${attrs("chart-frame",{frame:f})}>${f}</button>`).join("")}</div>${skSlot("chart:"+frame,skChart(),()=>`<svg class="chart grow" id="chart-svg" viewBox="0 0 600 310" role="img" aria-label="شارت توضيحي"></svg>`,{ms:1000,after:drawChart,cls:"grow"})}`,{id:"chart",expand:true});
 drawChart();
}
/* geometry for the chart's current size. The base drawing is 600 units wide; up to that it scales with the width (phones),
   beyond it more candles fit (desktop). Labels stay ~10.5px whatever the scale. The price axis fits the visible candles
   (12% air above and below) with a round step, so a taller chart shows the same candles in more detail. Prices live in
   "base" units b (price = 2355 − b/10; larger b = lower price). */
function chartGeom(el){
 const w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight),s=Math.min(1,Math.max(.55,w/600));
 const VW=Math.round(w/s),VH=Math.max(160,Math.round(h/s)),fs=+(10.5/s).toFixed(1),gut=Math.round(fs*3.7+14);
 const right=VW-gut,xLast=right-12,top=Math.round(fs*.9),bottom=VH-Math.round(fs*1.9+8),n=Math.max(8,Math.floor((xLast-20)/17)+1);
 const shift=["5m","15m","1h","4h"].indexOf(frame),close=j=>145-j*2.2+Math.sin(j*1.7+shift)*18,candles=[];
 let lo=Infinity,hi=-Infinity;
 for(let i=1-n;i<=0;i++){const j=i+29,o=j===0?145:close(j-1),c=close(j);candles.push({i,o,c});lo=Math.min(lo,o,c);hi=Math.max(hi,o,c)}
 lo-=11;hi+=11;const pad=(hi-lo)*.12,b0=lo-pad,b1=hi+pad,k=(bottom-top)/(b1-b0);
 return {size:w+"x"+h,s,VW,VH,fs,right,xLast,top,bottom,n,candles,b0,b1,k,X:i=>xLast+i*17,Y:b=>top+(b-b0)*k};
}
const chartHM=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")};
/* a round price step that puts grid lines ~48px apart */
function chartStep(g){
 const range=(g.b1-g.b0)/10,want=Math.max(2,Math.floor((g.bottom-g.top)*g.s/48)),raw=range/want;
 return [.25,.5,1,2,2.5,5,10,20,25,50].find(x=>x>=raw)||100;
}
const chartRO=typeof ResizeObserver==="function"?new ResizeObserver(list=>{for(const en of list){const el=en.target;if(!el.isConnected){chartRO.unobserve(el);continue}if(el._size!==el.clientWidth+"x"+el.clientHeight)drawChart()}}):null;
function drawChart(){
 const el=$("#chart-svg");if(!el)return;
 const g=chartGeom(el),{VH,k,right,X,Y,fs}=g,fm=FRAME_MIN[frame]||5,f=n=>n.toFixed(1);
 el.setAttribute("viewBox",`0 0 ${g.VW} ${VH}`);el._size=g.size;
 if(chartRO&&!el._ro){el._ro=1;chartRO.observe(el)}
 let html="";
 const step=chartStep(g),pTop=2355-g.b0/10,pBot=2355-g.b1/10;
 for(let p=Math.ceil(pBot/step)*step;p<=pTop+1e-9;p+=step){const y=Y((2355-p)*10);
  html+=`<path d="M15 ${f(y)}H${right}" style="stroke:var(--line)" stroke-dasharray="4 5"/><text x="${right+8}" y="${f(y+fs*.35)}" style="fill:var(--muted)" font-size="${fs}">${p.toFixed(step<.5?2:1)}</text>`}
 for(const {i,o,c} of g.candles){
  const x=X(i),top=Y(Math.min(o,c)),h=Math.max(3,Math.abs(o-c)*k),color=c<o?"var(--mint)":"var(--red)";
  html+=`<line x1="${f(x+5)}" x2="${f(x+5)}" y1="${f(top-11*k)}" y2="${f(top+h+11*k)}" style="stroke:${color}"/><rect x="${f(x)}" y="${f(top)}" width="10" height="${f(h)}" rx="1.5" style="fill:${color}"/>`;
 }
 for(let i=-1;X(i)>=15;i-=7)html+=`<text x="${f(X(i))}" y="${f(VH-fs*.6)}" style="fill:var(--muted)" font-size="${fs}">${chartHM(600+i*fm)}</text>`;
 el.innerHTML=html;
}

// Keep the native select as the single form value; the popup only changes it.
let activeSelectPopup=null,selectSerial=0;
function dismissSelectMenu(focus=false){
 if(!activeSelectPopup)return;const {menu,trigger}=activeSelectPopup;activeSelectPopup=null;
 try{if(menu.matches(":popover-open"))menu.hidePopover()}catch{}menu.remove();trigger.setAttribute("aria-expanded","false");if(focus&&trigger.isConnected)trigger.focus();
}
function syncSelectMenus(){
 if(activeSelectPopup&&!activeSelectPopup.trigger.isConnected)dismissSelectMenu();
 document.querySelectorAll("select").forEach(select=>{
  let trigger=select.nextElementSibling;
  if(!trigger?.classList.contains("select-trigger")){
   trigger=document.createElement("button");trigger.type="button";trigger.className="select-trigger";trigger.setAttribute("aria-haspopup","listbox");trigger.setAttribute("aria-expanded","false");
   select.classList.add("select-native");select.tabIndex=-1;select.insertAdjacentElement("afterend",trigger);
   select.addEventListener("invalid",e=>{e.preventDefault();trigger.focus();trigger.setAttribute("aria-invalid","true")});
   trigger.addEventListener("click",()=>{if(activeSelectPopup?.trigger===trigger)dismissSelectMenu(true);else openSelectMenu(select,trigger)});
   trigger.addEventListener("keydown",e=>{if(["ArrowDown","ArrowUp"].includes(e.key)){e.preventDefault();openSelectMenu(select,trigger)}});
  }
  const text=select.selectedOptions[0]?.textContent||"اختر";
  if(trigger.dataset.current!==text){trigger.innerHTML=`<span>${E(text)}</span>${I("down")}`;trigger.dataset.current=text}
  trigger.disabled=select.disabled;
  const label=select.closest("label")?.querySelector("span")?.textContent||select.getAttribute("aria-label")||select.name||"اختيار";
  trigger.setAttribute("aria-label",label+": "+text);
 });
}
function openSelectMenu(select,trigger){
 dismissSelectMenu();if(select.disabled)return;
 const menu=document.createElement("div");menu.className="select-popup";menu.id="select-popup-"+(++selectSerial);menu.setAttribute("popover","auto");menu.setAttribute("role","listbox");menu.setAttribute("aria-label",trigger.getAttribute("aria-label"));
 trigger.setAttribute("aria-controls",menu.id);trigger.setAttribute("aria-expanded","true");
 menu.innerHTML=Array.from(select.options).map((o,i)=>`<button type="button" class="select-option" role="option" aria-selected="${o.selected}" data-option="${i}" ${o.disabled?'disabled':''}><span>${E(o.textContent)}</span><span class="option-mark">${o.selected?I("check"):""}</span></button>`).join("");
 (select.closest("dialog")||document.body).appendChild(menu);activeSelectPopup={menu,trigger,select};
 const rect=trigger.getBoundingClientRect(),w=Math.min(Math.max(rect.width,210),innerWidth-24);menu.style.width=w+"px";
 if(menu.showPopover)menu.showPopover();else menu.style.display="block";
 const below=innerHeight-rect.bottom-14,above=rect.top-14,up=below<180&&above>below;
 menu.style.maxHeight=Math.min(320,Math.max(90,up?above:below))+"px";
 menu.style.left=Math.max(12,Math.min(rect.right-w,innerWidth-w-12))+"px";
 menu.style.top=(up?Math.max(12,rect.top-menu.getBoundingClientRect().height-6):rect.bottom+6)+"px";
 menu.addEventListener("toggle",e=>{if(e.newState==="closed"&&activeSelectPopup?.menu===menu)dismissSelectMenu()});
 menu.addEventListener("click",e=>{const option=e.target.closest("[data-option]");if(!option||option.disabled)return;
  select.selectedIndex=Number(option.dataset.option);trigger.removeAttribute("aria-invalid");dismissSelectMenu(true);
  select.dispatchEvent(new Event("input",{bubbles:true}));select.dispatchEvent(new Event("change",{bubbles:true}));syncSelectMenus();
 });
 let typeBuffer="",typeTime=0;
 menu.addEventListener("keydown",e=>{
  const options=Array.from(menu.querySelectorAll("button:not(:disabled)")),at=options.indexOf(document.activeElement);
  if(e.key==="Escape"){e.preventDefault();e.stopPropagation();dismissSelectMenu(true);return}
  if(e.key==="Tab"){dismissSelectMenu(true);return}
  if(["ArrowDown","ArrowUp","Home","End"].includes(e.key)){e.preventDefault();const n=e.key==="Home"?0:e.key==="End"?options.length-1:(at+(e.key==="ArrowDown"?1:-1)+options.length)%options.length;options[n]?.focus();return}
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){const now=Date.now();typeBuffer=now-typeTime>700?e.key:typeBuffer+e.key;typeTime=now;options.find(o=>normalizeSearch(o.textContent.trim()).startsWith(normalizeSearch(typeBuffer)))?.focus()}
 });
 (menu.querySelector('[aria-selected="true"]:not(:disabled)')||menu.querySelector('button:not(:disabled)'))?.focus({preventScroll:true});
}
document.addEventListener("pointerdown",e=>{if(activeSelectPopup&&!activeSelectPopup.menu.contains(e.target)&&!activeSelectPopup.trigger.contains(e.target))dismissSelectMenu()},true);
window.addEventListener("resize",()=>dismissSelectMenu());
document.addEventListener("scroll",e=>{if(activeSelectPopup&&!activeSelectPopup.menu.contains(e.target))dismissSelectMenu()},true);
new MutationObserver(()=>syncSelectMenus()).observe(document.body,{childList:true,subtree:true});
syncSelectMenus();

</script>
